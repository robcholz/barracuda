name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The complete codebase, built and tested on the Linux host Target. Board and
  # Platform are selected explicitly: the architecture forbids inferring a Board
  # from the target, and this keeps the selection visible rather than relying on
  # the host Platform default.
  host:
    name: Host (linux) — build & test
    runs-on: ubuntu-latest
    env:
      BARRACUDA_PLATFORM: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Select Linux host Board
        run: cargo board select local-linux

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # The full codebase is too large to build for every Platform, so the non-host
  # Platforms are only compiled for their own target to prove they build. Each
  # Platform crate is built alone ("without the full thing"), with its Board
  # selected explicitly so its build script reads the right native layout.
  platform-build:
    name: Platform build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: esp32c6
            board: esp32c6-devkitc-1
            target: riscv32imac-unknown-none-elf
            features: ""
          - platform: stm32
            board: stm32f429zi-nucleo
            target: thumbv7em-none-eabihf
            features: "--features stm32f429zi"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Select ${{ matrix.platform }} Board
        run: cargo board select ${{ matrix.board }}

      - name: Build ${{ matrix.platform }} Platform
        run: cargo build -p barracuda-platform-${{ matrix.platform }} ${{ matrix.features }} --target ${{ matrix.target }}

  python:
    name: Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --all-groups

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test barracuda-trace
        working-directory: plugins/agent/crates/trace
        run: uv run --package barracuda-trace pytest

      - name: Test llm-tape
        working-directory: plugins/agent/tools/llm-tape
        run: uv run --package llm-tape pytest

      - name: Test serial-log
        working-directory: plugins/agent/crates/trace/scripts/serial_log
        run: uv run --package serial-log pytest
