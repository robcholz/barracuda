name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Validate generated source and derive the exhaustive Board matrix from the
  # catalog. Boards are grouped by compilation target so each runner can reuse
  # dependencies while still selecting and building every Board independently.
  preflight:
    name: Preflight & Board matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      board_matrix: ${{ steps.boards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo tools
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tools

      - name: Check committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check generated registries
        run: |
          cargo platform sync --check
          cargo board sync --check
          cargo plugin sync --check

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Group all Boards by target
        id: boards
        run: |
          entries='[]'
          while IFS= read -r board_file; do
            board="$(basename "$(dirname "$board_file")")"

            # local-linux is already exercised by the faster blocking job.
            if [[ "$board" == "local-linux" ]]; then
              continue
            fi

            target="$(cargo board target "$board")"
            os=ubuntu-latest
            toolchain=stable
            chip=''
            c_toolchain=none
            key="$target"

            if [[ -z "$target" ]]; then
              key="$board"
              toolchain=host
              if [[ "$board" == "local-macos" ]]; then
                os=macos-latest
              fi
            elif [[ "$target" == xtensa-* ]]; then
              toolchain=esp
              chip="${target#xtensa-}"
              chip="${chip%-none-elf}"
            elif [[ "$target" == riscv32* ]]; then
              c_toolchain=riscv
            elif [[ "$target" == thumb* ]]; then
              c_toolchain=arm
            fi

            entry="$(jq -cn \
              --arg board "$board" \
              --arg key "$key" \
              --arg os "$os" \
              --arg toolchain "$toolchain" \
              --arg chip "$chip" \
              --arg c_toolchain "$c_toolchain" \
              '{board: $board, key: $key, os: $os, toolchain: $toolchain,
                chip: $chip, c_toolchain: $c_toolchain}')"
            entries="$(jq -cn \
              --argjson entries "$entries" \
              --argjson entry "$entry" \
              '$entries + [$entry]')"
          done < <(find boards/configs -mindepth 2 -maxdepth 2 -type f -name board.yml | sort)

          matrix="$(jq -cn --argjson entries "$entries" '
            {include: ($entries
              | sort_by(.key, .board)
              | group_by(.key)
              | map({
                  key: .[0].key,
                  os: .[0].os,
                  toolchain: .[0].toolchain,
                  chip: .[0].chip,
                  c_toolchain: .[0].c_toolchain,
                  boards: map(.board)
                }))}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<< "$matrix"

  # This is the shortest complete end-user path and therefore the primary
  # blocking signal: select a real host Board, build the default application,
  # then run its tests before spending time on the exhaustive device matrix.
  linux:
    name: End-user path (local-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLATFORM_EXCLUDES: >-
        --exclude barracuda-platform-esp32
        --exclude barracuda-platform-esp32c3
        --exclude barracuda-platform-esp32c6
        --exclude barracuda-platform-esp32p4
        --exclude barracuda-platform-esp32s2
        --exclude barracuda-platform-esp32s3
        --exclude barracuda-platform-macos
        --exclude barracuda-platform-stm32
        --exclude barracuda-board-stm32f429zi-nucleo
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Linux build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: local-linux

      - name: Select Board
        run: cargo board select local-linux

      - name: Build
        run: cargo build

      - name: Test selected application
        run: cargo test

      - name: Test portable workspace
        run: cargo test --workspace $PLATFORM_EXCLUDES

      - name: Clippy portable workspace
        run: cargo clippy --workspace --all-targets $PLATFORM_EXCLUDES

  # Linux is covered by the full end-user path above. Build every other concrete
  # Platform directly. These jobs are intentionally small and parallel:
  # target/toolchain regressions fail before the expensive Board stage starts.
  platforms:
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos
            board: local-macos
            os: macos-latest
            package: barracuda-platform-macos
            toolchain: stable
          - name: esp32
            board: esp32-devkitc-v4
            os: ubuntu-latest
            package: barracuda-platform-esp32
            toolchain: esp
            chip: esp32
          - name: esp32c3
            board: esp32c3-devkitc-02
            os: ubuntu-latest
            package: barracuda-platform-esp32c3
            toolchain: stable
          - name: esp32c6
            board: esp32c6-devkitc-1
            os: ubuntu-latest
            package: barracuda-platform-esp32c6
            toolchain: stable
          - name: esp32p4
            board: esp32p4-function-ev-board
            os: ubuntu-latest
            package: barracuda-platform-esp32p4
            toolchain: stable
          - name: esp32s2
            board: esp32s2-saola-1
            os: ubuntu-latest
            package: barracuda-platform-esp32s2
            toolchain: esp
            chip: esp32s2
          - name: esp32s3
            board: esp32s3-devkitc-1
            os: ubuntu-latest
            package: barracuda-platform-esp32s3
            toolchain: esp
            chip: esp32s3
          - name: stm32
            board: stm32f429zi-nucleo
            os: ubuntu-latest
            package: barracuda-platform-stm32
            toolchain: stable
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Select representative Board
        run: |
          cargo board select ${{ matrix.board }}
          target="$(cargo board target)"
          echo "target=$target" >> "$GITHUB_ENV"

      - name: Install stable Rust target
        if: matrix.toolchain == 'stable' && matrix.name != 'macos'
        run: rustup target add "$target"

      - name: Install Rust for Xtensa
        if: matrix.toolchain == 'esp'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: ${{ matrix.chip }}
          default: false
          ldproxy: false
          override: false

      - name: Cache Platform build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-${{ matrix.name }}

      - name: Build Platform
        if: matrix.toolchain == 'stable'
        run: cargo build --package ${{ matrix.package }}

      - name: Build Platform (Xtensa)
        if: matrix.toolchain == 'esp'
        run: cargo +esp build -Zbuild-std=core --package ${{ matrix.package }}

      - name: Test Platform on host
        run: cargo test --target host-tuple --package ${{ matrix.package }}

  python:
    name: Python formatting, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --locked --all-packages --all-groups

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test barracuda-trace
        working-directory: plugins/agent/crates/trace
        run: uv run --package barracuda-trace pytest

      - name: Test llm-tape
        working-directory: tools/llm-tape
        run: uv run --package llm-tape pytest

      - name: Test serial-log
        run: >-
          uv run --package serial-log pytest
          plugins/agent/crates/trace/scripts/serial_log/tests

  # Once all fast gates pass, exercise the actual end-user build for every
  # Board. Target groups run in parallel; Boards sharing a target run serially
  # on one runner so the expensive dependency graph is compiled only once.
  boards:
    name: Boards (${{ matrix.key }})
    needs: [preflight, linux, platforms, python]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.preflight.outputs.board_matrix) }}
    env:
      BOARD_GROUP: ${{ toJSON(matrix.boards) }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install stable Rust target
        if: matrix.toolchain == 'stable'
        run: rustup target add ${{ matrix.key }}

      - name: Install C cross-toolchain
        if: matrix.c_toolchain != 'none'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.c_toolchain }}" == "riscv" ]]; then
            sudo apt-get install --no-install-recommends \
              gcc-riscv64-unknown-elf \
              picolibc-riscv64-unknown-elf
            target_env="${{ matrix.key }}"
            target_env="${target_env//[-.]/_}"
            sysroot="$(dirname "$(find /usr -path '*/riscv64-unknown-elf/include/math.h' -print -quit)")"
            sysroot="${sysroot%/include}"
            echo "CC_${target_env}=riscv64-unknown-elf-gcc" >> "$GITHUB_ENV"
            echo "CFLAGS_${target_env}=--sysroot=$sysroot" >> "$GITHUB_ENV"
          else
            sudo apt-get install --no-install-recommends \
              gcc-arm-none-eabi \
              libnewlib-arm-none-eabi
          fi

      - name: Install Rust for Xtensa
        if: matrix.toolchain == 'esp'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: ${{ matrix.chip }}
          default: false
          ldproxy: false
          override: false

      - name: Cache Board builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: boards-${{ matrix.key }}
          add-job-id-key: false

      - name: Build every Board
        if: matrix.toolchain != 'esp'
        run: |
          while IFS= read -r board; do
            echo "::group::cargo board select $board && cargo build"
            cargo board select "$board"
            cargo build
            if [[ "${{ matrix.toolchain }}" == "host" ]]; then
              cargo test
            fi
            echo "::endgroup::"
          done < <(jq -r '.[]' <<< "$BOARD_GROUP")

      - name: Build every Board (Xtensa)
        if: matrix.toolchain == 'esp'
        run: |
          while IFS= read -r board; do
            echo "::group::cargo +esp board select $board && cargo +esp build"
            cargo +esp board select "$board"
            cargo +esp build -Zbuild-std=core,alloc
            echo "::endgroup::"
          done < <(jq -r '.[]' <<< "$BOARD_GROUP")
