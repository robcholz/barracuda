name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"
  ESPUP_VERSION: v0.17.1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Validate generated source and derive the exhaustive Board matrix from the
  # catalog. Boards are grouped by compilation target so each runner can reuse
  # dependencies while still selecting and building every Board independently.
  preflight:
    name: Preflight & Board matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      board_matrix: ${{ steps.boards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo tools
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tools

      # The workspace includes the selected composition, so Cargo cannot load
      # it until some Board is selected.
      - name: Select Board
        run: cargo board select local-linux

      - name: Check committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check generated registries
        run: |
          cargo platform sync --check
          cargo board sync --check
          cargo plugin sync --check

      - name: Check CI covers every Platform
        run: |
          diff -u \
            <(printf '%s\n' esp32 esp32c3 esp32c6 esp32p4 esp32s2 esp32s3 linux macos stm32 | sort) \
            <(find platforms -mindepth 2 -maxdepth 2 -type f -name platform.yml \
              -exec dirname {} \; | xargs -n1 basename | sort)

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Group all Boards by target
        id: boards
        run: |
          entries='[]'
          while IFS= read -r board_file; do
            board="$(basename "$(dirname "$board_file")")"

            # Host Boards are already exercised by the two complete test jobs.
            if [[ "$board" == "local-linux" || "$board" == "local-macos" ]]; then
              continue
            fi

            target="$(cargo board target "$board")"
            os=ubuntu-latest
            toolchain=stable
            chip=''
            c_toolchain=none
            key="$target"

            if [[ -z "$target" ]]; then
              key="$board"
              toolchain=host
              if [[ "$board" == "local-macos" ]]; then
                os=macos-latest
              fi
            elif [[ "$target" == xtensa-* ]]; then
              toolchain=esp
              chip="${target#xtensa-}"
              chip="${chip%-none-elf}"
            elif [[ "$target" == riscv32* ]]; then
              c_toolchain=esp-riscv
            elif [[ "$target" == thumb* ]]; then
              c_toolchain=arm
            fi

            entry="$(jq -cn \
              --arg board "$board" \
              --arg key "$key" \
              --arg os "$os" \
              --arg toolchain "$toolchain" \
              --arg chip "$chip" \
              --arg c_toolchain "$c_toolchain" \
              '{board: $board, key: $key, os: $os, toolchain: $toolchain,
                chip: $chip, c_toolchain: $c_toolchain}')"
            entries="$(jq -cn \
              --argjson entries "$entries" \
              --argjson entry "$entry" \
              '$entries + [$entry]')"
          done < <(find boards/configs -mindepth 2 -maxdepth 2 -type f -name board.yml | sort)

          matrix="$(jq -cn --argjson entries "$entries" '
            {include: ($entries
              | sort_by(.key, .board)
              | group_by(.key)
              | map({
                  key: .[0].key,
                  label: (if length == 1 then .[0].board
                    else "\(.[0].board) + \(length - 1) more"
                    end),
                  os: .[0].os,
                  toolchain: .[0].toolchain,
                  chip: .[0].chip,
                  c_toolchain: .[0].c_toolchain,
                  boards: map(.board)
                }))}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<< "$matrix"

  # This is the shortest complete host validation and therefore the primary
  # blocking signal: select a real host Board, build the default application,
  # then run its tests before spending time on the exhaustive device matrix.
  linux:
    name: Host checks (local-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLATFORM_EXCLUDES: >-
        --exclude barracuda-platform-esp32
        --exclude barracuda-platform-esp32c3
        --exclude barracuda-platform-esp32c6
        --exclude barracuda-platform-esp32p4
        --exclude barracuda-platform-esp32s2
        --exclude barracuda-platform-esp32s3
        --exclude barracuda-platform-macos
        --exclude barracuda-platform-stm32
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Linux build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: local-linux

      - name: Select Board
        run: cargo board select local-linux

      - name: Install Bun for Plugin build hooks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check selected application
        run: cargo check

      - name: Build
        run: cargo build

      - name: Test selected application
        run: cargo test

      - name: Check portable workspace
        run: cargo check --workspace $PLATFORM_EXCLUDES

      - name: Test portable workspace
        run: cargo test --workspace $PLATFORM_EXCLUDES

      - name: Clippy portable workspace
        run: cargo clippy --workspace --all-targets $PLATFORM_EXCLUDES -- -D clippy::disallowed_types

  # The same shared production path is tested on the second supported host.
  # It runs in parallel with Linux: Linux normally reports first, while macOS
  # adds host/compiler integration coverage without repeating device tests.
  macos:
    name: Host checks (local-macos)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PLATFORM_EXCLUDES: >-
        --exclude barracuda-platform-esp32
        --exclude barracuda-platform-esp32c3
        --exclude barracuda-platform-esp32c6
        --exclude barracuda-platform-esp32p4
        --exclude barracuda-platform-esp32s2
        --exclude barracuda-platform-esp32s3
        --exclude barracuda-platform-linux
        --exclude barracuda-platform-stm32
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache macOS build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: local-macos

      - name: Select Board
        run: cargo board select local-macos

      - name: Install Bun for Plugin build hooks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check selected application
        run: cargo check

      - name: Build
        run: cargo build

      - name: Test selected application
        run: cargo test

      - name: Check portable workspace
        run: cargo check --workspace $PLATFORM_EXCLUDES

      - name: Test portable workspace
        run: cargo test --workspace $PLATFORM_EXCLUDES

      - name: Clippy portable workspace
        run: cargo clippy --workspace --all-targets $PLATFORM_EXCLUDES -- -D clippy::disallowed_types

  # The two host Platforms are covered by complete end-user paths above. Check,
  # lint, test, and build every device Platform independently. Native target
  # checks validate the actual implementation while host tests remain runnable.
  platforms:
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # Collect every Platform result. The Board stage is still gated on the
      # complete matrix, so any failure prevents the expensive stage.
      fail-fast: false
      matrix:
        include:
          - name: esp32
            board: esp32-devkitc-v4
            os: ubuntu-latest
            package: barracuda-platform-esp32
            toolchain: esp
            chip: esp32
          - name: esp32c3
            board: esp32c3-devkitc-02
            os: ubuntu-latest
            package: barracuda-platform-esp32c3
            toolchain: stable
            c_toolchain: esp-riscv
          - name: esp32c6
            board: esp32c6-devkitc-1
            os: ubuntu-latest
            package: barracuda-platform-esp32c6
            toolchain: stable
            c_toolchain: esp-riscv
          - name: esp32p4
            board: esp32p4-function-ev-board
            os: ubuntu-latest
            package: barracuda-platform-esp32p4
            toolchain: stable
            c_toolchain: esp-riscv
          - name: esp32s2
            board: esp32s2-saola-1
            os: ubuntu-latest
            package: barracuda-platform-esp32s2
            toolchain: esp
            chip: esp32s2
          - name: esp32s3
            board: esp32s3-devkitc-1
            os: ubuntu-latest
            package: barracuda-platform-esp32s3
            toolchain: esp
            chip: esp32s3
          - name: stm32
            board: stm32f429zi-nucleo
            os: ubuntu-latest
            package: barracuda-platform-stm32
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Rust for Xtensa
        if: matrix.toolchain == 'esp'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: ${{ matrix.chip }}
          default: false
          ldproxy: false
          override: false

      # ESP RISC-V C dependencies build with Espressif's GCC. espup writes
      # ~/export-esp.sh, which `cargo board select` loads for these Platforms.
      - name: Install Espressif RISC-V GCC
        if: matrix.c_toolchain == 'esp-riscv'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/espup" \
            "https://github.com/esp-rs/espup/releases/download/$ESPUP_VERSION/espup-x86_64-unknown-linux-gnu"
          chmod +x "$RUNNER_TEMP/espup"
          "$RUNNER_TEMP/espup" install --targets esp32c3,esp32c6,esp32p4 --esp-riscv-gcc

      - name: Select representative Board
        run: |
          cargo board select ${{ matrix.board }}
          target="$(cargo board target)"
          echo "target=$target" >> "$GITHUB_ENV"

      - name: Install stable Rust target
        if: matrix.toolchain == 'stable'
        run: rustup target add "$target"

      - name: Cache Platform build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-${{ matrix.name }}

      - name: Check Platform
        if: matrix.toolchain == 'stable'
        run: cargo check --package ${{ matrix.package }}

      - name: Check Platform (Xtensa)
        if: matrix.toolchain == 'esp'
        run: cargo check --package ${{ matrix.package }}

      - name: Clippy Platform
        if: matrix.toolchain == 'stable'
        run: cargo clippy --package ${{ matrix.package }} -- -D clippy::disallowed_types

      - name: Clippy Platform (Xtensa)
        if: matrix.toolchain == 'esp'
        run: cargo clippy --package ${{ matrix.package }} -- -D clippy::disallowed_types

      - name: Test Platform on host
        if: matrix.toolchain == 'stable'
        run: cargo test --target host-tuple --package ${{ matrix.package }}

      # Xtensa selections build only core and alloc; host tests also need std
      # from the same build, as the host-tool aliases in .cargo/config.toml do.
      - name: Test Platform on host (Xtensa)
        if: matrix.toolchain == 'esp'
        run: >-
          cargo test --config 'unstable.build-std=["std"]'
          --target host-tuple --package ${{ matrix.package }}

      - name: Build Platform
        if: matrix.toolchain == 'stable'
        run: cargo build --package ${{ matrix.package }}

      - name: Build Platform (Xtensa)
        if: matrix.toolchain == 'esp'
        run: cargo build --package ${{ matrix.package }}

  frontend:
    name: Frontend formatting, lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install shared frontend tools
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Select Board
        run: cargo board select local-linux

      - name: Build independent Plugin resources
        run: cargo plugin run build

      - name: Verify committed resource outputs
        run: |
          changes=$(git status --porcelain --untracked-files=all -- 'plugins/*/filesystem/resources')
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Test all frontend modules
        run: bun run test

  python:
    name: Python formatting, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --locked --all-packages --all-groups

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test barracuda-trace
        working-directory: plugins/agent/crates/trace
        run: uv run --package barracuda-trace pytest

      - name: Test llm-tape
        working-directory: tools/llm-tape
        run: uv run --package llm-tape pytest

      - name: Test serial-log
        run: >-
          uv run --package serial-log pytest
          plugins/agent/crates/trace/scripts/serial_log/tests

  # Once all fast gates pass, check, lint, and build every Board. Target groups
  # run in parallel; Boards sharing a target run serially so the expensive
  # dependency graph is reused.
  boards:
    name: Boards (${{ matrix.label }})
    needs: [preflight, linux, macos, platforms, python, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # This is the exhaustive stage: do not let one target hide failures in
      # another target after all fast gates have already passed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.board_matrix) }}
    env:
      BOARD_GROUP: ${{ toJSON(matrix.boards) }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install stable Rust target
        if: matrix.toolchain == 'stable'
        run: rustup target add ${{ matrix.key }}

      # ESP RISC-V C dependencies build with Espressif's GCC. espup writes
      # ~/export-esp.sh, which `cargo board select` loads for these Platforms.
      - name: Install Espressif RISC-V GCC
        if: matrix.c_toolchain == 'esp-riscv'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/espup" \
            "https://github.com/esp-rs/espup/releases/download/$ESPUP_VERSION/espup-x86_64-unknown-linux-gnu"
          chmod +x "$RUNNER_TEMP/espup"
          "$RUNNER_TEMP/espup" install --targets esp32c3,esp32c6,esp32p4 --esp-riscv-gcc

      - name: Install C cross-toolchain
        if: matrix.c_toolchain == 'arm'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Install Bun for Plugin build hooks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust for Xtensa
        if: matrix.toolchain == 'esp'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: ${{ matrix.chip }}
          default: false
          ldproxy: false
          override: false

      - name: Cache Board builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: boards-${{ matrix.key }}
          add-job-id-key: false

      - name: Check, lint & build every Board
        if: matrix.toolchain != 'esp'
        run: |
          failed=0
          while IFS= read -r board; do
            echo "::group::$board: cargo check, cargo clippy, cargo build --release"
            if cargo board select "$board" &&
              cargo check &&
              cargo clippy &&
              cargo build --release; then
              echo "$board passed"
            else
              echo "::error title=Board validation failed::$board"
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.[]' <<< "$BOARD_GROUP")
          exit "$failed"

      - name: Check, lint & build every Board (Xtensa)
        if: matrix.toolchain == 'esp'
        run: |
          failed=0
          while IFS= read -r board; do
            echo "::group::$board: cargo check, clippy, build --release"
            if cargo board select "$board" &&
              cargo check &&
              cargo clippy &&
              cargo build --release; then
              echo "$board passed"
            else
              echo "::error title=Board validation failed::$board"
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.[]' <<< "$BOARD_GROUP")
          exit "$failed"
