name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI never reuses incremental state across commits effectively. Disabling it
# and omitting dev-profile debug info reduces both compile time and cache size.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt is target-independent. Running it once over the workspace covers
  # every Platform without making each cross-compilation runner repeat the
  # exact same work.
  format:
    name: Rust formatting (all Platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # The complete codebase, built and tested on the Linux host Target. Board and
  # Platform are selected explicitly: the architecture forbids inferring a Board
  # from the target, and this keeps the selection visible rather than relying on
  # a default. The non-host Platform crates are excluded here — they only build
  # for their own target and are covered by the platform-build matrix below.
  host:
    name: Host (linux) — build & test
    runs-on: ubuntu-latest
    env:
      BARRACUDA_PLATFORM: linux
      HOST_EXCLUDES: >-
        --exclude barracuda-platform-esp32c6
        --exclude barracuda-platform-stm32
        --exclude barracuda-platform-macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Select Linux host Board
        run: cargo board select local-linux

      - name: Clippy
        run: cargo clippy --workspace --all-targets $HOST_EXCLUDES

      - name: Test
        run: cargo test --workspace $HOST_EXCLUDES

      # The non-host Platform crates carry host-runnable tests for their native
      # layout projection (partition table, linker regions, file layout). They
      # are excluded from the workspace run above because each build script needs
      # its own Board selected, so run them here one Board at a time. This is the
      # host-side coverage; the platform-build matrix proves they cross-compile.
      - name: Test non-host Platform crates (host side)
        run: |
          for entry in \
            "esp32c6-devkitc-1:barracuda-platform-esp32c6" \
            "stm32f429zi-nucleo:barracuda-platform-stm32" \
            "local-macos:barracuda-platform-macos"; do
            board="${entry%%:*}"; crate="${entry##*:}"
            echo "== $crate (Board $board) =="
            cargo board select "$board"
            cargo test --target host-tuple -p "$crate"
          done

  # Cross-check the selected Platform composition rather than naming individual
  # Platform crates or chip features here. Cargo resolves the implementation
  # and target-specific features from barracuda-platform-selected, while
  # `cargo board` supplies the Board target. This keeps Board/toolchain policy
  # out of the workflow and also exercises the same selection path as a real
  # application build.
  platform-build:
    name: Platform check (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32c6-devkitc-1
          - stm32f429zi-nucleo
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.board }}

      - name: Select Board and install its Rust target
        run: |
          cargo board select ${{ matrix.board }}
          target="$(cargo board target)"
          echo "Board ${{ matrix.board }} declares target: $target"
          rustup target add "$target"
          echo "target=$target" >> "$GITHUB_ENV"

      - name: Clippy selected Platform
        # Bare-metal targets do not provide Rust's host-only test harness.
        run: cargo clippy -p barracuda-platform-selected --target "$target"

      - name: Build selected Platform
        run: cargo build -p barracuda-platform-selected --target "$target"

  python:
    name: Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --all-groups

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test barracuda-trace
        working-directory: plugins/agent/crates/trace
        run: uv run --package barracuda-trace pytest

      - name: Test llm-tape
        working-directory: tools/llm-tape
        run: uv run --package llm-tape pytest

      - name: Test serial-log
        run: >-
          uv run --package serial-log pytest
          plugins/agent/crates/trace/scripts/serial_log/tests
