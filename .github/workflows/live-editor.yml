name: Live Editor

# Builds Live Editor (apps/live-editor) and deploys it to Vercel as a static
# site. The build needs the selected workspace, Rust's WebAssembly target and a
# PocketJS checkout, so it runs here and Vercel only serves the result
# (docs/tools/live-editor.mdx, Deploy).
#
# Needs the repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.

on:
  push:
    branches: [master]
    paths:
      - apps/live-editor/**
      - plugins/app-manager/**
      - plugins/system-fonts/filesystem/**
      - package.json
      - bun.lock
      - .github/workflows/live-editor.yml
  workflow_dispatch:

concurrency:
  group: live-editor-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"
  # The commit docs/plugins/app-manager/pocketjs.mdx names.
  POCKETJS_COMMIT: e9e417308f094ead706754164acf91436e4d05a8
  VERCEL_CLI: vercel@64.5.0
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: live-editor
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: live-editor

      - name: Select Board
        run: cargo board select local-linux

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Check out PocketJS
        uses: actions/checkout@v7
        with:
          repository: pocket-nexus/pocketjs
          ref: ${{ env.POCKETJS_COMMIT }}
          path: .pocketjs

      - name: Install PocketJS dependencies
        working-directory: .pocketjs
        run: bun install --frozen-lockfile

      - name: Build Live Editor
        run: POCKETJS_ROOT="$GITHUB_WORKSPACE/.pocketjs" bun apps/live-editor/web/build.ts

      - name: Test Live Editor
        run: |
          cargo test --package barracuda-live-editor-wasm
          bun test ./apps/live-editor/web

      # Vercel's Build Output API: the site as static files, deployed as built.
      - name: Prepare the deployment
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R apps/live-editor/web/dist/. .vercel/output/static/
          rm -f .vercel/output/static/*.map .vercel/output/static/workers/*.map
          echo '{"version": 3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
