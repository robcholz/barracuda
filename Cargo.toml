[workspace]
resolver = "2"
members = [
    "boards/api",
    "boards/config",
    "drivers/indicator-led",
    "boards/tool",
    "boards/configs/*/hal",
    "bench/crates/*",
    "composition/*",
    "core/plugin",
    "core/plugin/crates/*",
    "core/system",
    "plugins/*/crates/*",
    "platforms/*",
    "shared/*",
    "tools/plugin-tool",
    "tools/system-image",
    "apps/barracuda-cli",
    "apps/barracuda-system",
]
default-members = [
    "apps/barracuda-system",
]

[workspace.dependencies]
# Workspace crates
# BEGIN GENERATED PLATFORM WORKSPACE DEPENDENCIES
barracuda-platform-browser = { path = "platforms/browser" }
barracuda-platform-esp32 = { path = "platforms/esp32" }
barracuda-platform-esp32c3 = { path = "platforms/esp32c3" }
barracuda-platform-esp32c6 = { path = "platforms/esp32c6" }
barracuda-platform-esp32p4 = { path = "platforms/esp32p4" }
barracuda-platform-esp32s2 = { path = "platforms/esp32s2" }
barracuda-platform-esp32s3 = { path = "platforms/esp32s3" }
barracuda-platform-linux = { path = "platforms/linux" }
barracuda-platform-macos = { path = "platforms/macos" }
barracuda-platform-stm32 = { path = "platforms/stm32" }
# END GENERATED PLATFORM WORKSPACE DEPENDENCIES
# BEGIN GENERATED BOARD WORKSPACE DEPENDENCIES
barracuda-board-stm32f429zi-nucleo = { path = "boards/configs/stm32f429zi-nucleo/hal" }
# END GENERATED BOARD WORKSPACE DEPENDENCIES
# BEGIN GENERATED PLUGIN WORKSPACE DEPENDENCIES
barracuda-agent-plugin = { path = "plugins/agent/crates/plugin" }
barracuda-agent-file-plugin = { path = "plugins/agent-file/crates/plugin" }
barracuda-agent-http-plugin = { path = "plugins/agent-http/crates/plugin" }
barracuda-agent-imessage-gateway-plugin = { path = "plugins/agent-imessage-gateway/crates/plugin" }
barracuda-agent-scheduler-plugin = { path = "plugins/agent-scheduler/crates/plugin" }
barracuda-agent-time-plugin = { path = "plugins/agent-time/crates/plugin" }
barracuda-agent-vm-plugin = { path = "plugins/agent-vm/crates/plugin" }
barracuda-agent-websearch-plugin = { path = "plugins/agent-websearch/crates/plugin" }
barracuda-agent-workflow-plugin = { path = "plugins/agent-workflow/crates/plugin" }
barracuda-captive-portal-plugin = { path = "plugins/captive-portal/crates/plugin" }
barracuda-http-plugin = { path = "plugins/http/crates/plugin" }
barracuda-imessage-bluebubble-plugin = { path = "plugins/imessage-bluebubble/crates/plugin" }
barracuda-imessage-gateway-plugin = { path = "plugins/imessage-gateway/crates/plugin" }
barracuda-imessage-inkbox-plugin = { path = "plugins/imessage-inkbox/crates/plugin" }
barracuda-imessage-qq-plugin = { path = "plugins/imessage-qq/crates/plugin" }
barracuda-imessage-telegram-plugin = { path = "plugins/imessage-telegram/crates/plugin" }
barracuda-imessage-web-plugin = { path = "plugins/imessage-web/crates/plugin" }
barracuda-imessage-wechat-plugin = { path = "plugins/imessage-wechat/crates/plugin" }
barracuda-scheduler-plugin = { path = "plugins/scheduler/crates/plugin" }
barracuda-time-plugin = { path = "plugins/time/crates/plugin" }
barracuda-vm-plugin = { path = "plugins/vm/crates/plugin" }
barracuda-vm-agent-plugin = { path = "plugins/vm-agent/crates/plugin" }
barracuda-gpio-plugin = { path = "plugins/vm-gpio/crates/plugin" }
barracuda-i2c-plugin = { path = "plugins/vm-i2c/crates/plugin" }
barracuda-message-queue-plugin = { path = "plugins/vm-message-queue/crates/plugin" }
barracuda-spi-plugin = { path = "plugins/vm-spi/crates/plugin" }
barracuda-webserver-plugin = { path = "plugins/webserver/crates/plugin" }
barracuda-workflow-plugin = { path = "plugins/workflow/crates/plugin" }
# END GENERATED PLUGIN WORKSPACE DEPENDENCIES

barracuda-board = { path = "boards/api" }
barracuda-board-config = { path = "boards/config" }
barracuda-board-hal = { path = "boards/hal" }
barracuda-board-selected = { path = "boards/selected" }
barracuda-board-tool = { path = "boards/tool" }
barracuda-cli-style = { path = "shared/cli-style" }
barracuda-indicator-led = { path = "drivers/indicator-led" }
barracuda-kv = { path = "shared/kv" }
barracuda-minimal-yaml = { path = "shared/minimal-yaml" }
barracuda-platform = { path = "platforms/api" }
barracuda-platform-config = { path = "platforms/config" }
barracuda-platform-selected = { path = "platforms/selected" }
barracuda-platform-test = { path = "platforms/test" }
barracuda-platform-tool = { path = "platforms/tool" }
barracuda-plugin = { path = "core/plugin" }
barracuda-plugin-tool = { path = "tools/plugin-tool" }
barracuda-profile = { path = "shared/profile" }
barracuda-runtime-utils = { path = "shared/runtime-utils" }
barracuda-system = { path = "core/system" }
barracuda-target = { path = "composition/selected" }
barracuda-target-api = { path = "composition/api" }
barracuda-tls = { path = "shared/tls" }
barracuda-vfs = { path = "shared/vfs" }
barracuda-vfs-fat = { path = "shared/vfs-fat" }
barracuda-vfs-littlefs = { path = "shared/vfs-littlefs" }
barracuda-vfs-memfs = { path = "shared/vfs-memfs" }
http-client = { path = "shared/http-client" }
json-validator = { path = "shared/json-validator" }
json-validator-macros = { path = "shared/json-validator-macros" }

# Shared third-party versions and features
embassy-time = { version = "0.5.1", default-features = false }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-sync = { version = "0.7.2", default-features = false }
embassy-executor = { version = "0.9.1", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = ["dns", "medium-ip", "proto-ipv4", "tcp", "udp"] }
embassy-net-driver-channel = { version = "0.4.0", default-features = false }
embedded-storage-async = "0.4.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
log = { version = "0.4", default-features = false }

[patch.crates-io]
littlefs2-sys = { path = "shared/littlefs2-sys" }
# picoserve 0.19.0 gates core Error implementations on its `std` feature,
# which breaks when another workspace crate enables serde/std. This upstream
# commit keeps the same release API and derives portable Error implementations.
picoserve = { git = "https://github.com/sammhicks/picoserve.git", rev = "dbe0513e21e6e28a04446e4027e1d337d83d8b24" }

# Device images abort on panic. Dev/test profiles keep the default unwind so
# the std crates can be unit-tested on the host. LTO remains disabled so final
# applications can select the link strategy appropriate to their target.
[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false

# Host profiling keeps the same size-oriented optimization as firmware while
# retaining source locations for allocation backtraces.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
