barracuda-system = { path = "core/system" }
barracuda-target = { path = "composition/selected" }
barracuda-target-api = { path = "composition/api" }
barracuda-time-component = { path = "plugins/time/crates/component" }
barracuda-tls = { path = "shared/tls" }
barracuda-vfs = { path = "shared/vfs" }
barracuda-vfs-littlefs = { path = "shared/vfs-littlefs" }
barracuda-vfs-memfs = { path = "shared/vfs-memfs" }
barracuda-vm-builtin-packages = { path = "plugins/vm/crates/builtin-packages" }
barracuda-vm-component = { path = "plugins/vm/crates/component" }
barracuda-vm-package-api = { path = "plugins/vm/crates/package-api" }
barracuda-workflow = { path = "core/event-router/crates/workflow" }
bluebubbles = { path = "plugins/imessage-bluebubble/crates/provider" }
gateway = { path = "plugins/imessage-gateway/crates/gateway" }
gateway-http = { path = "plugins/imessage-gateway/crates/http" }
