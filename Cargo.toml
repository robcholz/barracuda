[workspace]
resolver = "2"
members = [
    "boards/api",
    "boards/config",
    "peripherals/api",
    "peripherals/config",
    "peripherals/impl/*/*",
    "drivers/chips/*",
    "drivers/datasheet-tests",
    "boards/tool",
    "bench/crates/*",
    "composition/*",
    "core/plugin",
    "core/plugin/crates/*",
    "core/system",
    "plugins/*/crates/*",
    "platforms/*",
    "platforms/macos/network-gateway",
    "platforms/macos/network-gateway-protocol",
    "shared/*",
    "tools/plugin-tool",
    "tools/system-image",
    "apps/barracuda-cli",
    "apps/barracuda-system",
]
default-members = [
    "apps/barracuda-system",
]
exclude = [
    # Live Editor's WebAssembly module builds on its own, without a Board, so
    # its static site can build anywhere (apps/live-editor/web/vercel.sh).
    "apps/live-editor/wasm",
    # Vendored third-party crate, patched below.
    "shared/tls/mbedtls-rs",
    "shared/vfs-littlefs/littlefs2",
    "apps/barracuda-cli/rustyline",
]

[workspace.dependencies]
portable-atomic = { version = "1.15", default-features = false }
async-channel = { version = "2", default-features = false, features = ["portable-atomic"] }
event-listener = { version = "5", default-features = false, features = ["critical-section", "portable-atomic"] }
futures-core = { version = "0.3", default-features = false, features = ["portable-atomic"] }
futures-util = { version = "0.3", default-features = false, features = ["portable-atomic"] }
portable-atomic-util = { version = "0.2.7", default-features = false, features = ["alloc"] }
# Workspace crates
# BEGIN GENERATED PLATFORM WORKSPACE DEPENDENCIES
barracuda-platform-esp32 = { path = "platforms/esp32" }
barracuda-platform-esp32c3 = { path = "platforms/esp32c3" }
