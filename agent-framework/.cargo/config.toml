# Device builds pass an explicit `*-espidf` target resolved from `IDF_TARGET`
# by CMake. Keep the workspace default target unset so a plain `cargo check`
# remains a fast host check during normal Rust development.
#
# The targets use `target_os = "espidf"` so `libc` and `std` use the ESP-IDF
# ABI. Device builds use the Espressif Rust toolchain and
# `-Zbuild-std=std,panic_abort`; final linking happens in the IDF image.

[target.'cfg(target_os = "espidf")']
# ESP-IDF v5+ uses a 64-bit time_t; this makes `libc` agree.
rustflags = ["--cfg", "espidf_time64"]
