[package]
name = "claw-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host CLI applications for the ESP-Claw agent framework"

[[bin]]
name = "claw-agent-chat"
path = "src/main.rs"

[dependencies]
claw-agent = { path = "../../components/agent/crates/claw-agent", default-features = false, features=["cache_profile", "multiagent", "intrusive-observability"] }
claw-api = { path = "../../components/agent/crates/claw-api", features = ["mbedtls-host"] }
claw-net = { path = "../../shared/claw-net", features = ["tokio"] }
claw-fs = { path = "../../shared/claw-fs", features = ["diskfs"] }
claw-log = { path = "../../components/agent/crates/claw-log" }
anyhow = "1"
dotenvy = "0.15"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-lite = "2"
anstyle = "1"
rustyline = { version = "18.0.1", default-features = false }
strum = { version = "0.28", features = ["derive"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
thiserror = "2"
static_cell = "2"
rand_core = "0.10.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[dev-dependencies]
claw-net = { path = "../../shared/claw-net", features = ["testing"] }
tempdir = "0.3"
