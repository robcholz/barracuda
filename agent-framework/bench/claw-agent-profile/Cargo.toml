[package]
name = "claw-agent-profile"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host profiling scenarios for the assembled Claw agent"
publish = false
default-run = "claw-agent-profile"

[[bin]]
name = "claw-agent-profile"
path = "src/main.rs"

[dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
claw-agent = { path = "../../crates/claw-agent" }
claw-api = { path = "../../crates/claw-api" }
claw-net = { path = "../../crates/claw-net", features = ["testing"] }
claw-fs = { path = "../../crates/claw-fs" }
claw-profile = { path = "../claw-profile", features = ["dhat-heap"] }
