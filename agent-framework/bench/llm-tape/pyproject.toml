[project]
name = "llm-tape"
version = "0.1.0"
description = "Content-agnostic byte recorder and deterministic replay server for LLM HTTP APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "loguru>=0.7,<1",
]

[project.scripts]
llm-tape = "llm_tape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tape"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
