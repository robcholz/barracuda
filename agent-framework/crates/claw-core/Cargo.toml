[package]
name = "claw-core"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Agent execution runtime, Session control, and iteration primitives"
# Agent manifests under `resources/agents/<kind>/` are parsed + validated at
# compile time and emitted as typed catalog entries (see `manifest_gen/`),
# so malformed metadata fails the build instead of the device at boot.
build = "manifest_gen/main.rs"

[lib]
# claw_core is a pure-Rust rlib bundled (with the other logic crates) into the
# single `claw_rt` staticlib that the firmware links.
crate-type = ["rlib"]

[features]
# Host-side API/cache profiling. Kept out of defaults so firmware does not pay
# for diagnostic-only response fields and session events.
cache_profile = ["claw-api/cache_profile"]
# Compile the Session-scoped subagent graph, tools, and lifecycle driver.
# Disabled builds contain only the root-Agent Session path.
multiagent = []

# Compile-time byte cap on accumulated `SessionEvent::Reasoning` deltas in one
# iteration. EXACTLY ONE may be enabled (event.rs emits a compile_error! for zero
# or multiple). Default is `reasoning_short`; to change the tier, disable
# defaults (`default-features = false`) and pick one.
default = ["reasoning_short"]
reasoning_short = []  # 2000 bytes
reasoning_medium = [] # 8000 bytes
reasoning_long = []   # 32000 bytes

[dependencies]
claw-interface = { path = "../claw-interface" }
claw-utils = { path = "../claw-utils" }
claw-api = { path = "../claw-api" }
claw-net = { path = "../claw-net" }
embassy-time.workspace = true
claw-persistence = { path = "../claw-persistence" }
# Vetted async MPMC channel (smol family, same lineage as `edge-executor`). Each
# open session gets one unbounded channel that carries its `SessionEvent` stream.
async-channel = { version = "2", default-features = false }
# The `Stream` trait `async_channel::Receiver` implements, so
# `SessionEventStream` can poll it. `default-features = false` keeps this
# `no_std`-friendly for the device.
futures-core = { version = "0.3", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
# `SelectAll` fairly merges the per-batch detached-tool completion streams the
# Agent wrapper tracks, replacing a hand-written round-robin poll queue.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getset = "0.1.7"
# The runtime is exposed as an ordinary Future. The application chooses Embassy,
# Tokio, or another executor and spawns that future at its own boundary.
claw-memory = { path = "../claw-memory" }
claw-skill = { path = "../claw-skill" }
claw-context = { path = "../claw-context" }
claw-permission = { path = "../claw-permission" }
# The tool runtime used by core agents.
claw-tool = { path = "../claw-tool" }
# Flat production diagnostics. Compile-time level ceilings are selected by the
# final application through `log`'s max-level features.
log = { version = "0.4", default-features = false }
# Observability facade reserved for the trace instrumentation pass. `log-always`
# is intentionally NOT enabled: with a real subscriber it would double-emit every
# event (once via the log bridge, once via the subscriber). The facade stays
# `no_std`; `attributes` is enabled for the spans used by the runtime.
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

[build-dependencies]
# The build script parses the agent manifest JSON at compile time and generates
# typed catalog entries into `OUT_DIR`. `quote`/`proc-macro2` build the
# generated source as a typed token stream (no `syn`, so no extra build cost).
# `anyhow` is build-only: it gives the generator ergonomic, context-rich errors
# and never reaches the device image.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
proc-macro2 = "1"
claw-tool = { path = "../claw-tool", features = ["build-support"] }

[dev-dependencies]
# Host-only test generators; production streams use the internal no_std adapter.
async-stream = "0.3"
# Host filesystem implementation shared from claw-interface (tests only).
claw-interface = { path = "../claw-interface", features = [
    "diskfs",
] }
# Never-compacts `NoopCompactor` shared from claw-memory (tests only).
claw-memory = { path = "../claw-memory", features = ["compactor-stub"] }
# `block_on` for tests (smol family; replaces the removed `claw_utils::block_on`).
futures-lite = "2"
claw-net = { path = "../claw-net", features = ["testing"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
