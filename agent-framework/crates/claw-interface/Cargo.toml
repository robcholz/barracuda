[package]
name = "claw-interface"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Filesystem dependency-injection traits for ESP-Claw"

[lib]
crate-type = ["rlib"]

[features]
# Concepts:
# - target selection and concrete HAL adapters live at the application boundary.
# - `host-backends` is the opt-in host filesystem implementation used by host
#   CLIs and live host tests.
# - `dev` belongs to application crates that bundle workflows; this crate only
#   exposes implementations and doubles.
#
# Nothing is enabled by default so pure core/device crates only see the traits.
default = []
host-backends = ["diskfs"]

# - `diskfs`:       `std::fs` backend for host CLIs and disk-backed tests.
# - `diskfs-pretty`: pretty-print `.json` writes via serde_json (implies diskfs).
diskfs = []
diskfs-pretty = ["diskfs", "dep:serde_json"]
[dependencies]
thiserror = { version = "2", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
embedded-executor = "0.6.1"
lock_api = "0.4.14"
# Ergonomic error handling for the host dev workflow `di_seams` example.
anyhow = "1"

[[example]]
name = "di_seams"
