[package]
name = "claw-memory"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Agent memory subsystem: conversation tape and compaction"

[lib]
crate-type = ["rlib"]

[features]
# `NoopCompactor`: a never-compacts stub for host-target CLIs and tests.
compactor-stub = []

[dependencies]
# Core crate: depends only on the inbound trait crate. The concrete `ClawFs` and
# `Compactor` (e.g. `claw_core::LlmCompactor`) are passed in by the caller, so
# this crate pulls in neither a concrete platform boundary nor the LLM
# client (`claw-api`).
claw-fs = { path = "../claw-fs" }
# Shared id/allocator macros (`define_id_allocator!` for the `TurnId` counter).
claw-utils = { path = "../claw-utils" }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# Host-target helpers for tests/examples/doctests: `diskfs-pretty` is a
# disk-backed inspection backend. None of these reach device builds.
claw-fs = { path = "../claw-fs", features = ["diskfs-pretty"] }
# Ergonomic error handling for the host dev workflow `conversation` example.
anyhow = "1"
# `block_on` for the `Compactor` doctest (smol family; replaces the removed
# `claw_utils::block_on`).
futures-lite = "2"
