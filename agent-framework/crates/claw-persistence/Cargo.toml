[package]
name = "claw-persistence"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Persistence interfaces for durable runtime state"

[lib]
crate-type = ["rlib"]

[dependencies]
claw-fs = { path = "../claw-fs" }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
claw-fs = { path = "../claw-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
