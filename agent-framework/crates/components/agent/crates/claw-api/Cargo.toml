[package]
name = "claw-api"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "OpenAI-/Anthropic-compatible LLM client chat + media"

[lib]
name = "claw_api"
crate-type = ["rlib"]

[features]
cache_profile = []
embedded-tls = ["reqwless/embedded-tls"]
mbedtls = ["reqwless/mbedtls-rs"]
mbedtls-host = [
    "mbedtls",
    "dep:mbedtls-rs",
    "mbedtls-rs/std",
    "mbedtls-rs/pem-parse",
    "dep:critical-section",
]

[dependencies]
claw-utils = { path = "../../../../shared/claw-utils" }
embassy-time.workspace = true
embassy-futures.workspace = true
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
ouroboros = { version = "0.18.5", default-features = false }
reqwless = { git = "https://github.com/drogue-iot/reqwless.git", rev = "b761705cc654e6f31bc064183e219aa09b33968a", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
futures-core = { version = "0.3", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
eventsource-stream = { version = "0.2.3", default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
# Shape-only attempt/retry spans consumed by the firmware's claw-log subscriber.
tracing = { version = "0.1", default-features = false }
mbedtls-rs = { version = "0.1.0", default-features = false, optional = true }
critical-section = { version = "1", features = ["std"], optional = true }

[dev-dependencies]
claw-net = { path = "../../../../shared/claw-net", features = ["testing"] }
embedded-io = "0.7"
serde_json = "1"
# Ergonomic error handling for host-target doc-tests and the chat example.
anyhow = "1"
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"
tempdir = "0.3"
# Capturing subscriber used by the attempt/retry trace contract tests.
claw-log = { path = "../claw-log" }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unsafe_code = "forbid"
