[package]
name = "barracuda-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host CLI applications for the barracuda agent framework"

[[bin]]
name = "barracuda"
path = "src/main.rs"

[dependencies]
web = { path = "../../plugins/message-gateway/crates/web" }
barracuda-agent-plugin = { path = "../../plugins/agent/crates/plugin" }
barracuda-event-router = { path = "../../core/event-router" }
barracuda-model-api = { path = "../../plugins/agent/crates/model-api" }
barracuda-net = { path = "../../shared/net", features = ["tokio"] }
barracuda-plugin-manager = { path = "../../core/plugin-manager" }
barracuda-system = { path = "../../core/system", features = ["tokio"] }
anyhow = "1"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
ekv = { version = "1", features = ["std"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
anstyle = "1"
rustyline = { version = "18.0.1", default-features = false }
strum = { version = "0.28", features = ["derive"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
