[package]
name = "barracuda-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host CLI applications for the barracuda agent framework"

[[bin]]
name = "barracuda"
path = "src/main.rs"

[dependencies]
barracuda-imessage-web-plugin.workspace = true
anyhow = "1"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
anstyle = "1"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
rustyline = { version = "18.0.1", default-features = false }
strum = { version = "0.28", features = ["derive"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
thiserror = "2"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
