[package]
name = "barracuda-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host CLI applications for the barracuda agent framework"

[[bin]]
name = "barracuda"
path = "src/main.rs"

[dependencies]
barracuda-agent-runtime = { path = "../../components/agent/crates/runtime", default-features = false, features=["cache_profile", "multiagent", "intrusive-observability"] }
barracuda-model-api = { path = "../../components/agent/crates/model-api", features = ["mbedtls-host"] }
barracuda-net = { path = "../../shared/net", features = ["tokio"] }
barracuda-fs = { path = "../../shared/fs", features = ["diskfs"] }
barracuda-agent-trace = { path = "../../components/agent/crates/trace" }
anyhow = "1"
dotenvy = "0.15"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-lite = "2"
anstyle = "1"
rustyline = { version = "18.0.1", default-features = false }
strum = { version = "0.28", features = ["derive"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
thiserror = "2"
static_cell = "2"
rand_core = "0.10.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[dev-dependencies]
barracuda-net = { path = "../../shared/net", features = ["testing"] }
tempdir = "0.3"
