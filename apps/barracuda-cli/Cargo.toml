[package]
name = "barracuda-cli"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host CLI applications for the barracuda agent framework"

[[bin]]
name = "barracuda"
path = "src/main.rs"

[dependencies]
web = { path = "../../plugins/imessage-web/crates/provider" }
barracuda-event-router = { path = "../../core/event-router" }
barracuda-target = { path = "../../composition/selected" }
barracuda-system = { path = "../../core/system", features = ["tokio"] }
anyhow = "1"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-sync.workspace = true
anstyle = "1"
rustyline = { version = "18.0.1", default-features = false }
strum = { version = "0.28", features = ["derive"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
