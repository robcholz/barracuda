[package]
name = "barracuda-live-editor-wasm"
version = "0.1.0"
edition = "2024"
description = "Live Editor's WebAssembly module: links MicroTS views as ui-link does and previews them as the device draws them"
license = "Apache-2.0"
publish = false

[lib]
# `cdylib` is the WebAssembly module the web app loads; `rlib` serves the host tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
barracuda-ui-runtime = { path = "../../../plugins/app-manager/crates/runtime", features = ["compiler"] }
serde_json = "1"

[lints.rust]
# The WebAssembly exports need `#[unsafe(no_mangle)]`; only that module allows it.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Its own workspace: the device workspace needs a Board selected, and this
# module builds without one. The release profile is the device workspace's.
[workspace]

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = "fat"
