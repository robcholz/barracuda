[package]
name = "barracuda-agent-profile"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host profiling scenarios for the assembled Barracuda agent"
publish = false
default-run = "barracuda-agent-profile"

[[bin]]
name = "barracuda-agent-profile"
path = "src/main.rs"

[dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
barracuda-agent-runtime.workspace = true
barracuda-model-api.workspace = true
barracuda-platform-test.workspace = true
barracuda-profile = { workspace = true, features = ["dhat-heap"] }
http-client.workspace = true
futures-lite = "2"
base64 = "0.22"
serde_json = "1"
barracuda-runtime-utils.workspace = true
