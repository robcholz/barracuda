[package]
name = "barracuda-agent-profile"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host profiling scenarios for the assembled Barracuda agent"
publish = false
default-run = "barracuda-agent-profile"

[[bin]]
name = "barracuda-agent-profile"
path = "src/main.rs"

[dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
barracuda-agent-runtime = { path = "../../../plugins/agent/crates/runtime" }
barracuda-agent-skill = { path = "../../../plugins/agent/crates/skill", features = ["std"] }
barracuda-model-api = { path = "../../../plugins/agent/crates/model-api" }
barracuda-platform-test = { path = "../../../platforms/test" }
barracuda-profile = { path = "../../../shared/profile", features = ["dhat-heap"] }
http-client = { path = "../../../shared/http-client" }
futures-lite = "2"
base64 = "0.22"
serde_json = "1"
barracuda-runtime-utils = { path = "../../../shared/runtime-utils" }
