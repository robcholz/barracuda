[package]
name = "barracuda-chip-esp32s3"
version = "0.1.0"
edition = "2024"
description = "ESP32-S3 Board binding adapter for generated Barracuda HALs"
license = "Apache-2.0"

[dependencies]
barracuda-board-hal.workspace = true
embedded-hal.workspace = true
embedded-hal-bus.workspace = true
static_cell.workspace = true

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "1.2.0-rc.0", default-features = false, features = ["critical-section", "esp32s3", "unstable"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
