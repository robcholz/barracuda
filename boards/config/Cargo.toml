[package]
name = "barracuda-board-config"
version = "0.1.0"
edition = "2021"
description = "Build-time YAML loading and validation for Barracuda boards"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
yaml-peg = { version = "1.0.8", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
