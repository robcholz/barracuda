name: esp32-devkitc-v4
hardware:
  chip: esp32
  # ESP32-WROOM-32E-N4 (DevKitC-32E).
  flash-size: 4mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # BOOT on GPIO0, active low, with the pull-up Espressif's esp_boards
    # `esp32_devkitc` enables.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
      parameters:
        pull: up
