name: esp32c3-devkitc-02
hardware:
  chip: esp32c3
  # ESP32-C3-WROOM-02-N4.
  flash-size: 4mb
toolchain:
  target: riscv32imc-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # BOOT on GPIO9, active low, with the pull-up Espressif's esp_boards
    # `esp32_c3_devkitc_02` enables.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO9
      parameters:
        pull: up
