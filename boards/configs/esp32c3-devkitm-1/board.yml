name: esp32c3-devkitm-1
hardware:
  chip: esp32c3
  # ESP32-C3-MINI-1 (ESP32-C3FN4).
  flash-size: 4mb
toolchain:
  target: riscv32imc-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # BOOT on GPIO9, active low, with the pull-up Espressif's esp_boards
    # `esp32_c3_devkitm_1` enables.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO9
      parameters:
        pull: up
