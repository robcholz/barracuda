name: esp32c6-devkitm-1
hardware:
  chip: esp32c6
  # ESP32-C6-MINI-1-N4.
  flash-size: 4mb
toolchain:
  target: riscv32imac-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-output:
      rgb-led-data:
        # One WS2812 on GPIO8 (Espressif esp32_c6_devkitm_1 board_devices.yaml).
        data: GPIO8
        frequency-hz: 2400000
  devices:
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
