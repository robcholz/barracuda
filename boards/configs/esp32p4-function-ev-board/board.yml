name: esp32p4-function-ev-board
hardware:
  chip: esp32p4
  # ESP32-P4 with 32 MB in-package PSRAM.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: hex
    size-bytes: 33554432
  # ESP32-C6-MINI-1 with Espressif's factory ESP-Hosted-MCU slave firmware
  # (0.0.6 per ESP-Hosted's "ESP-Hosted on the ESP32-P4-Function-EV-Board")
  # on SDIO slot 1: CLK GPIO18, CMD GPIO19, D0-D3 GPIO14-17, and the C6's
  # enable on GPIO54 (Espressif's esp32_p4_function_ev_board
  # `CONFIG_ESP_HOSTED_PRIV_SDIO_*` defaults and ESP-Hosted's log of the
  # board). 40 MHz is ESP-Hosted's SDIO clock for an ESP32-P4 host.
  wifi-coprocessor:
    chip: esp32c6
    firmware: esp-hosted-mcu
    sdio:
      slot: 1
      clk: GPIO18
      cmd: GPIO19
      d0: GPIO14
      d1: GPIO15
      d2: GPIO16
      d3: GPIO17
      frequency-hz: 40000000
    reset: GPIO54
  # IP101GRI 10/100 PHY on the EMAC's RMII pads. The PHY drives the 50 MHz
  # reference clock into GPIO50. Pins, reset and PHY address 1: ESP-IDF's
  # ethernet_init Kconfig defaults for the ESP32-P4 and espp's
  # esp32-p4-function-ev-board BSP. GPIO35 (BOOT) is RMII TXD1.
  ethernet:
    phy:
      model: ip101gri
      address: 1
      reset: GPIO51
    rmii:
      reference-clock:
        source: external
        input: GPIO50
      mdc: GPIO31
      mdio: GPIO52
      tx-en: GPIO49
      txd0: GPIO34
      txd1: GPIO35
      crs-dv: GPIO28
      rxd0: GPIO29
      rxd1: GPIO30
toolchain:
  target: riscv32imafc-unknown-none-elf
native-layout:
  artifact: partitions.csv
plugins:
  imessage-gateway:
    # No channel receive connections on this Board.
    receive-slots: 0
