name: esp32s3-box-3
profile: screen
hardware:
  chip: esp32s3
  # ESP32-S3-WROOM-1-N16R16V.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 16777216
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        # Espressif esp_boards `esp32_s3_box_3` board_peripherals.yaml
        # (`spi_display`) and board_devices.yaml (`display_lcd`).
        peripheral: SPI2
        sck: GPIO7
        mosi: GPIO6
        chip-select: GPIO5
        frequency-hz: 20000000
  devices:
    display:
      implementation: mipi-dbi-display
      bindings:
        backlight: GPIO47
        dc: GPIO4
        # Shared with the touch controller's reset; the board drives it active-high.
        reset: GPIO48
        spi: display-spi
      parameters:
        # Espressif drives the ILI9342C through esp_lcd_ili9341 with the
        # ILI9342C extended-command key (C8h FF 93 42), MADCTL BGR, and both
        # axes mirrored.
        controller: ili9342c
        width: 320
        height: 240
        color-order: bgr
        orientation: deg180
        reset-active-high: true
exposed-io:
  pins:
    # ESP32-S3-BOX-3-DOCK PMOD1 and PMOD2, labelled IO1-IO8 (esp-bsp esp-box-3.h
    # `BSP_PMOD*`). PMOD1 IO2 and IO6 are the USB D+/D- lines and stay unexposed.
    pmod1-io1: { pin: GPIO42 }
    pmod1-io3: { pin: GPIO39 }
    pmod1-io4: { pin: GPIO40 }
    pmod1-io5: { pin: GPIO21 }
    pmod1-io7: { pin: GPIO38 }
    pmod1-io8: { pin: GPIO41 }
    pmod2-io1: { pin: GPIO13 }
    pmod2-io2: { pin: GPIO9 }
    pmod2-io3: { pin: GPIO12 }
    pmod2-io4: { pin: GPIO44 }
    pmod2-io5: { pin: GPIO10 }
    pmod2-io6: { pin: GPIO14 }
    pmod2-io7: { pin: GPIO11 }
    pmod2-io8: { pin: GPIO43 }
