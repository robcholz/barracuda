name: esp32s3-devkitc-1
hardware:
  chip: esp32s3
  # ESP32-S3-WROOM-1-N8R8, the variant in production.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-output:
      rgb-led-data:
        # ESP32-S3-DevKitC-1 v1.1: one WS2812 on GPIO38 (Espressif esp_boards
        # `esp32_s3_devkitc_1`, GRB). v1.0 boards drive it on GPIO48 instead.
        data: GPIO38
        frequency-hz: 2400000
  devices:
    # The WS2812 RGB LED, GRB order (Espressif esp_boards `esp32_s3_devkitc_1`).
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    # BOOT on GPIO0, active low, with the pull-up Espressif's esp_boards
    # `esp32_s3_devkitc_1` enables.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
      parameters:
        pull: up
exposed-io:
  pins:
    expansion-1: { pin: GPIO1 }
    expansion-2: { pin: GPIO2 }
    expansion-3: { pin: GPIO3 }
    expansion-4: { pin: GPIO4 }
