name: esp32s3-devkitc-1
hardware:
  chip: esp32s3
  # ESP32-S3-WROOM-1-N8R8, the variant in production.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
exposed-io:
  pins:
    expansion-1: { pin: GPIO1 }
    expansion-2: { pin: GPIO2 }
    expansion-3: { pin: GPIO3 }
    expansion-4: { pin: GPIO4 }
