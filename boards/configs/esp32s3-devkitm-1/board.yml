name: esp32s3-devkitm-1
hardware:
  chip: esp32s3
  # ESP32-S3-MINI-1 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # BOOT on GPIO0, active low, with the pull-up Espressif's esp_boards
    # `esp32_s3_devkitm_1` enables.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
      parameters:
        pull: up
