name: esp32s3-devkitm-1
hardware:
  chip: esp32s3
  # ESP32-S3-MINI-1 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-output:
      rgb-led-data:
        # One WS2812 on GPIO48 (Espressif esp32_s3_devkitm_1 board_devices.yaml).
        data: GPIO48
        frequency-hz: 2400000
  devices:
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
