name: esp32s3-eye
profile: screen
hardware:
  chip: esp32s3
  # ESP32-S3-WROOM-1 with ESP32-S3R8.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      camera-control:
        # Espressif ESP32-S3-EYE BSP: OV2640 SCCB bus.
        peripheral: I2C0
        scl: GPIO5
        sda: GPIO4
        frequency-hz: 400000
    spi-device:
      display-spi:
        # Espressif esp_boards `esp32_s3_eye` board_peripherals.yaml
        # (`spi_display`) and board_devices.yaml (`display_lcd`).
        peripheral: SPI3
        sck: GPIO21
        mosi: GPIO47
        chip-select: GPIO44
        frequency-hz: 80000000
    camera-capture:
      camera-data:
        peripheral: LCD_CAM
        dma: DMA_CH0
        xclk: GPIO15
        pclk: GPIO13
        vsync: GPIO6
        href: GPIO7
        data: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
        xclk-frequency-hz: 16000000
        dma-buffer-bytes: 65536
    analog-input:
      button-ladder:
        # Espressif board manager `esp32_s3_eye`: `adc_button_group` on ADC1
        # channel 0, GPIO1.
        peripheral: ADC1
        pin: GPIO1
  devices:
    buttons:
      # BUTTON_4, BUTTON_3, BUTTON_2, BUTTON_1 in button-index order
      # (`voltage_range`, `max_voltage` 3000 mV).
      implementation: adc-ladder-buttons
      primary: true
      bindings: { sense: button-ladder }
      parameters:
        levels-millivolts: "380 820 1980 2410"
        idle-millivolts: 3000
    # BOOT on GPIO0, active low, with the pull-up Espressif's esp_boards
    # `esp32_s3_eye` enables.
    boot-button:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
      parameters:
        pull: up
    camera:
      implementation: ov2640-camera
      bindings:
        capture: camera-data
        control: camera-control
      # The official BSP declares both RESET and PWDN as not connected.
    display:
      implementation: mipi-dbi-display
      bindings:
        # `ledc_backlight` drives GPIO48 with `output_invert: true`.
        backlight: GPIO48
        dc: GPIO43
        spi: display-spi
      # The panel has no reset line (`reset_gpio_num: -1`); the controller
      # is reset with the DCS software reset.
      parameters:
        controller: st7789
        width: 240
        height: 240
        color-order: rgb
        invert-colors: true
        backlight-active-high: false
