name: m5stack-airq
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
  # Battery power latch (M5GFX `POWER_HOLD_PIN 46`, M5Unified POWER_HOLD).
  power-hold: GPIO46
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5AirQ: SCL G12 / SDA G11.
        peripheral: I2C1
        scl: GPIO12
        sda: GPIO11
        frequency-hz: 400000
    spi-device:
      display-spi:
        peripheral: SPI2
        sck: GPIO5
        mosi: GPIO6
        chip-select: GPIO4
        frequency-hz: 40000000
  devices:
    display:
      implementation: epaper-1in54-display
      bindings:
        busy: GPIO1
        dc: GPIO3
        reset: GPIO2
        spi: display-spi
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # Buttons A (GPIO0) and B (GPIO8), active low with the Board's pull-ups
    # (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
        button-2: GPIO8
