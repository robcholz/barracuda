name: m5stack-airq
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
  # Battery power latch (M5GFX `POWER_HOLD_PIN 46`, M5Unified POWER_HOLD).
  power-hold: GPIO46
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI2
        sck: GPIO5
        mosi: GPIO6
        chip-select: GPIO4
        frequency-hz: 40000000
  devices:
    display:
      implementation: epaper-1in54-display
      bindings:
        busy: GPIO1
        dc: GPIO3
        reset: GPIO2
        spi: display-spi
exposed-io:
  pins:
    # Port A: M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA), M5Stack AirQ pin map.
    port-a-scl: { pin: GPIO15 }
    port-a-sda: { pin: GPIO13 }
