name: m5stack-airq
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
  # Battery power latch (M5GFX `POWER_HOLD_PIN 46`, M5Unified POWER_HOLD).
  power-hold: GPIO46
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5AirQ: SCL G12 / SDA G11.
        peripheral: I2C1
        scl: GPIO12
        sda: GPIO11
        frequency-hz: 400000
    spi-device:
      display-spi:
        peripheral: SPI2
        sck: GPIO5
        mosi: GPIO6
        chip-select: GPIO4
        frequency-hz: 40000000
    rmt-output:
      rgb-led-data:
        # StampS3 module WS2812B-2020 on GPIO21 (M5Unified `_pin_table_other0` (RGBLED)).
        # Clocked out of RMT channel 0, so the LED takes no SPI controller
        # from the runtime SPI pool the exposed pins use.
        peripheral: RMT
        channel: 0
        pin: GPIO21
    pwm-output:
      buzzer-tone:
        # Passive buzzer on GPIO9 (M5Unified `_begin_audio` board_M5AirQ:
        # `spk_cfg.buzzer = true`).
        peripheral: LEDC
        timer: Timer1
        channel: Channel1
        pin: GPIO9
  devices:
    # The StampS3's RGB LED, one LED, GRB order.
    led-strip:
      implementation: rmt-led-strip
      bindings:
        data: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    display:
      implementation: epaper-1in54-display
      bindings:
        busy: GPIO1
        dc: GPIO3
        reset: GPIO2
        spi: display-spi
    # SEN55 at 69h and SCD40 at 62h on the internal bus, presented as one
    # device. GPIO10 switches the SEN55's supply on while low (M5Stack AirQ
    # SEN55 Arduino guide: "AirQ external sensor enable pin, keep LOW").
    environment-sensor:
      implementation: scd4x-sen5x-environment-sensor
      bindings:
        i2c: internal-i2c
        power-enable: GPIO10
      parameters:
        scd4x-address: 98
        sen5x-address: 105
        power-active-level: low
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # Buttons A (GPIO0) and B (GPIO8), active low with the Board's pull-ups
    # (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
        button-2: GPIO8
    # The passive buzzer; its timer and channel leave the runtime PWM pool
    # its own (Timer0, Channel0).
    buzzer:
      implementation: pwm-buzzer
      bindings: { output: buzzer-tone }
exposed-io:
  pins:
    # Port A: M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA), M5Stack AirQ pin map.
    port-a-scl: { pin: GPIO15 }
    port-a-sda: { pin: GPIO13 }
