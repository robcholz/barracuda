name: m5stack-airq
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI2
        sck: GPIO5
        mosi: GPIO6
        chip-select: GPIO4
        frequency-hz: 40000000
  devices:
    display:
      implementation: gdeh0154d67-display
      bindings:
        busy: GPIO1
        dc: GPIO3
        power-hold: GPIO46
        reset: GPIO2
        spi: display-spi
