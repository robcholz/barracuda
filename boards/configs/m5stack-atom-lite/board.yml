name: m5stack-atom-lite
profile: connected
hardware:
  chip: esp32
  # ESP32-PICO-D4.
  flash-size: 4mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-output:
      rgb-led-data:
        # SK6812 on GPIO27 (M5Unified `_pin_table_other0` (RGBLED); EBM `m5stack_atom_lite`,
        # GRB).
        data: GPIO27
        frequency-hz: 2400000
    rmt-output:
      ir-transmit:
        # IR LED on GPIO12, active high (Espressif `m5stack_atom_lite` ir_tx).
        peripheral: RMT
        channel: 0
        pin: GPIO12
  devices:
    # The RGB LED under the button, one LED, GRB order.
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    # The button under the front, GPIO39, active low with the Board's pull-up
    # (M5Unified `M5Unified::update`); GPIO39 has no internal bias.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO39
    # The infrared LED, lit while its pin is high; no receiver.
    infrared:
      implementation: rmt-infrared
      bindings: { transmit: ir-transmit }
exposed-io:
  pins:
    # Grove port G26/G32 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g26: { pin: GPIO26 }
    grove-g32: { pin: GPIO32 }
