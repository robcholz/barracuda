name: m5stack-atom-matrix
profile: connected
hardware:
  chip: esp32
  # ESP32-PICO-D4.
  flash-size: 4mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5AtomMatrix: SCL G21 / SDA G25.
        peripheral: I2C1
        scl: GPIO21
        sda: GPIO25
        frequency-hz: 400000
    spi-output:
      led-matrix-data:
        # M5Stack Atom Matrix: 25 WS2812C LEDs driven from GPIO27.
        data: GPIO27
        frequency-hz: 2400000
    rmt-output:
      ir-transmit:
        # IR LED on GPIO12, active high (Espressif `m5stack_atom_matrix` ir_tx).
        peripheral: RMT
        channel: 0
        pin: GPIO12
  devices:
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: led-matrix-data
      parameters:
        led-count: 25
        color-order: grb
    # MPU6886 at 68h, a BMI270 there on later units (M5Unified
    # `IMU_Class::begin`). Both are mounted with X and Z inverted.
    inertial-measurement:
      implementation: mpu6886-bmi270-imu
      bindings: { i2c: internal-i2c }
      parameters:
        axis-x: "-x"
        axis-y: "+y"
        axis-z: "-z"
    # The button under the LED matrix, GPIO39, active low with the Board's pull-up
    # (M5Unified `M5Unified::update`); GPIO39 has no internal bias.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO39
    # The infrared LED, lit while its pin is high; no receiver.
    infrared:
      implementation: rmt-infrared
      bindings: { transmit: ir-transmit }
exposed-io:
  pins:
    # M5Stack Atom Matrix Grove port (EBM m5stack_atom_matrix, M5Unified ex-I2C).
    grove-g26: { pin: GPIO26 }
    grove-g32: { pin: GPIO32 }
