name: m5stack-atom-psram
hardware:
  chip: esp32
  # ESP32-PICO-V3-02.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 2097152
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
exposed-io:
  pins:
    # Grove port G26/G32 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g26: { pin: GPIO26 }
    grove-g32: { pin: GPIO32 }
