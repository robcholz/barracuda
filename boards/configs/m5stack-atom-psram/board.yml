name: m5stack-atom-psram
hardware:
  chip: esp32
  # ESP32-PICO-V3-02.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 2097152
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # The button under the front, GPIO39, active low with the Board's pull-up
    # (M5Unified `M5Unified::update`); GPIO39 has no internal bias.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO39
