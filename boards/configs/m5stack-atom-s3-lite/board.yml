name: m5stack-atom-s3-lite
hardware:
  chip: esp32s3
  # ESP32-S3FN8.
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
exposed-io:
  pins:
    # Grove (PORT.CUSTOM) G1/G2: M5Stack AtomS3 Lite pin map.
    grove-g1: { pin: GPIO1 }
    grove-g2: { pin: GPIO2 }
