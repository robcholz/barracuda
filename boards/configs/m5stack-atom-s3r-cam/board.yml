name: m5stack-atom-s3r-cam
hardware:
  chip: esp32s3
  # ESP32-S3-PICO-1-N8R8.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified internal bus of the AtomS3R family: SCL G0, SDA G45.
        peripheral: I2C0
        scl: GPIO0
        sda: GPIO45
        frequency-hz: 400000
    rmt-output:
      ir-transmit:
        # IR LED driver `IR_LED_DRV` on GPIO47 (docs.m5stack.com AtomS3R,
        # AtomS3R-CAM, and AtomS3R-Ext pin maps, "BMI270 & IR": the block's
        # other pins are the BMI270 bus G0/G45 and the button G41 in
        # M5Unified).
        peripheral: RMT
        channel: 0
        pin: GPIO47
  devices:
    inertial-measurement:
      implementation: bmi270-imu
      bindings: { i2c: internal-i2c }
      parameters:
        # BMI270 at 68h (M5Stack pin map).
        address: 104
    # The infrared LED, lit while its pin is high; no receiver.
    infrared:
      implementation: rmt-infrared
      bindings: { transmit: ir-transmit }
exposed-io:
  pins:
    # Grove (PORT.CUSTOM) G1/G2: M5Stack AtomS3R-CAM pin map.
    grove-g1: { pin: GPIO1 }
    grove-g2: { pin: GPIO2 }
