name: m5stack-atom-s3u
hardware:
  chip: esp32s3
  # ESP32-S3FN8.
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # The button under the LED, GPIO41, active low with the Board's pull-up
    # (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO41
