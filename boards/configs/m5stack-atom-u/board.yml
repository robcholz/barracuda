name: m5stack-atom-u
hardware:
  chip: esp32
  # ESP32-PICO-D4.
  flash-size: 4mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-output:
      rgb-led-data:
        # SK6812 on GPIO27 (M5Unified `_pin_table_other0` (RGBLED)).
        data: GPIO27
        frequency-hz: 2400000
    pdm-i2s-stream:
      microphone:
        # M5Unified `_begin_audio` (board_M5AtomU): the SPM1423 PDM
        # microphone, clock GPIO5 and data GPIO19.
        peripheral: I2S0
        dma: DMA_I2S0
        clk: GPIO5
        din: GPIO19
        sample-rate-hz: 16000
        dma-buffer-bytes: 4096
    rmt-output:
      ir-transmit:
        # IR LED on GPIO12, active high (Espressif `m5stack_atomu` ir_tx).
        peripheral: RMT
        channel: 0
        pin: GPIO12
  devices:
    microphone:
      implementation: pdm-i2s-audio-codec
      bindings: { stream: microphone }
    # The button under the front, GPIO39, active low with the Board's pull-up
    # (M5Unified `M5Unified::update`); GPIO39 has no internal bias.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO39
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    # The infrared LED, lit while its pin is high; no receiver.
    infrared:
      implementation: rmt-infrared
      bindings: { transmit: ir-transmit }
