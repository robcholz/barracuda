name: m5stack-cardputer-adv
profile: screen
hardware:
  chip: esp32s3
  # Stamp-S3A (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO36
        mosi: GPIO35
        chip-select: GPIO37
        frequency-hz: 40000000
  devices:
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO38, dc: GPIO34, reset: GPIO33, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
        orientation: deg90
exposed-io:
  pins:
    # Grove (PORT.CUSTOM) G1/G2: M5Stack Cardputer-Adv pin map.
    grove-g1: { pin: GPIO1 }
    grove-g2: { pin: GPIO2 }
    # EXT 2.54-14P header pins that no on-board device uses (M5Stack Cardputer-Adv pin
    # map). Its SPI pins are the microSD bus and its I2C pins the internal bus.
    header-g3: { pin: GPIO3 }
    header-g4: { pin: GPIO4 }
    header-g5: { pin: GPIO5 }
    header-g6: { pin: GPIO6 }
    header-g13: { pin: GPIO13 }
    header-g15: { pin: GPIO15 }
