name: m5stack-cardputer
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      card-spi:
        # M5Unified `_pin_table_sd` (board_M5Cardputer, board_M5CardputerADV);
        # the LCD keeps SPI3.
        peripheral: SPI2
        sck: GPIO40
        mosi: GPIO14
        miso: GPIO39
        chip-select: GPIO12
        frequency-hz: 20000000
      display-spi:
        peripheral: SPI3
        sck: GPIO36
        mosi: GPIO35
        chip-select: GPIO37
        frequency-hz: 40000000
    analog-input:
      battery-sense:
        # M5Unified `Power_Class::begin` (DinMeter, Cardputer, Cardputer-ADV):
        # the battery on ADC1 GPIO10 through a divider of two.
        peripheral: ADC1
        pin: GPIO10
    pdm-i2s-stream:
      audio:
        # M5Unified `_begin_audio` Cardputer: the SPM1423 PDM microphone
        # (clock GPIO43, data GPIO46) and the NS4168 amplifier (BCK GPIO41,
        # LRCK GPIO43, data GPIO42) share GPIO43, so one I2S controller
        # serves them in turn. I2S0 is the ESP32-S3's PDM receiver.
        peripheral: I2S0
        dma: DMA_CH1
        clk: GPIO43
        din: GPIO46
        bclk: GPIO41
        dout: GPIO42
        sample-rate-hz: 16000
        dma-buffer-bytes: 4096
  devices:
    micro-sd:
      implementation: spi-sd-fat-removable-storage
      bindings: { spi: card-spi }
    audio:
      implementation: pdm-i2s-audio-codec
      bindings: { stream: audio }
    battery:
      implementation: adc-battery-power-monitor
      bindings: { sense: battery-sense }
      parameters:
        divider-numerator: 2
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO38, dc: GPIO34, reset: GPIO33, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
        orientation: deg90
exposed-io:
  pins:
    # Grove (PORT.CUSTOM) G1/G2: M5Stack Cardputer pin map.
    grove-g1: { pin: GPIO1 }
    grove-g2: { pin: GPIO2 }
