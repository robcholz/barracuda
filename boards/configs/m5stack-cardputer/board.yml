name: m5stack-cardputer
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO36
        mosi: GPIO35
        chip-select: GPIO37
        frequency-hz: 40000000
    spi-output:
      rgb-led-data:
        # StampS3 module WS2812B-2020 on GPIO21 (M5Unified `_pin_table_other0` (RGBLED);
        # EBM `m5stack_cardputer`, GRB). On Cardputer v1.1 the LED's supply follows
        # GPIO38, which the display drives as its backlight (docs.m5stack.com
        # Cardputer v1.1 pin map), so the LED lights only with the backlight on.
        data: GPIO21
        frequency-hz: 2400000
  devices:
    # The StampS3's RGB LED, one LED, GRB order.
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO38, dc: GPIO34, reset: GPIO33, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
        orientation: deg90
    # The G0 button, active low with the Board's pull-up (M5Unified
    # `M5Unified::update`). The keyboard is not declared.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
exposed-io:
  pins:
    # Grove (PORT.CUSTOM) G1/G2: M5Stack Cardputer pin map.
    grove-g1: { pin: GPIO1 }
    grove-g2: { pin: GPIO2 }
