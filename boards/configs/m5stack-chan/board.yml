name: m5stack-chan
profile: screen
hardware:
  chip: esp32s3
  # ESP32-S3 with 16 MB flash and 8 MB quad PSRAM (as CoreS3).
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX/M5Unified: the CoreS3 internal bus (I2C_NUM_1, 400 kHz) of the
        # AXP2101 at 34h and the AW9523B at 58h.
        peripheral: I2C1
        scl: GPIO11
        sda: GPIO12
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX StackChan (CoreS3 path): SPI2_HOST at 40 MHz. GPIO35 is both
        # MISO and LCD D/C; the display only writes, so it is the D/C output.
        peripheral: SPI2
        sck: GPIO36
        mosi: GPIO37
        chip-select: GPIO3
        frequency-hz: 40000000
  devices:
    display:
      # ILI9342C 320x240. AW9523B P1_1 resets it and AXP2101 DLDO1 lights it.
      implementation: m5stack-pmic-display
      bindings: { dc: GPIO35, i2c: internal-i2c, spi: display-spi }
      parameters:
        power-layout: cores3
        controller: ili9342c
        width: 320
        height: 240
        invert-colors: true
    touch:
      # FT6336U at 38h on the internal bus (M5GFX `Touch_M5StackCoreS3`); its
      # interrupt reaches GPIO21 through the AW9523B, unused: the
      # implementation polls. Its reset is AW9523B P0_0 (Espressif's
      # m5stack_cores3 power manager).
      implementation: ft5x06-touch
      bindings: { i2c: internal-i2c }
      parameters:
        width: 320
        height: 240
        reset: cores3
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # The battery behind the AXP2101 the display also uses.
    power-monitor:
      implementation: axp192-axp2101-power-monitor
      bindings: { i2c: internal-i2c }
    inertial-measurement:
      implementation: bmi270-imu
      bindings: { i2c: internal-i2c }
      parameters:
        # BMI270 at 69h, with the BMM150 behind its auxiliary bus (M5Stack CoreS3 pin
        # map; M5Unified IMU_Class).
        address: 105
