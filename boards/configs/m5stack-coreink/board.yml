name: m5stack-coreink
profile: screen
hardware:
  chip: esp32
  # ESP32-PICO-D4.
  flash-size: 4mb
  # Battery power latch (M5GFX `POWER_HOLD_PIN 12`, M5Unified POWER_HOLD).
  power-hold: GPIO12
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in`: the internal bus, SCL G22 / SDA G21.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO9
        frequency-hz: 40000000
    analog-input:
      battery-sense:
        # M5Unified `Power_Class::begin` CoreInk: the battery on ADC1 GPIO35
        # through 25.1 k over 5.1 k (`_adc_ratio = 25.1f / 5.1f`).
        peripheral: ADC1
        pin: GPIO35
    pwm-output:
      buzzer-tone:
        # Passive buzzer on GPIO2 (M5Unified `_begin_audio` board_M5StackCoreInk:
        # `spk_cfg.buzzer = true`).
        peripheral: LEDC
        timer: Timer1
        channel: Channel1
        pin: GPIO2
  devices:
    battery:
      implementation: adc-battery-power-monitor
      bindings: { sense: battery-sense }
      parameters:
        divider-numerator: 251
        divider-denominator: 51
    display:
      implementation: epaper-1in54-display
      bindings:
        busy: GPIO4
        dc: GPIO15
        reset: GPIO0
        spi: display-spi
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # The rocker's up, press, and down on GPIO37, GPIO38, GPIO39, the top
    # button on GPIO5, and the power button on GPIO27, all active low with
    # the Board's pull-ups (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO37
        button-2: GPIO38
        button-3: GPIO39
        button-4: GPIO5
        button-5: GPIO27
    status-led:
      implementation: indicator-led
      bindings:
        # Status LED on GPIO10, active low (Espressif m5stack_coreink; CoreInk
        # FactoryTest `set_led`).
        pin: GPIO10
      parameters:
        active-level: low
    # The passive buzzer; its timer and channel leave the runtime PWM pool
    # its own (Timer0, Channel0).
    buzzer:
      implementation: pwm-buzzer
      bindings: { output: buzzer-tone }
exposed-io:
  pins:
    # Grove port G32/G33 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g32: { pin: GPIO32 }
    grove-g33: { pin: GPIO33 }
