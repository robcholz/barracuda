name: m5stack-coreink
profile: screen
hardware:
  chip: esp32
  # ESP32-PICO-D4.
  flash-size: 4mb
  # Battery power latch (M5GFX `POWER_HOLD_PIN 12`, M5Unified POWER_HOLD).
  power-hold: GPIO12
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO9
        frequency-hz: 40000000
  devices:
    display:
      implementation: epaper-1in54-display
      bindings:
        busy: GPIO4
        dc: GPIO15
        reset: GPIO0
        spi: display-spi
