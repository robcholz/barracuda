name: m5stack-corep4x
profile: screen
hardware:
  chip: esp32p4
  # ESP32-P4NRW32X.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: hex
    size-bytes: 33554432
toolchain:
  target: riscv32imafc-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    dsi-host:
      panel:
        peripheral: MIPI_DSI
        dma: VDMA_CH0
        # No backlight pin: the M5IOE1 expander dims it (M5GFX
        # `Light_M5CoreP4X`), driven by the display implementation.
        # Two lanes; the PHY runs from on-chip LDO VO3 at 2.5 V (M5GFX
        # CoreP4X `Bus_DSI` configuration).
        data-lanes: 2
        phy-power-channel: 3
        phy-power-millivolts: 2500
    i2c-device:
      # The internal bus: SCL GPIO9, SDA GPIO11 (M5Unified, M5GFX, M5Stack's
      # Arduino core `IN_SCL`/`IN_SDA`). The M5IOE1 and M5PM1 on it run at
      # 100 kHz.
      internal:
        peripheral: I2C0
        scl: GPIO9
        sda: GPIO11
        frequency-hz: 100000
  devices:
    # 2.64-inch 480x480 ST7102 MIPI DSI panel. Its power, reset, and
    # backlight sit behind the M5IOE1 at 4Fh; the 5 V boost behind the M5PM1
    # at 6Eh.
    display:
      implementation: corep4x-dsi-display
      bindings: { host: panel, i2c: internal }
      parameters:
        expander-address: 79
        power-address: 110
    touch:
      # CST3530 at 58h on the internal bus (M5GFX CoreP4X `Touch_CST3530`,
      # interrupt GPIO1, unused: the implementation polls), 480x480. Its
      # reset, M5IOE1 G8, is driven high by the display implementation.
      implementation: cst3530-touch
      bindings: { i2c: internal }
      parameters:
        width: 480
        height: 480
    # The battery behind the M5PM1 at 6Eh the display also uses. Its charge
    # status is on the M5IOE1 (G6), which the implementation does not read.
    power-monitor:
      implementation: m5pm1-power-monitor
      bindings: { i2c: internal }
    real-time-clock:
      implementation: rx8130ce-rtc
      bindings: { i2c: internal }
      parameters:
        # RX8130CE at 32h (M5Unified RTC_Class: RX8130 on CoreP4X).
        address: 50
exposed-io:
  pins:
    # Port A: M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA).
    port-a-scl: { pin: GPIO16 }
    port-a-sda: { pin: GPIO18 }
plugins:
  imessage-gateway:
    # No channel receive connections on this Board.
    receive-slots: 0
