name: m5stack-dial
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # Internal bus SCL G12, SDA G11 on M5Unified's `In_I2C` controller (M5GFX
        # `board_M5Dial` touch configuration; M5Unified `_pin_table_i2c_ex_in`).
        peripheral: I2C1
        scl: GPIO12
        sda: GPIO11
        frequency-hz: 400000
    spi-device:
      display-spi:
        peripheral: SPI2
        # M5Stack Dial schematic/M5GFX wiring.
        sck: GPIO6
        mosi: GPIO5
        chip-select: GPIO7
        frequency-hz: 80000000
  devices:
    display:
      implementation: mipi-dbi-display
      bindings:
        backlight: GPIO9
        dc: GPIO4
        reset: GPIO8
        spi: display-spi
      parameters:
        backlight-active-high: true
        color-order: bgr
        controller: gc9a01
        height: 240
        invert-colors: true
        orientation: deg0
        width: 240
    # FT3267 at 38h (M5GFX board_M5Dial `Touch_FT5x06`, 0..239 x 0..239).
    # It leaves reset at power-on; the interrupt (GPIO14) is unused: the
    # implementation polls.
    touch:
      implementation: ft5x06-touch
      bindings: { i2c: internal-i2c }
      parameters:
        width: 240
        height: 240
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # Buttons A (the knob's press, GPIO42) and B (GPIO0), active low with
    # the Board's pull-ups (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO42
        button-2: GPIO0
exposed-io:
  pins:
    # Port A: M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA); Port B: M5Unified
    # `_pin_table_port_bc`.
    port-a-scl: { pin: GPIO15 }
    port-a-sda: { pin: GPIO13 }
    port-b-g1: { pin: GPIO1 }
    port-b-g2: { pin: GPIO2 }
