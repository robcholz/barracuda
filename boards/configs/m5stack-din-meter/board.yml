name: m5stack-din-meter
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI2
        sck: GPIO6
        mosi: GPIO5
        chip-select: GPIO7
        frequency-hz: 40000000
  devices:
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO9, dc: GPIO4, reset: GPIO8, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
