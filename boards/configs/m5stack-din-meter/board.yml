name: m5stack-din-meter
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5DinMeter: SCL G12 / SDA G11.
        peripheral: I2C1
        scl: GPIO12
        sda: GPIO11
        frequency-hz: 400000
    spi-device:
      display-spi:
        peripheral: SPI2
        sck: GPIO6
        mosi: GPIO5
        chip-select: GPIO7
        frequency-hz: 40000000
    analog-input:
      battery-sense:
        # M5Unified `Power_Class::begin` (DinMeter, Cardputer, Cardputer-ADV):
        # the battery on ADC1 GPIO10 through a divider of two.
        peripheral: ADC1
        pin: GPIO10
    spi-output:
      rgb-led-data:
        # StampS3 module WS2812B-2020 on GPIO21 (M5Unified `_pin_table_other0` (RGBLED)).
        data: GPIO21
        frequency-hz: 2400000
  devices:
    battery:
      implementation: adc-battery-power-monitor
      bindings: { sense: battery-sense }
      parameters:
        divider-numerator: 2
    # The StampS3's RGB LED, one LED, GRB order.
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO9, dc: GPIO4, reset: GPIO8, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # Buttons A (the knob's press, GPIO42) and B (GPIO0), active low with
    # the Board's pull-ups (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO42
        button-2: GPIO0
exposed-io:
  pins:
    # Port A: M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA); Port B: M5Unified
    # `_pin_table_port_bc`.
    port-a-scl: { pin: GPIO15 }
    port-a-sda: { pin: GPIO13 }
    port-b-g1: { pin: GPIO1 }
    port-b-g2: { pin: GPIO2 }
