name: m5stack-fire
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6 (units before 2020.4 had 4 MB PSRAM).
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO14
        frequency-hz: 40000000
  devices:
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO32, dc: GPIO27, reset: GPIO33, spi: display-spi }
      parameters: { controller: ili9342c, width: 320, height: 240, invert-colors: true }
exposed-io:
  pins:
    # Port B (M5Unified `_pin_table_port_bc`). Port A is the internal I2C bus, and Port
    # C's G16/G17 carry the PSRAM, so neither is exposed.
    port-b-g26: { pin: GPIO26 }
    port-b-g36: { pin: GPIO36 }
