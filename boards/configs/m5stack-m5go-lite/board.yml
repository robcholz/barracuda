name: m5stack-m5go-lite
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5Stack: the internal bus, SCL G22 /
        # SDA G21 at 400 kHz, is also Port A.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO14
        frequency-hz: 40000000
    spi-output:
      led-bar-data:
        # M5GO base: 10 SK6812 3535 LEDs in one chain on GPIO15 (docs.m5stack.com
        # M5GO Lite pin map and specifications; M5Unified `_pin_table_other0` (RGBLED), board_M5Stack).
        data: GPIO15
        frequency-hz: 2400000
  devices:
    # The M5GO base's two five-LED side bars, one 10-LED chain, GRB order.
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: led-bar-data
      parameters:
        led-count: 10
        color-order: grb
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO32, dc: GPIO27, reset: GPIO33, spi: display-spi }
      parameters: { controller: ili9342c, width: 320, height: 240, invert-colors: true }
    # IP5306 at 75h (M5Unified `Power_Class::begin`, board_M5Stack): battery
    # level in 25 % steps and charger state only.
    power-monitor:
      implementation: ip5306-power-monitor
      bindings: { i2c: internal-i2c }
    # MPU6886 at 68h, or an MPU9250 on units built before mid-2019 (M5Unified
    # `IMU_Class::begin`); the implementation identifies which by WHO_AM_I.
    inertial-measurement:
      implementation: mpu6886-imu
      bindings: { i2c: internal-i2c }
    # Buttons A, B, C on GPIO39, GPIO38, GPIO37, active low with the Board's
    # pull-ups (M5Unified `M5Unified::update`); GPIO34-39 have no internal bias.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO39
        button-2: GPIO38
        button-3: GPIO37
exposed-io:
  pins:
    # Ports B and C (M5Unified `_pin_table_port_bc`). Port A is the internal I2C bus
    # (G21/G22) and stays unexposed.
    port-b-g26: { pin: GPIO26 }
    port-b-g36: { pin: GPIO36 }
    port-c-g16: { pin: GPIO16 }
    port-c-g17: { pin: GPIO17 }
