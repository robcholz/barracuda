name: m5stack-m5go
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO18
        mosi: GPIO23
        # The microSD card's data out; the LCD only listens.
        miso: GPIO19
        chip-select: GPIO14
        frequency-hz: 40000000
      card-spi:
        # M5Unified `_pin_table_sd` (board_M5Stack): the microSD card shares
        # the LCD's bus with its own chip select, GPIO4. 20 MHz stays within
        # the SD default-speed mode's 25 MHz.
        peripheral: SPI3
        sck: GPIO18
        mosi: GPIO23
        miso: GPIO19
        chip-select: GPIO4
        frequency-hz: 20000000
  devices:
    micro-sd:
      implementation: spi-sd-fat-removable-storage
      bindings: { spi: card-spi }
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO32, dc: GPIO27, reset: GPIO33, spi: display-spi }
      parameters: { controller: ili9342c, width: 320, height: 240, invert-colors: true }
exposed-io:
  pins:
    # Ports B and C (M5Unified `_pin_table_port_bc`). Port A is the internal I2C bus
    # (G21/G22) and stays unexposed.
    port-b-g26: { pin: GPIO26 }
    port-b-g36: { pin: GPIO36 }
    port-c-g16: { pin: GPIO16 }
    port-c-g17: { pin: GPIO17 }
