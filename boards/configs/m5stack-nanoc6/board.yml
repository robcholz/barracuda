name: m5stack-nanoc6
hardware:
  chip: esp32c6
  # ESP32-C6FH4.
  flash-size: 4mb
toolchain:
  target: riscv32imac-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    status-led:
      implementation: indicator-led
      bindings:
        # Blue LED on GPIO7, active high (Espressif m5stack_nanoc6; M5Unified
        # `M5NanoC6_LED_PIN`).
        pin: GPIO7
      parameters:
        active-level: high
exposed-io:
  pins:
    # Grove port G1/G2 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g1: { pin: GPIO1 }
    grove-g2: { pin: GPIO2 }
