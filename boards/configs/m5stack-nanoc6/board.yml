name: m5stack-nanoc6
hardware:
  chip: esp32c6
  # ESP32-C6FH4.
  flash-size: 4mb
toolchain:
  target: riscv32imac-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # The button on GPIO9, active low, with the internal pull-up M5Unified
    # enables.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO9
      parameters:
        pull: up
