name: m5stack-paper-mono
profile: screen
hardware:
  chip: esp32s3
  # ESP32-S3R8 with 16 MB flash.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal:
        # M5GFX board_M5PaperMono / M5Unified internal I2C: M5PM1 (0x6E),
        # M5IOE1 (0x4F), RX8130 RTC, BMI270, FT5x06 touch, NFC. M5GFX talks
        # to the M5PM1 and M5IOE1 at 100 kHz.
        peripheral: I2C0
        scl: GPIO48
        sda: GPIO47
        frequency-hz: 100000
    spi-device:
      epd-spi:
        # M5GFX board_M5PaperMono: SSD1677 on SPI2, write clock 40 MHz.
        peripheral: SPI2
        sck: GPIO15
        mosi: GPIO14
        chip-select: GPIO16
        frequency-hz: 40000000
    pwm-output:
      buzzer-tone:
        # Passive buzzer on GPIO42 (M5Unified `_begin_audio` board_M5PaperMono:
        # `spk_cfg.buzzer = true`).
        peripheral: LEDC
        timer: Timer1
        channel: Channel1
        pin: GPIO42
  devices:
    display:
      implementation: paper-mono-display
      bindings:
        spi: epd-spi
        dc: GPIO17
        busy: GPIO18
        i2c: internal
    # The battery behind the M5PM1 at 6Eh the display also uses. The IP2315
    # charger that reports charging is not read.
    power-monitor:
      implementation: m5pm1-power-monitor
      bindings: { i2c: internal }
    # Buttons A (GPIO2) and B (GPIO3), active low with the Board's pull-ups
    # (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO2
        button-2: GPIO3
    inertial-measurement:
      implementation: bmi270-imu
      bindings: { i2c: internal }
      parameters:
        # BMI270 at 68h (M5GFX PaperMono/StopWatch I2C probe list).
        address: 104
    real-time-clock:
      implementation: rx8130ce-rtc
      bindings: { i2c: internal }
      parameters:
        # RX8130CE at 32h (M5GFX probe list; M5Unified RTC_Class).
        address: 50
    # ST25R3916 NFC reader at 50h on the internal bus (docs.m5stack.com
    # PaperMono pin map). Its supply is switched by M5IOE1 G4, which UIFlow's
    # `hardware/nfc.py` turns on and then waits 1 s before probing the
    # reader. Its interrupt (G6) is not used: the implementation polls.
    nfc-reader:
      implementation: st25r3916-nfc-reader
      bindings: { i2c: internal }
      parameters:
        address: 80
        m5ioe1-power-pin: g4
        power-settle-ms: 1000
    # The passive buzzer; its timer and channel leave the runtime PWM pool
    # its own (Timer0, Channel0).
    buzzer:
      implementation: pwm-buzzer
      bindings: { output: buzzer-tone }
