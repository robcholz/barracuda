name: m5stack-paper
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
  # Main power latch (M5Unified POWER_HOLD for board_M5Paper, M5GFX
  # `M5EPD_MAIN_PWR_PIN 2`).
  power-hold: GPIO2
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX board_M5Paper: the touch bus, SCL G22 / SDA G21 at 400 kHz.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      # IT8951E e-paper controller on HSPI's IOMUX pins (M5GFX board_M5Paper;
      # Espressif m5stack_paper spi_master). The microSD card shares the bus
      # with chip-select GPIO4. M5GFX initializes the IT8951 at 12 MHz and
      # reads it at 2 MHz; 10 MHz keeps writes and reads within both.
      epd-spi:
        peripheral: SPI2
        sck: GPIO14
        mosi: GPIO12
        miso: GPIO13
        chip-select: GPIO15
        frequency-hz: 10000000
  devices:
    display:
      implementation: it8951-display
      bindings:
        spi: epd-spi
        # IT8951 HRDY (M5GFX pin_busy).
        ready: GPIO27
        # E-paper rail enable; M5GFX pulses it as the controller reset.
        panel-power: GPIO23
      parameters:
        width: 960
        height: 540
        # M5GFX offset_rotation 3: upright portrait, 540 x 960.
        mounting: deg270
    # GT911 (M5GFX board_M5Paper `Touch_GT911`, 0..539 x 0..959, which needs
    # no rotation for the upright portrait display). Its address depends on
    # the interrupt line (GPIO36) at power-on; the implementation tries 14h,
    # then 5Dh, as M5GFX does, and polls.
    touch:
      implementation: gt911-touch
      bindings: { i2c: internal-i2c }
      parameters:
        address: 20
        width: 540
        height: 960
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # The rocker's up, press, and down on GPIO37, GPIO38, GPIO39, active low
    # with the Board's pull-ups (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO37
        button-2: GPIO38
        button-3: GPIO39
