name: m5stack-paper
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
  # Main power latch (M5Unified POWER_HOLD for board_M5Paper, M5GFX
  # `M5EPD_MAIN_PWR_PIN 2`).
  power-hold: GPIO2
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      # IT8951E e-paper controller on HSPI's IOMUX pins (M5GFX board_M5Paper;
      # Espressif m5stack_paper spi_master). The microSD card shares the bus
      # with chip-select GPIO4. M5GFX initializes the IT8951 at 12 MHz and
      # reads it at 2 MHz; 10 MHz keeps writes and reads within both.
      epd-spi:
        peripheral: SPI2
        sck: GPIO14
        mosi: GPIO12
        miso: GPIO13
        chip-select: GPIO15
        frequency-hz: 10000000
  devices:
    display:
      implementation: it8951-display
      bindings:
        spi: epd-spi
        # IT8951 HRDY (M5GFX pin_busy).
        ready: GPIO27
        # E-paper rail enable; M5GFX pulses it as the controller reset.
        panel-power: GPIO23
      parameters:
        width: 960
        height: 540
        # M5GFX offset_rotation 3: upright portrait, 540 x 960.
        mounting: deg270
exposed-io:
  pins:
    # Port A: M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA); Ports B and C:
    # M5Unified `_pin_table_port_bc`. The ports' 5 V supply is switched by GPIO5
    # (M5Unified `M5Paper_EXT5V_ENABLE_PIN`).
    port-a-scl: { pin: GPIO32 }
    port-a-sda: { pin: GPIO25 }
    port-b-g26: { pin: GPIO26 }
    port-b-g33: { pin: GPIO33 }
    port-c-g18: { pin: GPIO18 }
    port-c-g19: { pin: GPIO19 }
