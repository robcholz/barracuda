name: m5stack-powerhub
hardware:
  chip: esp32s3
  # ESP32-S3-WROOM-1U-N16R8.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # The STM32G031 power co-processor at 50h: M5Unified
        # `_pin_table_i2c_ex_in` (internal SCL GPIO48, SDA GPIO45) and the
        # board detection's `_probe_i2c_addr(45, 48, 0x50)`; M5Stack PowerHub
        # pin map "SYS_SDA G45, SYS_SCL G48". M5Unified's `Power_Class` talks
        # to it at 100 kHz (`i2c_freq`).
        peripheral: I2C1
        scl: GPIO48
        sda: GPIO45
        frequency-hz: 100000
  devices:
    # The co-processor relays the RX8130CE, the INA226 monitors, the LEDs,
    # and one button, which sit on its own bus (M5Stack PowerHub pin map);
    # each implementation below touches only its own registers of it.
    #
    # Button A on GPIO11, active low with the Board's pull-up, and button B,
    # bit 0 of the co-processor's register A0h (M5Unified `M5Unified::update`).
    buttons:
      implementation: powerhub-buttons
      bindings:
        i2c: internal-i2c
        button-a: GPIO11
    # The eight WS2812C LEDs (M5Unified `LED_PowerHub_Class`).
    led-strip:
      implementation: powerhub-led-strip
      bindings: { i2c: internal-i2c }
    # The battery input's voltage and current (M5Unified `Power_Class`).
    power-monitor:
      implementation: powerhub-power-monitor
      bindings: { i2c: internal-i2c }
    # The RX8130CE behind the co-processor (M5Unified `RTC_PowerHub_Class`).
    real-time-clock:
      implementation: powerhub-rtc
      bindings: { i2c: internal-i2c }
exposed-io:
  pins:
    # Port A (red) and Port C (blue): M5Stack PowerHub pin map; M5Unified
    # `_pin_table_i2c_ex_in` (external SCL/SDA).
    port-a-scl: { pin: GPIO16 }
    port-a-sda: { pin: GPIO15 }
    port-c-g1: { pin: GPIO1 }
    port-c-g2: { pin: GPIO2 }
    # EXT 2.54-16P header (M5Stack PowerHub pin map).
    header-g4: { pin: GPIO4 }
    header-g5: { pin: GPIO5 }
    header-g6: { pin: GPIO6 }
    header-g7: { pin: GPIO7 }
    header-g41: { pin: GPIO41 }
    header-g42: { pin: GPIO42 }
    header-g43: { pin: GPIO43 }
    header-g44: { pin: GPIO44 }
    # RS485 transceiver MCU_485_TXD, MCU_485_RXD, MCU_485_DIR (M5Stack PowerHub pin
    # map).
    rs485-tx: { pin: GPIO8 }
    rs485-rx: { pin: GPIO17 }
    rs485-dir: { pin: GPIO18 }
