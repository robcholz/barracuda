name: m5stack-powerhub
hardware:
  chip: esp32s3
  # ESP32-S3-WROOM-1U-N16R8.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # Button A on GPIO11, active low with the Board's pull-up (M5Unified
    # `M5Unified::update`). Button B is read through the STM32 co-processor
    # and is not declared.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO11
