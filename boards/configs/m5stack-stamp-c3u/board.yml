name: m5stack-stamp-c3u
hardware:
  chip: esp32c3
  # ESP32-C3 with 4 MB flash.
  flash-size: 4mb
toolchain:
  target: riscv32imc-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  devices:
    # The button on GPIO9, active low, with the internal pull-up M5Unified
    # enables.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO9
      parameters:
        pull: up
