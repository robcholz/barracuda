name: m5stack-stamp-pico
hardware:
  chip: esp32
  # ESP32-PICO-D4.
  flash-size: 4mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-output:
      rgb-led-data:
        # SK6812 on GPIO27 (M5Unified `_pin_table_other0` (RGBLED); EBM `m5stack_stamp_pico`,
        # GRB).
        data: GPIO27
        frequency-hz: 2400000
  devices:
    # The RGB LED, one LED, GRB order.
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    # The button on GPIO39, active low with the Board's pull-up (M5Unified
    # `M5Unified::update`); GPIO39 has no internal bias.
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO39
exposed-io:
  pins:
    # Grove port G32/G33 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g32: { pin: GPIO32 }
    grove-g33: { pin: GPIO33 }
