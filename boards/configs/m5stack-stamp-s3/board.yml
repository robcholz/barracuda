name: m5stack-stamp-s3
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-output:
      rgb-led-data:
        # SK6812 on GPIO21 (M5Unified `_pin_table_other0` (RGBLED); Espressif
        # m5stack_stamp_s3).
        data: GPIO21
        frequency-hz: 2400000
  devices:
    # The button on GPIO0, active low with the Board's pull-up (M5Unified
    # `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO0
    led-strip:
      implementation: ws2812-spi-led-strip
      bindings:
        spi: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
