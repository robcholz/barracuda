name: m5stack-station
profile: screen-connected
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX/M5Unified: the internal bus (I2C_NUM_1, 400 kHz) of the AXP192 at 34h.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX Station: SPI2_HOST at 40 MHz, write-only.
        peripheral: SPI2
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO5
        frequency-hz: 40000000
    rmt-output:
      led-chain-data:
        # Seven SK6812 LEDs, one beside each port, in one chain on GPIO4 (EBM
        # `m5stack_station_485`, GRB; M5Unified `_pin_table_other0` (RGBLED)).
        # Clocked out of RMT channel 0, so the LED takes no SPI controller
        # from the runtime SPI pool the exposed pins use.
        peripheral: RMT
        channel: 0
        pin: GPIO4
  devices:
    # The seven port LEDs, one chain, GRB order.
    led-strip:
      implementation: rmt-led-strip
      bindings:
        data: led-chain-data
      parameters:
        led-count: 7
        color-order: grb
    display:
      # ST7789V2 135x240 at offset (52, 40) in its 240x320 frame, shown
      # landscape (M5GFX rotation 1). AXP192 LDO2 powers it and LDO3 lights it;
      # GPIO15 resets it.
      implementation: m5stack-pmic-display
      bindings: { dc: GPIO19, i2c: internal-i2c, reset: GPIO15, spi: display-spi }
      parameters:
        power-layout: station
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
        orientation: deg90
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # The battery behind the AXP192 the display also uses.
    power-monitor:
      implementation: axp192-axp2101-power-monitor
      primary: true
      bindings: { i2c: internal-i2c }
    # The 5 V output of each Grove port, through its own 0.01 ohm shunt
    # (R39, R45, R40, R41, R42, R43) into one INA3221 channel. Station
    # schematic v1.3: U16 at 40h (A0 low) measures Port A1, A2, B1 on CH1 to
    # CH3; U8 at 41h measures Port B2, C1, C2. Current flows from IN+ (the
    # port's switch) to IN- (the port), so it reads positive into the port.
    port-a1-power:
      implementation: ina3221-power-monitor
      bindings: { i2c: internal-i2c }
      parameters: { address: 64, channel: ch1, shunt-micro-ohms: 10000 }
    port-a2-power:
      implementation: ina3221-power-monitor
      bindings: { i2c: internal-i2c }
      parameters: { address: 64, channel: ch2, shunt-micro-ohms: 10000 }
    port-b1-power:
      implementation: ina3221-power-monitor
      bindings: { i2c: internal-i2c }
      parameters: { address: 64, channel: ch3, shunt-micro-ohms: 10000 }
    port-b2-power:
      implementation: ina3221-power-monitor
      bindings: { i2c: internal-i2c }
      parameters: { address: 65, channel: ch1, shunt-micro-ohms: 10000 }
    port-c1-power:
      implementation: ina3221-power-monitor
      bindings: { i2c: internal-i2c }
      parameters: { address: 65, channel: ch2, shunt-micro-ohms: 10000 }
    port-c2-power:
      implementation: ina3221-power-monitor
      bindings: { i2c: internal-i2c }
      parameters: { address: 65, channel: ch3, shunt-micro-ohms: 10000 }
    # The power key on the PMIC's PWRON pin, M5Unified `BtnPWR`: the centre
    # button, SW15 on PWR_KEY to the AXP192 PWRON (Station schematic v1.3).
    power-button:
      implementation: axp192-axp2101-buttons
      bindings: { i2c: internal-i2c }
    # Buttons A, B, C on GPIO37, GPIO38, GPIO39, active low with the
    # Board's pull-ups (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      primary: true
      bindings:
        button-1: GPIO37
        button-2: GPIO38
        button-3: GPIO39
exposed-io:
  pins:
    # Ports A1/A2 share one bus (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA));
    # B1 and C1 from `_pin_table_port_bc`, B2 and C2 from `_pin_table_port_de`
    # (M5Unified).
    port-a-scl: { pin: GPIO33 }
    port-a-sda: { pin: GPIO32 }
    port-b1-g25: { pin: GPIO25 }
    port-b1-g35: { pin: GPIO35 }
    port-b2-g26: { pin: GPIO26 }
    port-b2-g36: { pin: GPIO36 }
    port-c1-g13: { pin: GPIO13 }
    port-c1-g14: { pin: GPIO14 }
    port-c2-g16: { pin: GPIO16 }
    port-c2-g17: { pin: GPIO17 }
