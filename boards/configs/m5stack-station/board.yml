name: m5stack-station
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX/M5Unified: the internal bus (I2C_NUM_1, 400 kHz) of the AXP192 at 34h.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX Station: SPI2_HOST at 40 MHz, write-only.
        peripheral: SPI2
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO5
        frequency-hz: 40000000
  devices:
    display:
      # ST7789V2 135x240 at offset (52, 40) in its 240x320 frame, shown
      # landscape (M5GFX rotation 1). AXP192 LDO2 powers it and LDO3 lights it;
      # GPIO15 resets it.
      implementation: m5stack-pmic-display
      bindings: { dc: GPIO19, i2c: internal-i2c, reset: GPIO15, spi: display-spi }
      parameters:
        power-layout: station
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
        orientation: deg90
exposed-io:
  pins:
    # Ports A1/A2 share one bus (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA));
    # B1 and C1 from `_pin_table_port_bc`, B2 and C2 from `_pin_table_port_de`
    # (M5Unified).
    port-a-scl: { pin: GPIO33 }
    port-a-sda: { pin: GPIO32 }
    port-b1-g25: { pin: GPIO25 }
    port-b1-g35: { pin: GPIO35 }
    port-b2-g26: { pin: GPIO26 }
    port-b2-g36: { pin: GPIO36 }
    port-c1-g13: { pin: GPIO13 }
    port-c1-g14: { pin: GPIO14 }
    port-c2-g16: { pin: GPIO16 }
    port-c2-g17: { pin: GPIO17 }
