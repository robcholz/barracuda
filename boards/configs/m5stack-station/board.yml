name: m5stack-station
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX/M5Unified: the internal bus (I2C_NUM_1, 400 kHz) of the AXP192 at 34h.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX Station: SPI2_HOST at 40 MHz, write-only.
        peripheral: SPI2
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO5
        frequency-hz: 40000000
  devices:
    display:
      # ST7789V2 135x240 at offset (52, 40) in its 240x320 frame, shown
      # landscape (M5GFX rotation 1). AXP192 LDO2 powers it and LDO3 lights it;
      # GPIO15 resets it.
      implementation: m5stack-pmic-display
      bindings: { dc: GPIO19, i2c: internal-i2c, reset: GPIO15, spi: display-spi }
      parameters:
        power-layout: station
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
        orientation: deg90
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # The battery behind the AXP192 the display also uses. The two
    # INA3221 port monitors at 40h and 41h are not declared: a Board
    # has one power monitor.
    power-monitor:
      implementation: axp192-axp2101-power-monitor
      bindings: { i2c: internal-i2c }
    # Buttons A, B, C on GPIO37, GPIO38, GPIO39, active low with the
    # Board's pull-ups (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO37
        button-2: GPIO38
        button-3: GPIO39
