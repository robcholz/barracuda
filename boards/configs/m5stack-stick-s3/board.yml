name: m5stack-stick-s3
profile: screen
hardware:
  chip: esp32s3
  # ESP32-S3-PICO-1-N8R8.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5StickS3: SCL G48 / SDA G47,
        # at the M5PM1's 100 kHz (M5Unified `M5PM1_Class`).
        peripheral: I2C0
        scl: GPIO48
        sda: GPIO47
        frequency-hz: 100000
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO40
        mosi: GPIO39
        chip-select: GPIO41
        frequency-hz: 40000000
  devices:
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO38, dc: GPIO45, reset: GPIO21, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
    # The battery behind the M5PM1 at 6Eh; the charger's status is M5PM1 G0
    # (M5Unified `Power_Class::isCharging`).
    power-monitor:
      implementation: m5pm1-power-monitor
      bindings: { i2c: internal-i2c }
      parameters: { charge-status: g0 }
    # Buttons A (GPIO11) and B (GPIO12), active low with the Board's
    # pull-ups (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO11
        button-2: GPIO12
