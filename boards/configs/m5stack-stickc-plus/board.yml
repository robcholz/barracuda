name: m5stack-stickc-plus
profile: screen
hardware:
  chip: esp32
  # ESP32-PICO-D4.
  flash-size: 4mb
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX/M5Unified: the internal bus (400 kHz) of the AXP192 at 34h.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX StickC Plus: SPI2_HOST at 40 MHz.
        peripheral: SPI2
        sck: GPIO13
        mosi: GPIO15
        chip-select: GPIO5
        frequency-hz: 40000000
  devices:
    display:
      # ST7789 135x240 at offset (52, 40) in its 240x320 frame. AXP192 LDO3
      # powers it and LDO2 lights it; GPIO18 resets it.
      implementation: m5stack-pmic-display
      bindings: { dc: GPIO23, i2c: internal-i2c, reset: GPIO18, spi: display-spi }
      parameters:
        power-layout: stickc
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
    status-led:
      implementation: indicator-led
      bindings:
        # Red status LED on GPIO10, active low (Espressif m5stack_stickc
        # board_devices.yaml).
        pin: GPIO10
      parameters:
        active-level: low
exposed-io:
  pins:
    # Grove port G32/G33 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g32: { pin: GPIO32 }
    grove-g33: { pin: GPIO33 }
