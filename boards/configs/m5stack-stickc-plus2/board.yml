name: m5stack-stickc-plus2
profile: screen
hardware:
  chip: esp32
  # ESP32-PICO-V3-02.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 2097152
  # Battery power latch (M5GFX and M5Unified POWER_HOLD_PIN): the Board
  # switches itself off on battery once its power button is released unless
  # GPIO4 is high, so the Platform entry drives it high first.
  power-hold: GPIO4
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in`: the internal bus, SCL G22 / SDA G21.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX StickC Plus2: SPI2_HOST at 40 MHz, write-only.
        peripheral: SPI2
        sck: GPIO13
        mosi: GPIO15
        chip-select: GPIO5
        frequency-hz: 40000000
  devices:
    display:
      # ST7789 135x240 at offset (52, 40) in its 240x320 frame; backlight on
      # GPIO27, active high.
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO27, dc: GPIO14, reset: GPIO12, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # MPU6886 at 68h (M5Unified `IMU_Class::begin`).
    inertial-measurement:
      implementation: mpu6886-imu
      bindings: { i2c: internal-i2c }
    # Buttons A (front), B (side), and the power button on GPIO37, GPIO39,
    # and GPIO35, active low with the Board's pull-ups (M5Unified
    # `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO37
        button-2: GPIO39
        button-3: GPIO35
