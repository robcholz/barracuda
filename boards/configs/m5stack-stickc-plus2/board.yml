name: m5stack-stickc-plus2
profile: screen
hardware:
  chip: esp32
  # ESP32-PICO-V3-02.
  flash-size: 8mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 2097152
  # Battery power latch (M5GFX and M5Unified POWER_HOLD_PIN): the Board
  # switches itself off on battery once its power button is released unless
  # GPIO4 is high, so the Platform entry drives it high first.
  power-hold: GPIO4
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in`: the internal bus, SCL G22 / SDA G21.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX StickC Plus2: SPI2_HOST at 40 MHz, write-only.
        peripheral: SPI2
        sck: GPIO13
        mosi: GPIO15
        chip-select: GPIO5
        frequency-hz: 40000000
    analog-input:
      battery-sense:
        # M5Unified `Power_Class::begin` StickC Plus2: the battery on
        # ADC1 GPIO38 through a divider of two (`_adc_ratio = 2.0f`).
        peripheral: ADC1
        pin: GPIO38
    pdm-i2s-stream:
      microphone:
        # M5Unified `_begin_audio` StickC Plus2: the SPM1423 PDM microphone,
        # clock GPIO0 and data GPIO34, on I2S0 (the ESP32's PDM receiver).
        peripheral: I2S0
        dma: DMA_I2S0
        clk: GPIO0
        din: GPIO34
        sample-rate-hz: 16000
        dma-buffer-bytes: 4096
  devices:
    battery:
      implementation: adc-battery-power-monitor
      bindings: { sense: battery-sense }
      parameters:
        divider-numerator: 2
    microphone:
      # SPM1423 PDM microphone; the StickC Plus2 has no speaker amplifier (its
      # GPIO2 buzzer is not an I2S device).
      implementation: pdm-i2s-audio-codec
      bindings: { stream: microphone }
    display:
      # ST7789 135x240 at offset (52, 40) in its 240x320 frame; backlight on
      # GPIO27, active high.
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO27, dc: GPIO14, reset: GPIO12, spi: display-spi }
      parameters:
        controller: st7789
        width: 135
        height: 240
        offset-x: 52
        offset-y: 40
        invert-colors: true
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    # MPU6886 at 68h (M5Unified `IMU_Class::begin`).
    inertial-measurement:
      implementation: mpu6886-imu
      bindings: { i2c: internal-i2c }
    # Buttons A (front), B (side), and the power button on GPIO37, GPIO39,
    # and GPIO35, active low with the Board's pull-ups (M5Unified
    # `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO37
        button-2: GPIO39
        button-3: GPIO35
    status-led:
      implementation: indicator-led
      bindings:
        # Red status LED, shared with the IR emitter, on GPIO19, active high (Espressif
        # m5stack_stickc_plus2; M5Unified `StickCPlus2_LED_PIN`).
        pin: GPIO19
      parameters:
        active-level: high
exposed-io:
  pins:
    # Grove port G32/G33 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g32: { pin: GPIO32 }
    grove-g33: { pin: GPIO33 }
