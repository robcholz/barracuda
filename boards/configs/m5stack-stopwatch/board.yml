name: m5stack-stopwatch
profile: screen
hardware:
  chip: esp32s3
  # ESP32-S3R8 with 16 MB flash.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: octal-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX/M5Unified internal bus: SCL G48, SDA G47, at the M5IOE1's
        # 100 kHz.
        peripheral: I2C0
        scl: GPIO48
        sda: GPIO47
        frequency-hz: 100000
    quad-spi-device:
      display-link:
        # M5GFX `board_M5StopWatch`: SPI2, SCLK G40, IO0..IO3 G41/G42/G46/G45,
        # CS G39, written at 80 MHz.
        peripheral: SPI2
        sck: GPIO40
        data: [GPIO41, GPIO42, GPIO46, GPIO45]
        chip-select: GPIO39
        frequency-hz: 80000000
    i2s-stream:
      audio-stream:
        # M5Unified `_begin_audio` (board_M5StopWatch): MCLK GPIO18, BCK
        # GPIO17, WS GPIO15, data out GPIO21, data in GPIO16.
        peripheral: I2S0
        dma: DMA_CH1
        bclk: GPIO17
        ws: GPIO15
        dout: GPIO21
        din: GPIO16
        mclk: GPIO18
        sample-rate-hz: 16000
        channels: 2
        bits-per-sample: 16
        dma-buffer-bytes: 4096
  devices:
    audio-codec:
      # ES8311 (18h) on the internal bus; the M5IOE1's G3 switches the audio
      # supply and its G10 the AW8737A amplifier (M5Unified
      # `_speaker_enabled_cb_stopwatch`).
      implementation: es8311-audio-codec
      bindings: { control: internal-i2c, stream: audio-stream }
      parameters:
        m5ioe1-supply-pin: 3
        m5ioe1-amplifier-pin: 10
    display:
      # 1.75-inch 466 x 466 round AMOLED on a CO5300; reset and supply
      # enables on the M5IOE1 at 0x4F.
      implementation: stopwatch-co5300-display
      bindings:
        bus: display-link
        expander: internal-i2c
      parameters:
        expander-address: 79
    inertial-measurement:
      implementation: bmi270-imu
      bindings: { i2c: internal-i2c }
      parameters:
        # BMI270 at 68h (M5GFX StopWatch/PaperMono I2C probe list).
        address: 104
    real-time-clock:
      implementation: rx8130ce-rtc
      bindings: { i2c: internal-i2c }
      parameters:
        # RX8130CE at 32h (M5GFX probe list; M5Unified RTC_Class).
        address: 50
exposed-io:
  pins:
    # Port A: M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA).
    port-a-scl: { pin: GPIO11 }
    port-a-sda: { pin: GPIO10 }
