name: m5stack-timercam
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 4mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
  # Battery power latch (M5Unified `TimerCam_POWER_HOLD_PIN`, driven high
  # at start).
  power-hold: GPIO33
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5TimerCam: SCL G14 / SDA G12.
        peripheral: I2C1
        scl: GPIO14
        sda: GPIO12
        frequency-hz: 400000
  devices:
    # BM8563 at its fixed address 51h (M5Unified `RTC_Class`).
    real-time-clock:
      implementation: bm8563-rtc
      bindings: { i2c: internal-i2c }
    status-led:
      implementation: indicator-led
      bindings:
        # Status LED on GPIO2, active high: M5Unified drives it low for off
        # (`TimerCam_LED_PIN`).
        pin: GPIO2
      parameters:
        active-level: high
exposed-io:
  pins:
    # Grove port G4/G13 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g4: { pin: GPIO4 }
    grove-g13: { pin: GPIO13 }
