name: m5stack-timercam
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 4mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
  # Battery power latch (M5Unified `TimerCam_POWER_HOLD_PIN`, driven high
  # at start).
  power-hold: GPIO33
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
