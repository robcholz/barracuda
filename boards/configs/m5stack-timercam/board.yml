name: m5stack-timercam
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 4mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
  # Battery power latch (M5Unified `TimerCam_POWER_HOLD_PIN`, driven high
  # at start).
  power-hold: GPIO33
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    analog-input:
      battery-sense:
        # M5Unified `Power_Class::begin` TimerCam: the battery on ADC1 GPIO38
        # with `_adc_ratio = 1.513f`.
        peripheral: ADC1
        pin: GPIO38
  devices:
    battery:
      implementation: adc-battery-power-monitor
      bindings: { sense: battery-sense }
      parameters:
        divider-numerator: 1513
        divider-denominator: 1000
    status-led:
      implementation: indicator-led
      bindings:
        # Status LED on GPIO2, active high: M5Unified drives it low for off
        # (`TimerCam_LED_PIN`).
        pin: GPIO2
      parameters:
        active-level: high
exposed-io:
  pins:
    # Grove port G4/G13 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g4: { pin: GPIO4 }
    grove-g13: { pin: GPIO13 }
