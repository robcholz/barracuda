name: m5stack-tough
profile: screen
hardware:
  chip: esp32
  # ESP32-D0WDQ6-V3.
  flash-size: 16mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 8388608
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5GFX/M5Unified: the internal bus (I2C_NUM_1, 400 kHz) of the AXP192 at 34h.
        peripheral: I2C1
        scl: GPIO22
        sda: GPIO21
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX Tough (shared with the Core2 path): SPI3_HOST at 40 MHz.
        # MISO (GPIO38) only serves the TF card.
        peripheral: SPI3
        sck: GPIO18
        mosi: GPIO23
        chip-select: GPIO5
        frequency-hz: 40000000
  devices:
    display:
      # ILI9342C 320x240. AXP192 LDO2 powers it, GPIO4 resets it, LDO3 lights it.
      implementation: m5stack-pmic-display
      bindings: { dc: GPIO15, i2c: internal-i2c, spi: display-spi }
      parameters:
        power-layout: tough
        controller: ili9342c
        width: 320
        height: 240
        invert-colors: true
