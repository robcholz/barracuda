name: m5stack-unit-c6l
profile: screen
hardware:
  chip: esp32c6
  # Stamp C6LoRa (ESP32-C6 with 16 MB flash).
  flash-size: 16mb
toolchain:
  target: riscv32imac-unknown-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    i2c-device:
      internal-i2c:
        # M5Unified `_pin_table_i2c_ex_in` board_M5UnitC6L: SCL G8 / SDA G10.
        peripheral: I2C0
        scl: GPIO8
        sda: GPIO10
        frequency-hz: 400000
    spi-device:
      display-spi:
        # M5GFX `board_M5UnitC6L`: SCLK G20, MOSI G21, OLED CS G6 at 40 MHz.
        # The bus is shared with the SX1262 LoRa modem below.
        peripheral: SPI2
        sck: GPIO20
        mosi: GPIO21
        # The SX1262's data out; the OLED only listens.
        miso: GPIO22
        chip-select: GPIO6
        frequency-hz: 40000000
      lora-spi:
        # SX1262 on the same bus: MISO G22, NSS G23 (M5Stack's Meshtastic
        # variant `m5stack_unitc6l/variant.h` and UIFlow `hardware/lora.py`
        # agree). 8 MHz, half the chip's 16 MHz limit.
        peripheral: SPI2
        sck: GPIO20
        mosi: GPIO21
        miso: GPIO22
        chip-select: GPIO23
        frequency-hz: 8000000
    rmt-output:
      rgb-led-data:
        # WS2812 on GPIO2 (M5Unified `_pin_table_other0` (RGBLED),
        # board_M5UnitC6L; Zephyr `m5stack_unitc6l`), on RMT channel 0: the
        # one SPI controller drives the OLED.
        peripheral: RMT
        channel: 0
        pin: GPIO2
    pwm-output:
      buzzer-tone:
        # Passive buzzer on GPIO11 (M5Unified `_begin_audio` board_M5UnitC6L:
        # `spk_cfg.buzzer = true`).
        peripheral: LEDC
        timer: Timer1
        channel: Channel1
        pin: GPIO11
  devices:
    display:
      # 0.66-inch 64 x 48 SSD1306 OLED at GDDRAM column 32 (M5GFX
      # `Panel_SSD1306` with `offset_x = 32`); D/C G18, reset G15.
      implementation: ssd1306-spi-display
      bindings:
        spi: display-spi
        dc: GPIO18
        reset: GPIO15
      parameters:
        width: 64
        height: 48
        column-offset: 32
        com-pins: 18
    # The button on P0 of the PI4IOE5V6408 at 43h, active low with the
    # expander's pull-up (M5Unified `Power_Class::begin` and `update`).
    buttons:
      implementation: pi4ioe5v6408-buttons
      bindings: { i2c: internal-i2c }
      parameters: { button-1: p0 }
    # The RGB LED, one LED, GRB order.
    led-strip:
      implementation: rmt-led-strip
      bindings:
        data: rgb-led-data
      parameters:
        led-count: 1
        color-order: grb
    # The passive buzzer; its timer and channel leave the runtime PWM pool
    # its own (Timer0, Channel0).
    buzzer:
      implementation: pwm-buzzer
      bindings: { output: buzzer-tone }
    # SX1262 LoRa modem (Meshtastic `m5stack_unitc6l`: BUSY G19, DIO1 G7,
    # DIO2 drives the antenna switch, 3.0 V TCXO on DIO3; UIFlow
    # `hardware/lora.py` has the same pins). Its reset, RF switch, and LNA
    # enable are P7, P6, and P5 of the PI4IOE5V6408 at 43h the button also
    # uses (M5Unified `Power_Class::begin` and the Meshtastic `c6l_init`,
    # which turns the RF switch and LNA on). UIFlow supplies the TCXO with
    # 3.3 V and Meshtastic with 3.0 V; this uses Meshtastic's, the lower.
    # The front end passes 850-930 MHz (UIFlow `LoRa.set_freq`).
    lora:
      implementation: sx1262-pi4ioe5v6408-lora
      bindings:
        spi: lora-spi
        busy: GPIO19
        dio1: GPIO7
        expander: internal-i2c
      parameters:
        reset-pin: p7
        rf-switch-pin: p6
        lna-pin: p5
        tcxo-voltage: 3.0v
        dio2-rf-switch: true
        min-frequency-hz: 850000000
        max-frequency-hz: 930000000
exposed-io:
  pins:
    # Grove port G4/G5 (M5Unified `_pin_table_port_bc`).
    grove-g4: { pin: GPIO4 }
    grove-g5: { pin: GPIO5 }
