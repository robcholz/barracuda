name: m5stack-va-meter
profile: screen
hardware:
  chip: esp32s3
  # StampS3 (ESP32-S3FN8).
  flash-size: 8mb
toolchain:
  target: xtensa-esp32s3-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-device:
      display-spi:
        peripheral: SPI3
        sck: GPIO36
        mosi: GPIO35
        chip-select: GPIO37
        frequency-hz: 40000000
    pwm-output:
      buzzer-tone:
        # Passive buzzer on GPIO14 (M5Unified `_begin_audio` board_M5VAMeter:
        # `spk_cfg.buzzer = true`).
        peripheral: LEDC
        timer: Timer1
        channel: Channel1
        pin: GPIO14
  devices:
    display:
      implementation: mipi-dbi-display
      bindings: { backlight: GPIO38, dc: GPIO34, reset: GPIO33, spi: display-spi }
      parameters: { controller: st7789, width: 240, height: 240, invert-colors: true }
    # Buttons A (GPIO2) and B (GPIO0), active low with the Board's pull-ups
    # (M5Unified `M5Unified::update`).
    buttons:
      implementation: gpio-buttons
      bindings:
        button-1: GPIO2
        button-2: GPIO0
    # The passive buzzer; its timer and channel leave the runtime PWM pool
    # its own (Timer0, Channel0).
    buzzer:
      implementation: pwm-buzzer
      bindings: { output: buzzer-tone }
exposed-io:
  pins:
    # Grove port G8/G9 (M5Unified `_pin_table_i2c_ex_in` (external SCL/SDA)).
    grove-g8: { pin: GPIO8 }
    grove-g9: { pin: GPIO9 }
