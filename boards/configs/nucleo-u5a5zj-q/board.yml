name: nucleo-u5a5zj-q
hardware:
  chip: stm32u5a5zj
toolchain:
  target: thumbv8m.main-none-eabihf
native-layout:
  artifact: memory.x
peripherals:
  devices:
    status-led:
      implementation: indicator-led
      bindings:
        # NUCLEO-U5A5ZJ-Q UM2861: green LD1 is PC7.
        pin: PC7
      parameters:
        active-level: high
exposed-io:
  pins:
    user-button:
      # UM2861: blue B1 user button is connected to PC13.
      pin: PC13
