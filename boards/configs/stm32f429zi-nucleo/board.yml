name: stm32f429zi-nucleo
hardware:
  chip: stm32f429zi
toolchain:
  target: thumbv7em-none-eabihf
native-layout:
  artifact: memory.x
builtin-peripherals:
  status-led:
    driver: indicator-led
    bindings:
      # NUCLEO-F429ZI UM1974 default SB120/SB127 routing: green LD1 is PB0.
      pin: PB0
    parameters:
      active-level: high
exposed-io:
  gpio:
    user-button:
      # UM1974: blue B1 user button is connected to PC13.
      pin: PC13
