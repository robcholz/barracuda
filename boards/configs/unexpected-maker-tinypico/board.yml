name: unexpected-maker-tinypico
profile: connected
hardware:
  chip: esp32
  # ESP32-PICO-D4 with 4 MB QSPI PSRAM.
  flash-size: 4mb
  external-memory:
    technology: psram
    interface: quad-spi
    size-bytes: 4194304
toolchain:
  target: xtensa-esp32-none-elf
native-layout:
  artifact: partitions.csv
peripherals:
  io:
    spi-bus:
      rgb-led:
        # Unexpected Maker TinyPICO onboard APA102 clock and data wiring.
        peripheral: SPI2
        sck: GPIO12
        mosi: GPIO2
        frequency-hz: 1000000
    analog-input:
      battery-sense:
        # TinyPICO helper library: BAT_VOLTAGE is GPIO35 (ADC1 channel 7)
        # behind 442 k over 160 k (`UPPER_DIVIDER`, `LOWER_DIVIDER`).
        peripheral: ADC1
        pin: GPIO35
  devices:
    battery:
      # BAT_CHARGE, GPIO34, reads low while the charger charges
      # (`IsChargingBattery`).
      implementation: adc-battery-power-monitor
      bindings: { sense: battery-sense, charging: GPIO34 }
      parameters:
        divider-numerator: 602
        divider-denominator: 160
        charging-level: low
    led-strip:
      implementation: apa102-led-strip
      bindings:
        power-enable: GPIO13
        spi: rgb-led
      parameters:
        led-count: 1
        global-brightness: 31
