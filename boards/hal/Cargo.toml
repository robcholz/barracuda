[package]
name = "barracuda-board-hal"
version = "0.1.0"
edition = "2021"
description = "Board HAL composition contract for Barracuda"

[dependencies]
barracuda-peripheral.workspace = true
critical-section = "1"
embassy-executor.workspace = true
embedded-hal.workspace = true
embedded-hal-bus.workspace = true
embedded-hal-async.workspace = true
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-graphics-core.workspace = true

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
