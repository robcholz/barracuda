[package]
name = "barracuda-board-hal"
version = "0.1.0"
edition = "2021"
description = "Board HAL composition contract for Barracuda"

[dependencies]
barracuda-driver.workspace = true
critical-section = "1"
embassy-executor.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
