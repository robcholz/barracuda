# The Agent and the message gateways on top of network, still without Lua.
# BlueBubbles and Inkbox are left out; a Board that wants them sets
# `plugins.imessage-bluebubble.enabled` or `plugins.imessage-inkbox.enabled`.
extends: network
enable:
  - agent
  - agent-file
  - agent-http
  - agent-imessage-gateway
  - agent-scheduler
  - agent-time
  - agent-websearch
  - agent-workflow
  - imessage-gateway
  - imessage-qq
  - imessage-telegram
  - imessage-web
  - imessage-wechat
