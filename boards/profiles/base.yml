# The Plugins a Board builds unless it names another profile: every Plugin
# that needs no screen. Boards with one name `device`, which adds the system
# UI. A Board turns a Plugin off with `plugins.<id>.enabled: false`; a narrower
# product names a profile that lists only its own Plugins.
