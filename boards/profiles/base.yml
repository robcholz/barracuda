# The Plugins a Board builds unless it names another profile: every Plugin
# that needs no screen, as offline scripting and the online assistant plus the
# Lua packages that need both. Boards with a screen name `device`. A Board
# turns a Plugin off with `plugins.<id>.enabled: false`; a narrower product
# names a narrower profile, such as core, scripting, connected, or assistant.
extends: [scripting, assistant]
enable:
  - agent-vm
  - vm-agent
  - vm-http
  - vm-webserver
