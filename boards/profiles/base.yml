  - captive-portal
  - display
  - files
  - gpio
  - http
  - i2c
  - i2s
  - imessage-bluebubble
  - imessage-gateway
  - imessage-inkbox
  - imessage-qq
  - imessage-telegram
  - imessage-web
  - imessage-wechat
  - imu
  - led-strip
