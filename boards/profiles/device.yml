# Products with a screen: the base set plus the app manager, which shows apps
# and the system UI on the Board's primary display, the system fonts they
# draw with, and the builtin apps.
extends: base
enable:
  - app-manager
  - builtin-app-files
  - builtin-app-sessions
  - builtin-app-settings
  - builtin-app-workflow
  - system-fonts
