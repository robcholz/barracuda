# Offline scripting: minimal plus the Lua VM and the Lua packages that need no
# network, including those for the Board's hardware.
extends: minimal
enable:
  - analog
  - audio
  - camera
  - display
  - environment-sensor
  - gpio
  - i2c
  - i2s
  - imu
  - keyboard
  - led-strip
  - message-queue
  - power-monitor
  - pwm
  - rotary-encoder
  - spi
  - uart
  - vm
  - vm-filesystem
  - vm-systeminfo
  - vm-time
