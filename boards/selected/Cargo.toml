[package]
name = "barracuda-board-selected"
version = "0.1.0"
edition = "2021"
description = "Compile-time selected Barracuda Board HAL"

[dependencies]
barracuda-board.workspace = true
barracuda-board-hal.workspace = true
embassy-executor.workspace = true

[target.'cfg(target_arch = "arm")'.dependencies]
barracuda-board-stm32f429zi-nucleo.workspace = true

[build-dependencies]
barracuda-board-config.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
