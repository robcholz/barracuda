[package]
name = "barracuda-board-tool"
version = "0.1.0"
edition = "2021"
description = "Workspace command for selecting a Barracuda Board"

[[bin]]
name = "barracuda-board"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
barracuda-board-config.workspace = true
barracuda-driver-config.workspace = true
barracuda-cli-style.workspace = true
barracuda-platform-config.workspace = true
barracuda-platform-tool.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
