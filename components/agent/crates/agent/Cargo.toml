[package]
name = "barracuda-agent"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Assembled agent-system API over barracuda-agent-runtime runtime and Sessions"
autotests = false

[lib]
name = "barracuda_agent"
path = "src/lib.rs"

[[test]]
name = "embassy_runtime"

[features]
# Concepts:
# - target selection and concrete HAL adapters belong to the application, not
#   to this executor-neutral framework crate.
# - `cache_profile` forwards provider usage support.
#
multiagent = ["barracuda-agent-runtime/multiagent"]
intrusive-observability = ["barracuda-agent-runtime/intrusive-observability"]
# Provider token/cache usage diagnostics.
cache_profile = [
    "barracuda-model-api/cache_profile",
    "barracuda-agent-runtime/cache_profile",
]

[dependencies]
json-validator = { path = "../../../../shared/json-validator" }
barracuda-agent-runtime = { path = "../runtime", default-features = false }
barracuda-model-api = { path = "../model-api" }
barracuda-net = { path = "../../../../shared/net" }
barracuda-agent-persistence = { path = "../persistence" }
barracuda-agent-tool = { path = "../tool" }
# Filesystem traits remain platform-neutral. HTTP is concrete reqwless I/O
# through `barracuda-net`; time is provided globally by `embassy-time`.
barracuda-fs = { path = "../../../../shared/fs" }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# Host-only dependencies used by tests and the `tool_submit_loop` API example.
anyhow = "1"
barracuda-agent-trace = { path = "../trace" }
# Host test dependencies enable serde's std support, so yaml-peg must expose
# its matching std error implementation in the unified test graph.
barracuda-agent-skill = { path = "../skill", features = ["std"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
# In-memory fs + scripted network doubles so the end-to-end tests run hermetically
# (no network, no API key) entirely through the public API.
barracuda-fs = { path = "../../../../shared/fs", features = [
    "diskfs",
] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"
barracuda-net = { path = "../../../../shared/net", features = ["testing"] }
tempdir = "0.3"
static_cell = "2"
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
