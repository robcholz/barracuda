[package]
name = "barracuda-agent-component"
version = "0.1.0"
edition = "2021"
description = "Event Router Component adapter for the Agent runtime"

[dependencies]
barracuda-agent-runtime = { path = "../runtime" }
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-fs = { path = "../../../../shared/fs" }
barracuda-net = { path = "../../../../shared/net" }
embassy-sync.workspace = true
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
barracuda-model-api = { path = "../model-api" }
barracuda-net = { path = "../../../../shared/net", features = ["testing"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"
static_cell = "2.1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
