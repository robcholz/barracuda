[package]
name = "barracuda-agent-multiagent"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Multiagent graph, policy, tools, and semantic effects"

[dependencies]
json-validator = { path = "../../../../shared/json-validator" }
barracuda-agent = { path = "../agent", features = ["multiagent"] }
barracuda-agent-permission = { path = "../permission" }
barracuda-agent-tool = { path = "../tool" }
async-channel = { version = "2", default-features = false }
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
futures-core = { version = "0.3", default-features = false }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
