[package]
name = "barracuda-agent-skill"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "no_std filesystem runtime for standard Agent Skills"

[features]
default = []
# Host consumers that unify serde's std support must also enable yaml-peg's
# matching error implementation.
std = ["yaml-peg/std"]

[dependencies]
barracuda-fs = { path = "../../../../shared/fs" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }
yaml-peg = { version = "1.0.8", default-features = false, features = ["serde"] }

[dev-dependencies]
# `diskfs` reads the data-driven golden fixtures from the checkout; `MemFs` is
# part of the base interface crate.
barracuda-fs = { path = "../../../../shared/fs", features = ["diskfs"] }
# Ergonomic error handling for host dev workflow examples; never in firmware.
anyhow = "1"
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unreachable_pub = "deny"
