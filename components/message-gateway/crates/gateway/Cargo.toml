[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
description = "Minimal channel registry and outbound messaging facade"
license = "Apache-2.0"

[dependencies]
futures-core = { version = "0.3", default-features = false }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
