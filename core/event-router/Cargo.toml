[package]
name = "barracuda-event-router"
authors = ["Finn(Ziheng) Sheng <zsheng2@ncsu.edu>", "Finn(Ziheng) Sheng <robcholz00@gmail.com>"]
version = "0.1.0"
edition = "2021"
description = "Component and Workflow composition for Barracuda Event Router"

[lib]
crate-type = ["rlib"]

[[bench]]
name = "profile"
path = "bench/profile/main.rs"
harness = false

[[bench]]
name = "throughput"
path = "bench/throughput/main.rs"
harness = false

[dependencies]
barracuda-fs = { path = "../../shared/fs" }
barracuda-router = { path = "crates/router" }
barracuda-rpc = { path = "crates/rpc" }
barracuda-rpc-schema = { path = "crates/rpc-schema", optional = true }
barracuda-workflow = { path = "crates/workflow" }
thiserror = "2"

[features]
# Host-only: re-exports the JSON Schema bake pipeline (schemars) for `build.rs`
# and wire crates. Off by default so the device build stays no_std.
schema = ["dep:barracuda-rpc-schema"]

[dev-dependencies]
barracuda-profile = { path = "../../shared/profile", features = ["dhat-heap"] }
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_cell = "2.1.1"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
zerocopy = { version = "0.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
