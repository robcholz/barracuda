[package]
name = "barracuda-event-router"
authors = ["Finn(Ziheng) Sheng <zsheng2@ncsu.edu>", "Finn(Ziheng) Sheng <robcholz00@gmail.com>"]
version = "0.1.0"
edition = "2021"
description = "Component and Workflow composition for Barracuda Event Router"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-fs = { path = "../../shared/fs" }
barracuda-router = { path = "crates/router" }
barracuda-rpc = { path = "crates/rpc" }
barracuda-workflow = { path = "crates/workflow" }
thiserror = "2"

[dev-dependencies]
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["async-await"] }
static_cell = "2.1.1"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
