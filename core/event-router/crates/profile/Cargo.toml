[package]
name = "barracuda-event-router-profile"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Deterministic host heap profiles for Barracuda Event Router"
publish = false
default-run = "barracuda-event-router-profile"

[[bin]]
name = "barracuda-event-router-profile"
path = "src/main.rs"

[dependencies]
barracuda-event-router = { path = "../.." }
barracuda-profile = { path = "../../../../components/agent/bench/crates/profile", features = ["dhat-heap"] }
barracuda-router = { path = "../router" }
barracuda-rpc = { path = "../rpc" }
futures-lite = "2"
static_cell = "2.1.1"

[lints.rust]
unsafe_code = "forbid"
