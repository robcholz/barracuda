[package]
name = "barracuda-event-router-schema-demo"
authors = ["Finn(Ziheng) Sheng <zsheng2@ncsu.edu>", "Finn(Ziheng) Sheng <robcholz00@gmail.com>"]
version = "0.1.0"
edition = "2021"
description = "Runs the Event Router schema-bake pipeline end to end"
publish = false
default-run = "barracuda-event-router-schema-demo"

[[bin]]
name = "barracuda-event-router-schema-demo"
path = "src/main.rs"

[build-dependencies]
barracuda-event-router = { path = "../..", features = ["schema"] }
schema-wire = { path = "../schema-wire", package = "barracuda-event-router-schema-wire", features = ["schema"] }

[dependencies]
barracuda-event-router = { path = "../.." }
schema-wire = { path = "../schema-wire", package = "barracuda-event-router-schema-wire" }
serde_json = "1"
static_cell = "2.1.1"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
