[package]
name = "barracuda-event-router-schema-wire"
authors = ["Finn(Ziheng) Sheng <zsheng2@ncsu.edu>", "Finn(Ziheng) Sheng <robcholz00@gmail.com>"]
version = "0.1.0"
edition = "2021"
description = "Request DTOs shared by the Event Router schema-bake example"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
schema = ["dep:barracuda-rpc-schema", "dep:schemars"]

[dependencies]
barracuda-rpc = { path = "../../crates/rpc" }
barracuda-rpc-schema = { path = "../../crates/rpc-schema", optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1", default-features = false, features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
