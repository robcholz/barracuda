[package]
name = "barracuda-plugin-api"
version = "0.1.0"
edition = "2021"
description = "Construction context shared by Barracuda Plugins"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-board-hal = { path = "../../../../boards/hal" }
barracuda-plugin-macros = { path = "../macros" }
embassy-net.workspace = true
http-client = { path = "../../../../shared/http-client" }

[dev-dependencies]
barracuda-platform-test = { path = "../../../../platforms/test" }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
