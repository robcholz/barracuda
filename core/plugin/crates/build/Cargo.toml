[package]
name = "barracuda-plugin-build"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared host task executor for Plugin CLI and Cargo build scripts"

[dependencies]
barracuda-plugin-manifest = { path = "../manifest" }
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
