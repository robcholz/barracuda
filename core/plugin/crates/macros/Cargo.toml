[package]
name = "barracuda-plugin-macros"
version = "0.1.0"
edition = "2021"
description = "Compile-time manifest macros for Barracuda Plugins"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
barracuda-plugin-manifest = { path = "../manifest" }
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
