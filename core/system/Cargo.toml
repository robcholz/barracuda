[package]
name = "barracuda-system"
version = "0.1.0"
edition = "2021"
description = "Barracuda system composition root that registers the fixed Plugin set"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-board-hal.workspace = true
barracuda-event-router.workspace = true
# BEGIN GENERATED PLUGINS
barracuda-agent-plugin.workspace = true
barracuda-file-plugin.workspace = true
barracuda-gpio-plugin.workspace = true
barracuda-http-plugin.workspace = true
barracuda-i2c-plugin.workspace = true
barracuda-imessage-bluebubble-plugin.workspace = true
barracuda-imessage-bridge-plugin.workspace = true
barracuda-imessage-gateway-plugin.workspace = true
barracuda-imessage-inkbox-plugin.workspace = true
barracuda-imessage-qq-plugin.workspace = true
barracuda-imessage-telegram-plugin.workspace = true
barracuda-imessage-web-plugin.workspace = true
barracuda-imessage-wechat-plugin.workspace = true
barracuda-message-queue-plugin.workspace = true
barracuda-scheduler-plugin.workspace = true
barracuda-spi-plugin.workspace = true
barracuda-time-plugin.workspace = true
barracuda-vm-plugin.workspace = true
barracuda-web-search-plugin.workspace = true
barracuda-webserver-plugin.workspace = true
# END GENERATED PLUGINS
barracuda-plugin-api.workspace = true
barracuda-plugin-manager.workspace = true
barracuda-platform.workspace = true
barracuda-target-api.workspace = true
barracuda-tls.workspace = true
http-client = { workspace = true, features = ["mbedtls"] }
barracuda-vfs.workspace = true
barracuda-vfs-littlefs.workspace = true
embassy-executor.workspace = true
embassy-embedded-hal = "0.5.0"
embassy-net.workspace = true
log.workspace = true
thiserror = { version = "2", default-features = false }
embedded-storage = "0.3"
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[dev-dependencies]
barracuda-platform-test.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[build-dependencies]
barracuda-plugin-tool.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
