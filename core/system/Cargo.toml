[package]
name = "barracuda-system"
version = "0.1.0"
edition = "2021"
description = "Barracuda system composition root that registers the fixed Plugin set"

[lib]
crate-type = ["rlib"]

[dependencies]
portable-atomic-util.workspace = true
barracuda-board-hal.workspace = true
# The selected Board's Plugins, written by `cargo board select`.
barracuda-plugin-selection = { path = "../../.barracuda/selection/plugins" }
barracuda-plugin.workspace = true
barracuda-platform.workspace = true
barracuda-target-api.workspace = true
barracuda-vfs.workspace = true
barracuda-vfs-fat.workspace = true
barracuda-vfs-littlefs.workspace = true
barracuda-vfs-memfs.workspace = true
embassy-executor.workspace = true
embassy-embedded-hal = "0.5.0"
embassy-futures.workspace = true
embassy-net.workspace = true
embassy-sync.workspace = true
log.workspace = true
thiserror = { version = "2", default-features = false }
embedded-storage = "0.3"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-hal.workspace = true

[dev-dependencies]
barracuda-platform-test.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[build-dependencies]
barracuda-plugin-tool.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
