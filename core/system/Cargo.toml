[package]
name = "barracuda-system"
version = "0.1.0"
edition = "2021"
description = "Barracuda system composition root that registers the fixed Plugin set"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-board-hal = { path = "../../boards/hal" }
barracuda-event-router = { path = "../event-router" }
# BEGIN GENERATED PLUGINS
barracuda-agent-plugin = { path = "../../plugins/agent/crates/plugin" }
barracuda-captive-portal-plugin = { path = "../../plugins/captive-portal/crates/plugin" }
barracuda-file-plugin = { path = "../../plugins/file/crates/plugin" }
barracuda-gpio-plugin = { path = "../../plugins/gpio/crates/plugin" }
barracuda-http-plugin = { path = "../../plugins/http/crates/plugin" }
barracuda-i2c-plugin = { path = "../../plugins/i2c/crates/plugin" }
barracuda-imessage-bluebubble-plugin = { path = "../../plugins/imessage-bluebubble/crates/plugin" }
barracuda-imessage-gateway-plugin = { path = "../../plugins/imessage-gateway/crates/plugin" }
barracuda-imessage-inkbox-plugin = { path = "../../plugins/imessage-inkbox/crates/plugin" }
barracuda-imessage-qq-plugin = { path = "../../plugins/imessage-qq/crates/plugin" }
barracuda-imessage-telegram-plugin = { path = "../../plugins/imessage-telegram/crates/plugin" }
barracuda-imessage-web-plugin = { path = "../../plugins/imessage-web/crates/plugin" }
barracuda-imessage-wechat-plugin = { path = "../../plugins/imessage-wechat/crates/plugin" }
barracuda-message-queue-plugin = { path = "../../plugins/message-queue/crates/plugin" }
barracuda-scheduler-plugin = { path = "../../plugins/scheduler/crates/plugin" }
barracuda-spi-plugin = { path = "../../plugins/spi/crates/plugin" }
barracuda-time-plugin = { path = "../../plugins/time/crates/plugin" }
barracuda-vm-plugin = { path = "../../plugins/vm/crates/plugin" }
barracuda-web-search-plugin = { path = "../../plugins/web-search/crates/plugin" }
barracuda-webserver-plugin = { path = "../../plugins/webserver/crates/plugin" }
# END GENERATED PLUGINS
barracuda-plugin-api = { path = "../plugin/crates/api" }
barracuda-plugin-manager = { path = "../plugin/crates/manager" }
barracuda-platform = { path = "../../platforms/api" }
barracuda-target-api = { path = "../../composition/api" }
barracuda-tls = { path = "../../shared/tls" }
http-client = { path = "../../shared/http-client", features = ["mbedtls"] }
barracuda-vfs = { path = "../../shared/vfs" }
barracuda-vfs-littlefs = { path = "../../shared/vfs-littlefs" }
embassy-executor.workspace = true
embassy-embedded-hal = "0.5.0"
embassy-net.workspace = true
log.workspace = true
thiserror = { version = "2", default-features = false }
embedded-storage = "0.3"
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[dev-dependencies]
barracuda-model-api = { path = "../../plugins/agent/crates/model-api" }
barracuda-platform-test = { path = "../../platforms/test" }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[build-dependencies]
barracuda-plugin-tool = { path = "../../tools/plugin-tool" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
