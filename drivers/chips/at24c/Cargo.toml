[package]
name = "barracuda-driver-at24c"
version = "0.1.0"
edition = "2024"
description = "Low-level 24Cxx-class I2C serial EEPROM driver (AT24C, FM24C, and compatibles)"
license = "Apache-2.0"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
