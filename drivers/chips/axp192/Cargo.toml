[package]
name = "barracuda-driver-axp192"
version = "0.1.0"
edition = "2024"
description = "Low-level X-Powers AXP192 power-management IC Driver"
license = "Apache-2.0"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
