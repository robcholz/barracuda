[package]
name = "barracuda-driver-bmm150"
version = "0.1.0"
edition = "2024"
description = "Low-level Bosch BMM150 geomagnetic sensor Driver, on I2C or behind a host sensor's auxiliary interface"
license = "AGPL-3.0-only"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
