[package]
name = "barracuda-driver-ed047tc1"
version = "0.1.0"
edition = "2024"
description = "Low-level ED047TC1 4.7-inch parallel e-paper Driver: M5GFX's 16-level waveform engine and source/gate timing"
license = "AGPL-3.0-only"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
