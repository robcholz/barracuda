[package]
name = "barracuda-driver-esp-hosted"
version = "0.1.0"
edition = "2024"
description = "Host side of Espressif's ESP-Hosted-MCU co-processor protocol over SDIO"
license = "AGPL-3.0-only"

[dependencies]
aligned = "0.4.3"
embassy-futures.workspace = true
embassy-net-driver-channel.workspace = true
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
log.workspace = true
sdio = "0.5.1"

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
