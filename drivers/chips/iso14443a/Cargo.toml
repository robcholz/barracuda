[package]
name = "barracuda-driver-iso14443a"
version = "0.1.0"
edition = "2024"
description = "ISO/IEC 14443-A card activation and Type 2 READ over any reader chip"
license = "AGPL-3.0-only"

[dependencies]

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
