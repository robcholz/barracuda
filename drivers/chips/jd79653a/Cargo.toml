[package]
name = "barracuda-driver-jd79653a"
version = "0.1.0"
edition = "2024"
description = "Low-level JD79653A e-paper controller Driver (GDEW0154M09 1.54-inch panel)"
license = "AGPL-3.0-only"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
