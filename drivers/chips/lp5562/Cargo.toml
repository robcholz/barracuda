[package]
name = "barracuda-driver-lp5562"
version = "0.1.0"
edition = "2024"
description = "Low-level TI LP5562 four-channel I2C LED driver"
license = "AGPL-3.0-only"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
