[package]
name = "barracuda-driver-mpu6886"
version = "0.1.0"
edition = "2024"
description = "Low-level TDK InvenSense MPU6886, MPU9250, and MPU6050 accelerometer and gyroscope driver"
license = "Apache-2.0"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
