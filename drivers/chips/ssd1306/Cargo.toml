[package]
name = "barracuda-driver-ssd1306"
version = "0.1.0"
edition = "2024"
description = "Low-level Solomon Systech SSD1306 monochrome OLED controller driver over four-wire SPI"
license = "AGPL-3.0-only"

[dependencies]
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
