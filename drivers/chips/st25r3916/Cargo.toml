[package]
name = "barracuda-driver-st25r3916"
version = "0.1.0"
edition = "2024"
description = "Low-level ST25R3916 NFC reader Driver over I2C, ISO/IEC 14443-A polling mode"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-iso14443a.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
