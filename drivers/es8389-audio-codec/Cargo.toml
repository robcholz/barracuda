[package]
name = "barracuda-es8389-audio-codec"
version = "0.1.0"
edition = "2024"
description = "ES8389 audio codec Driver over embedded-hal I2C"
license = "Apache-2.0"

[dependencies]
barracuda-driver.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
