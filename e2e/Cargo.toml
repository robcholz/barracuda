[package]
name = "barracuda-e2e"
version = "0.1.0"
edition = "2021"
description = "End-to-end Barracuda System composition and deterministic replay tests"

[dependencies]
barracuda-board-hal = { path = "../boards/hal" }
barracuda-indicator-led = { path = "../boards/drivers/indicator-led" }
barracuda-event-router = { path = "../core/event-router" }
barracuda-platform = { path = "../platforms/api" }
barracuda-system = { path = "../core/system", features = ["tokio"] }
barracuda-target-api = { path = "../composition/api" }
barracuda-tls = { path = "../shared/tls" }
barracuda-vfs = { path = "../shared/vfs" }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-futures.workspace = true
embassy-net.workspace = true
embassy-net-driver-channel.workspace = true
embedded-storage = "0.3"
embedded-hal.workspace = true
embedded-hal-async.workspace = true
gateway = { path = "../plugins/imessage-gateway/crates/gateway" }
heapless = "0.9"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embedded-io-async = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
