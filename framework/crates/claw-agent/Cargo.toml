[package]
name = "claw-agent"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Assembled agent-system API over claw-core runtime and Sessions"

[lib]
name = "claw_agent"
path = "src/lib.rs"

# A minimal REPL that drives the whole agent system against a live LLM with
# on-disk memory. It uses host-target backends, dev workflow dependencies, and
# cache profiling, so both features are required.
[[bin]]
name = "claw-agent-chat"
path = "src/bin/claw-agent-chat.rs"
required-features = ["dev", "cache_profile"]

# The tool/submit reference example uses test doubles plus dev workflow deps.
[[example]]
name = "tool_submit_loop"
required-features = ["dev"]

[[test]]
name = "builtin_tool_matrix"
required-features = ["multiagent"]

[[test]]
name = "nested_subagent_join"
required-features = ["multiagent"]

[[test]]
name = "subagent_lifecycle_matrix"
required-features = ["multiagent"]

[features]
# Concepts:
# - target selection is Cargo/rustc cfg (`target_os = "espidf"` vs host), not a
#   feature. The firmware path reaches ESP-IDF implementations through
#   `claw-cabi` + `claw-sys`.
# - `host-backends` enables host-target concrete implementations for host tools.
# - `dev` is the shared local workflow bundle for examples and host tools.
# - `cache_profile` forwards provider usage support; `claw-agent-chat` requires it.
#
# `claw-agent` is the public feature-selection boundary. It disables
# `claw-core`'s implicit defaults below and forwards every runtime-shape choice,
# so consumers never need to configure an implementation crate directly.
default = ["reasoning_medium"]
stage_verbose = ["claw-core/stage_verbose"]
multiagent = ["claw-core/multiagent"]
host-backends = [
    "claw-interface/host-backends",
]
dev = [
    "host-backends",
    "dep:claw-log",
    "dep:dotenvy",
    "dep:anyhow",
    "dep:tokio",
    "dep:futures-lite",
    "dep:anstyle",
    "dep:rustyline",
]
# Provider token/cache usage diagnostics, kept separate from `dev` so examples
# and other host workflows do not enable it implicitly.
cache_profile = [
    "claw-api/cache_profile",
    "claw-core/cache_profile",
]

# Compile-time byte cap on accumulated reasoning deltas. Exactly one tier must
# be selected; the default preserves the existing 2000-byte cap.
reasoning_short = ["claw-core/reasoning_short"]
reasoning_medium = ["claw-core/reasoning_medium"]
reasoning_long = ["claw-core/reasoning_long"]

# Release-only compile-time tracing ceilings for the complete runtime graph.
# `trace_max_off` removes all statically-levelled span/event instrumentation;
# debug builds remain fully observable for local development.
trace_max_off = ["claw-core/trace_max_off"]
trace_max_error = ["claw-core/trace_max_error"]
trace_max_warn = ["claw-core/trace_max_warn"]
trace_max_info = ["claw-core/trace_max_info"]
trace_max_debug = ["claw-core/trace_max_debug"]
trace_max_trace = ["claw-core/trace_max_trace"]

[dependencies]
claw-core = { path = "../claw-core", default-features = false }
claw-api = { path = "../claw-api" }
claw-persistence = { path = "../claw-persistence" }
claw-tool = { path = "../claw-tool" }
# Conversation/long-term memory. The compaction policy is wired internally
# (the LLM-backed `LlmCompactor`), so no stub-compactor feature is needed.
claw-memory = { path = "../claw-memory" }
# The DI trait surface (`ClawFs` / `ClawHttp`) is always available; concrete
# host-target backends are pulled in only by `host-backends`/`dev`, so the device
# build (via claw-cabi) stays free of reqwest/std-thread.
claw-interface = { path = "../claw-interface" }
claw-log = { path = "../claw-log", optional = true }
thiserror = "2"
# Dev-only: ergonomic errors for the `claw-agent-chat` bin and the examples.
anyhow = { version = "1", optional = true }
# Dev-only: the `claw-agent-chat` bin loads `claw-core/.env.local`.
dotenvy = { version = "0.15", optional = true }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"], optional = true }
# Dev-only: `StreamExt` to drain the session event stream in the REPL/examples.
futures-lite = { version = "2", optional = true }
# Dev-only: colored, aligned event labels for the `claw-agent-chat` REPL.
anstyle = { version = "1", optional = true }
# Dev-only: editable input, history, and inline slash-command hints.
rustyline = { version = "18.0.1", default-features = false, optional = true }

[dev-dependencies]
claw-context = { path = "../claw-context" }
claw-log = { path = "../claw-log" }
# In-memory fs + scripted HTTP doubles so the end-to-end tests run hermetically
# (no network, no API key) entirely through the public API; `stdthread` is the
# host-target executor backend used by agent tests.
claw-interface = { path = "../claw-interface", features = [
    "test-doubles",
    "diskfs",
    "stdthread",
    "tokioexecutor",
] }
claw-utils = { path = "../claw-utils" }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"
tempdir = "0.3"
