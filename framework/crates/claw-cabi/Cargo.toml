[package]
name = "claw-cabi"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "C adapter boundary for the Rust agent runtime"

[lib]
name = "claw_cabi"
crate-type = ["staticlib", "rlib"]

[features]
# This feature changes the C event ABI itself, so both crates must see it.
cache_profile = ["claw-agent/cache_profile"]
# Install structured tracing and compile out duplicate plain-log callsites.
rich_logging = [
    "log/release_max_level_off",
    "tracing/release_max_level_trace",
]
# Install the lightweight logger and compile structured tracing out.
prod_logging = [
    "log/release_max_level_info",
    "tracing/release_max_level_off",
]

[dependencies]

[target.'cfg(target_os = "espidf")'.dependencies]
claw-agent = { path = "../claw-agent", default-features = false }
claw-api = { path = "../claw-api" }
claw-interface = { path = "../claw-interface" }
claw-log = { path = "../claw-log", default-features = false }
claw-sys = { path = "../claw-sys" }
claw-tool = { path = "../claw-tool" }
# The `Stream` trait so `receive` can poll a submission's event stream directly.
futures-core = "0.3"
# `block_on`, `StreamExt`, and `future::or` drive the bounded, timed drain of a
# submission's event stream on the calling FFI thread.
futures-lite = "2"
log = "0.4"
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
