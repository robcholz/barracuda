[package]
name = "claw-cabi"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "C adapter boundary for the Rust agent runtime"

[lib]
name = "claw_cabi"
crate-type = ["staticlib", "rlib"]

[features]
# `claw-cabi` is the firmware build boundary, so it mirrors `claw-agent`'s
# public runtime configuration instead of reaching into implementation crates.
default = ["reasoning_medium"]
stage_verbose = ["claw-agent/stage_verbose"]
cache_profile = ["claw-agent/cache_profile"]

multiagent = ["claw-agent/multiagent"]

reasoning_short = ["claw-agent/reasoning_short"]
reasoning_medium = ["claw-agent/reasoning_medium"]
reasoning_long = ["claw-agent/reasoning_long"]

trace_max_off = ["claw-agent/trace_max_off"]
trace_max_error = ["claw-agent/trace_max_error"]
trace_max_warn = ["claw-agent/trace_max_warn"]
trace_max_info = ["claw-agent/trace_max_info"]
trace_max_debug = ["claw-agent/trace_max_debug"]
trace_max_trace = ["claw-agent/trace_max_trace"]

[dependencies]

[target.'cfg(target_os = "espidf")'.dependencies]
claw-agent = { path = "../claw-agent", default-features = false }
claw-api = { path = "../claw-api" }
claw-interface = { path = "../claw-interface" }
claw-log = { path = "../claw-log" }
claw-sys = { path = "../claw-sys" }
claw-tool = { path = "../claw-tool" }
# The `Stream` trait so `receive` can poll a submission's event stream directly.
futures-core = "0.3"
# `block_on`, `StreamExt`, and `future::or` drive the bounded, timed drain of a
# submission's event stream on the calling FFI thread.
futures-lite = "2"
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
