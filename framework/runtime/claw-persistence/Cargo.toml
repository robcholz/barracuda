[package]
name = "claw-persistence"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Persistence interfaces for durable runtime state"

[lib]
crate-type = ["rlib"]

[dependencies]
claw-interface = { path = "../claw-interface" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
claw-interface = { path = "../claw-interface", features = ["memfs"] }
serde = { version = "1", features = ["derive"] }
