[package]
name = "barracuda-es8311-es7210-audio-codec"
version = "0.1.0"
edition = "2024"
description = "ES8311 output and ES7210 microphone audio-codec implementation"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-es7210.workspace = true
barracuda-driver-es8311.workspace = true
barracuda-driver-m5ioe1.workspace = true
barracuda-driver-m5pm1.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
