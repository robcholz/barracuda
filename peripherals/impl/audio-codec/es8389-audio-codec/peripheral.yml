id: es8389-audio-codec
api-version: 1
peripheral: audio-codec
implementation:
  package: barracuda-es8389-audio-codec
  crate: barracuda_es8389_audio_codec
  factory: "::{{crate}}::Es8389AudioCodecImplementation<{{binding.control.type}}, {{binding.stream.type}}, {{hal.delay.type}}>"
  bindings-expression: "::{{crate}}::Es8389Bindings::new({{binding.control.value}}, {{binding.stream.value}}, {{hal.delay.value}})"
  config-expression: "::{{crate}}::Es8389Config::new({{parameter.address}})"
bindings:
  control:
    kind: i2c-device
  stream:
    kind: i2s-stream
parameters:
  address:
    type: integer
    default: 32
