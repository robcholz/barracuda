[package]
name = "barracuda-pdm-i2s-audio-codec"
version = "0.1.0"
edition = "2024"
description = "Codec-less audio over a PDM microphone and an I2S amplifier"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-axp192.workspace = true
barracuda-driver-axp2101.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
