[package]
name = "barracuda-powerhub-buttons"
version = "0.1.0"
edition = "2024"
description = "M5Stack PowerHub buttons: one on a GPIO, one behind the power co-processor"
license = "AGPL-3.0-only"

[dependencies]
barracuda-board-hal.workspace = true
barracuda-driver-m5powerhub.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true
embassy-time.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
