[package]
name = "barracuda-gc0308-camera"
version = "0.1.0"
edition = "2024"
description = "GC0308 QVGA RGB565 Camera implementation over embedded-hal control bindings, with an optional OV3660 alternate"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-aw9523.workspace = true
barracuda-driver-axp2101.workspace = true
barracuda-driver-gc0308.workspace = true
barracuda-driver-ov3660.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
