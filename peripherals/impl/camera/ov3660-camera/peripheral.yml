id: ov3660-camera
api-version: 1
peripheral: camera
implementation:
  package: barracuda-ov3660-camera
  crate: barracuda_ov3660_camera
  factory: "::{{crate}}::Ov3660CameraImplementation<{{binding.control.type}}, {{binding.capture.type}}, {{binding.reset.type}}, {{binding.power-down.type}}, {{hal.delay.type}}>"
  bindings-expression: "::{{crate}}::Ov3660Bindings::new({{binding.control.value}}, {{binding.capture.value}}, {{binding.reset.value}}, {{binding.power-down.value}}, {{hal.delay.value}})"
  config-expression: "::{{crate}}::Ov3660Config::qvga_jpeg({{parameter.address}})"
bindings:
  control:
    kind: i2c-device
  capture:
    kind: camera-capture
  reset:
    kind: digital-output
    required: false
    initial: high
  power-down:
    kind: digital-output
    required: false
    initial: high
parameters:
  address:
    type: integer
    default: 60
