[package]
name = "barracuda-tab5-sc202cs-camera"
version = "0.1.0"
edition = "2024"
description = "M5Stack Tab5 SC202CS MIPI-CSI camera implementation"
license = "Apache-2.0"

[dependencies]
barracuda-driver-pi4ioe5v6408.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
