[package]
name = "barracuda-aw9523-digital-io"
version = "0.1.0"
edition = "2024"
description = "Fixed-function digital I/O implementation on AW9523B expander pins"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-aw9523.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
