[package]
name = "barracuda-corep4x-dsi-display"
version = "0.1.0"
edition = "2024"
description = "MIPI DSI display implementation for the M5Stack CoreP4X 480x480 ST7102 panel"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-m5ioe1.workspace = true
barracuda-driver-m5pm1.workspace = true
barracuda-driver-st712x.workspace = true
barracuda-peripheral.workspace = true
embedded-graphics-core.workspace = true
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
