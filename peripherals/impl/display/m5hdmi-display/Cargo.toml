[package]
name = "barracuda-m5hdmi-display"
version = "0.1.0"
edition = "2024"
description = "HDMI output of M5Stack's FPGA and LT8618SX video bridge (ATOM Display)"
license = "AGPL-3.0-only"

[dependencies]
barracuda-board-hal.workspace = true
barracuda-driver-lt8618sx.workspace = true
barracuda-driver-m5hdmi.workspace = true
barracuda-peripheral.workspace = true
embedded-graphics-core.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
