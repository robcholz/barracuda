id: mipi-dbi-parallel-display
api-version: 1
peripheral: display
implementation:
  package: barracuda-mipi-dbi-parallel-display
  crate: barracuda_mipi_dbi_parallel_display
  factory: "::{{crate}}::MipiDbiParallelDisplayImplementation<{{binding.bus.type}}, {{parameter.controller}}, {{binding.read.type}}, {{binding.reset.type}}, {{binding.backlight.type}}, {{hal.delay.type}}>"
  bindings-expression: "::{{crate}}::MipiDbiParallelDisplayBindings::new({{binding.bus.value}}, {{binding.read.value}}, {{binding.reset.value}}, {{binding.backlight.value}}, {{hal.delay.value}})"
  config-expression: "::{{crate}}::MipiDbiDriverConfig::new({{parameter.controller}}, ::{{crate}}::MipiDbiDisplayConfig::new(::{{crate}}::Size::new({{parameter.width}}, {{parameter.height}}), ::barracuda_peripheral::display::PixelFormat::Rgb565, {{parameter.orientation}}).with_offset({{parameter.offset-x}}, {{parameter.offset-y}}).with_color_order({{parameter.color-order}}).with_inverted_colors({{parameter.invert-colors}}).with_digital_backlight({{parameter.backlight-active-high}}).with_reset_active_high({{parameter.reset-active-high}}))"
bindings:
  bus:
    kind: parallel-output
  # The panel's read strobe, held inactive.
  read:
    kind: digital-output
    required: false
    initial: high
  reset:
    kind: digital-output
    # A panel without a reset line is reset with the DCS software reset.
    required: false
    initial-from:
      parameter: reset-active-high
      values: { "true": low, "false": high }
  backlight:
    kind: digital-output
    initial-from:
      parameter: backlight-active-high
      values: { "true": low, "false": high }
parameters:
  controller:
    type: enum
    values: [ili9342c, st7789, st7735s, gc9107, gc9a01]
    rust-values:
      ili9342c: "::barracuda_mipi_dbi_parallel_display::ILI9342CRgb565"
      st7789: "::barracuda_mipi_dbi_parallel_display::ST7789"
      st7735s: "::barracuda_mipi_dbi_parallel_display::ST7735s"
      gc9107: "::barracuda_mipi_dbi_parallel_display::GC9107"
      gc9a01: "::barracuda_mipi_dbi_parallel_display::GC9A01"
    required: true
  width:
    type: integer
    required: true
  height:
    type: integer
    required: true
  offset-x:
    type: integer
    default: 0
  offset-y:
    type: integer
    default: 0
  color-order:
    type: enum
    values: [rgb, bgr]
    rust-values:
      rgb: "::barracuda_mipi_dbi_parallel_display::MipiDbiColorOrder::Rgb"
      bgr: "::barracuda_mipi_dbi_parallel_display::MipiDbiColorOrder::Bgr"
    default: bgr
  invert-colors:
    type: boolean
    default: false
  orientation:
    type: enum
    values: [deg0, deg90, deg180, deg270]
    rust-values:
      deg0: "::barracuda_peripheral::display::DisplayOrientation::Deg0"
      deg90: "::barracuda_peripheral::display::DisplayOrientation::Deg90"
      deg180: "::barracuda_peripheral::display::DisplayOrientation::Deg180"
      deg270: "::barracuda_peripheral::display::DisplayOrientation::Deg270"
    default: deg0
  backlight-active-high:
    type: boolean
    default: true
  reset-active-high:
    type: boolean
    default: false
