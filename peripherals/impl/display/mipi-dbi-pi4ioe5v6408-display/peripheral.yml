id: mipi-dbi-pi4ioe5v6408-display
api-version: 1
peripheral: display
implementation:
  package: barracuda-mipi-dbi-pi4ioe5v6408-display
  crate: barracuda_mipi_dbi_pi4ioe5v6408_display
  factory: "::{{crate}}::MipiDbiExpanderDisplayImplementation<{{binding.spi.type}}, {{binding.dc.type}}, {{parameter.controller}}, {{binding.reset.type}}, {{binding.expander.type}}, {{hal.delay.type}}>"
  bindings-expression: "::{{crate}}::MipiDbiExpanderDisplayBindings::new({{binding.spi.value}}, {{binding.dc.value}}, {{binding.reset.value}}, {{binding.expander.value}}, {{hal.delay.value}}, ::{{crate}}::take_transfer_buffer())"
  config-expression: "::{{crate}}::MipiDbiExpanderDisplayConfig::new(::{{crate}}::ExpanderBacklight::new({{parameter.expander-address}}, {{parameter.backlight-pin}}, {{parameter.backlight-active-high}}), {{parameter.controller}}, ::{{crate}}::MipiDbiDisplayConfig::new(::{{crate}}::Size::new({{parameter.width}}, {{parameter.height}}), ::barracuda_peripheral::display::PixelFormat::Rgb565, {{parameter.orientation}}).with_offset({{parameter.offset-x}}, {{parameter.offset-y}}).with_color_order({{parameter.color-order}}).with_inverted_colors({{parameter.invert-colors}}).with_reset_active_high({{parameter.reset-active-high}}))"
bindings:
  spi:
    kind: spi-device
  dc:
    kind: digital-output
    initial: low
  reset:
    kind: digital-output
    # A panel without a reset line is reset with the DCS software reset.
    required: false
    initial-from:
      parameter: reset-active-high
      values: { "true": low, "false": high }
  # The I2C bus of the PI4IOE5V6408 whose output switches the backlight.
  expander:
    kind: i2c-device
parameters:
  controller:
    type: enum
    values: [ili9342c, st7789, st7735s, gc9107, gc9a01]
    rust-values:
      ili9342c: "::barracuda_mipi_dbi_pi4ioe5v6408_display::ILI9342CRgb565"
      st7789: "::barracuda_mipi_dbi_pi4ioe5v6408_display::ST7789"
      st7735s: "::barracuda_mipi_dbi_pi4ioe5v6408_display::ST7735s"
      gc9107: "::barracuda_mipi_dbi_pi4ioe5v6408_display::GC9107"
      gc9a01: "::barracuda_mipi_dbi_pi4ioe5v6408_display::GC9A01"
    required: true
  width:
    type: integer
    required: true
  height:
    type: integer
    required: true
  offset-x:
    type: integer
    default: 0
  offset-y:
    type: integer
    default: 0
  color-order:
    type: enum
    values: [rgb, bgr]
    rust-values:
      rgb: "::barracuda_mipi_dbi_pi4ioe5v6408_display::MipiDbiColorOrder::Rgb"
      bgr: "::barracuda_mipi_dbi_pi4ioe5v6408_display::MipiDbiColorOrder::Bgr"
    default: bgr
  invert-colors:
    type: boolean
    default: false
  orientation:
    type: enum
    values: [deg0, deg90, deg180, deg270]
    rust-values:
      deg0: "::barracuda_peripheral::display::DisplayOrientation::Deg0"
      deg90: "::barracuda_peripheral::display::DisplayOrientation::Deg90"
      deg180: "::barracuda_peripheral::display::DisplayOrientation::Deg180"
      deg270: "::barracuda_peripheral::display::DisplayOrientation::Deg270"
    default: deg0
  reset-active-high:
    type: boolean
    default: false
  expander-address:
    type: integer
    required: true
  backlight-pin:
    type: integer
    required: true
  backlight-active-high:
    type: boolean
    default: true
