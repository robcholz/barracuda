[package]
name = "barracuda-ssd1306-spi-display"
version = "0.1.0"
edition = "2024"
description = "Barracuda display implementation for an SSD1306 monochrome OLED on four-wire SPI"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-ssd1306.workspace = true
barracuda-peripheral.workspace = true
embedded-graphics-core.workspace = true
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
