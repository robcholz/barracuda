[package]
name = "barracuda-stopwatch-co5300-display"
version = "0.1.0"
edition = "2024"
description = "Barracuda display implementation for the M5Stack StopWatch's CO5300 QSPI round AMOLED"
license = "AGPL-3.0-only"

[dependencies]
barracuda-board-hal.workspace = true
barracuda-bulk-memory.workspace = true
barracuda-driver-co5300.workspace = true
barracuda-driver-m5ioe1.workspace = true
barracuda-peripheral.workspace = true
embedded-graphics-core.workspace = true
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
