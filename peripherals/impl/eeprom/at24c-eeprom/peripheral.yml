id: at24c-eeprom
api-version: 1
peripheral: eeprom
implementation:
  package: barracuda-at24c-eeprom
  crate: barracuda_at24c_eeprom
  factory: "::{{crate}}::At24cEepromImplementation<{{binding.i2c.type}}>"
  bindings-expression: "{{binding.i2c.value}}"
  config-expression: "::{{crate}}::At24cEepromConfig::new({{parameter.address}}, {{parameter.density}})"
# A 24Cxx-class I2C serial EEPROM (Microchip AT24C, Fudan FM24C, and
# compatibles) of one of the standard densities.
bindings:
  i2c:
    kind: i2c-device
parameters:
  # The device address with any block bits clear; 50h with A2..A0 low.
  address:
    type: integer
    default: 80
  density:
    type: enum
    values: [24c01, 24c02, 24c04, 24c08, 24c16, 24c32, 24c64, 24c128, 24c256, 24c512]
    rust-values:
      24c01: "::barracuda_at24c_eeprom::Variant::C01"
      24c02: "::barracuda_at24c_eeprom::Variant::C02"
      24c04: "::barracuda_at24c_eeprom::Variant::C04"
      24c08: "::barracuda_at24c_eeprom::Variant::C08"
      24c16: "::barracuda_at24c_eeprom::Variant::C16"
      24c32: "::barracuda_at24c_eeprom::Variant::C32"
      24c64: "::barracuda_at24c_eeprom::Variant::C64"
      24c128: "::barracuda_at24c_eeprom::Variant::C128"
      24c256: "::barracuda_at24c_eeprom::Variant::C256"
      24c512: "::barracuda_at24c_eeprom::Variant::C512"
    required: true
