id: ltr553-environment-sensor
api-version: 1
peripheral: environment-sensor
implementation:
  package: barracuda-ltr553-environment-sensor
  crate: barracuda_ltr553_environment_sensor
  factory: "::{{crate}}::Ltr553EnvironmentSensorImplementation<{{binding.i2c.type}}, {{hal.delay.type}}>"
  bindings-expression: "::{{crate}}::Ltr553Bindings::new({{binding.i2c.value}}, {{hal.delay.value}})"
  config-expression: "::{{crate}}::Ltr553Config::new({{parameter.address}}, {{parameter.power-layout}})"
# A Lite-On LTR-553ALS: ambient illuminance and proximity.
bindings:
  i2c:
    kind: i2c-device
parameters:
  address:
    type: integer
    # The chip's fixed address 23h.
    default: 35
  # Which helper chip supplies the sensor:
  # - none: the sensor runs from an always-on rail.
  # - cores3: M5Stack CoreS3 and StackChan, where the sensor sits on the
  #   camera board. The implementation sets AXP2101 (34h) ALDO3 to 3.3 V and
  #   switches it on first, as M5Unified `Power_Class::begin` does ("for
  #   camera") before M5Stack's LTR-553 examples run.
  power-layout:
    type: enum
    values: [none, cores3]
    rust-values:
      none: "::barracuda_ltr553_environment_sensor::PowerLayout::None"
      cores3: "::barracuda_ltr553_environment_sensor::PowerLayout::CoreS3"
    default: none
