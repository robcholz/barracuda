[package]
name = "barracuda-sht3x-environment-sensor"
version = "0.1.0"
edition = "2024"
description = "SHT30/SHT31/SHT35 temperature and humidity environment sensor over embedded-hal I2C"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-sht3x.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
