[package]
name = "barracuda-mpu6886-imu"
version = "0.1.0"
edition = "2024"
description = "MPU6886, MPU9250, and MPU6050 six-axis IMU implementation over embedded-hal I2C"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-mpu6886.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
