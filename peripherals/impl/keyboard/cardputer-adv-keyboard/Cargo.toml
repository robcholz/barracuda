[package]
name = "barracuda-cardputer-adv-keyboard"
version = "0.1.0"
edition = "2024"
description = "Barracuda keyboard implementation for the M5Stack Cardputer-ADV's TCA8418 keypad controller"
license = "AGPL-3.0-only"

[dependencies]
barracuda-cardputer-keyboard.workspace = true
barracuda-driver-tca8418.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
