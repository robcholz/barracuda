[package]
name = "barracuda-powerhub-led-strip"
version = "0.1.0"
edition = "2024"
description = "M5Stack PowerHub LEDs driven by its power co-processor"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-m5powerhub.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
