[package]
name = "barracuda-rmt-led-strip"
version = "0.1.0"
edition = "2024"
description = "WS2812 and SK6812 LED-strip implementation over a pulse-train output"
license = "AGPL-3.0-only"

[dependencies]
barracuda-board-hal.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
