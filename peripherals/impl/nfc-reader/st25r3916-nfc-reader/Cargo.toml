[package]
name = "barracuda-st25r3916-nfc-reader"
version = "0.1.0"
edition = "2024"
description = "NFC card-reader implementation for an ST25R3916 on I2C"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-iso14443a.workspace = true
barracuda-driver-m5ioe1.workspace = true
barracuda-driver-st25r3916.workspace = true
barracuda-peripheral.workspace = true
embassy-time.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
