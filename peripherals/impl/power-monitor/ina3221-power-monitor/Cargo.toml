[package]
name = "barracuda-ina3221-power-monitor"
version = "0.1.0"
edition = "2024"
description = "One INA3221 channel as a voltage and current monitor over embedded-hal I2C"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-ina3221.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
