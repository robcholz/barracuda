[package]
name = "barracuda-m5pm1-power-monitor"
version = "0.1.0"
edition = "2024"
description = "Battery power-monitor implementation for the M5Stack M5PM1"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-m5pm1.workspace = true
barracuda-peripheral.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
