[package]
name = "barracuda-sdmmc-storage"
version = "0.1.0"
edition = "2024"
description = "Barracuda removable-storage implementation for an SDMMC byte device"
license = "Apache-2.0"

[dependencies]
barracuda-peripheral.workspace = true
embedded-io = "0.7"
embedded-io-async = "0.7"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
