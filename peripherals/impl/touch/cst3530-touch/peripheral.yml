id: cst3530-touch
api-version: 1
peripheral: touch
implementation:
  package: barracuda-cst3530-touch
  crate: barracuda_cst3530_touch
  factory: "::{{crate}}::Cst3530TouchImplementation<{{binding.i2c.type}}, {{hal.delay.type}}>"
  bindings-expression: "::{{crate}}::Cst3530Bindings::new({{binding.i2c.value}}, {{hal.delay.value}})"
  config-expression: "::{{crate}}::Cst3530Config::new({{parameter.address}}, {{parameter.width}}, {{parameter.height}})"
bindings:
  i2c:
    kind: i2c-device
parameters:
  address:
    type: integer
    default: 88
  # The span the controller reports.
  width:
    type: integer
    required: true
  height:
    type: integer
    required: true
