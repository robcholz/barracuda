[package]
name = "barracuda-axp192-axp2101-vibration"
version = "0.1.0"
edition = "2024"
description = "Vibration-motor implementation on an AXP192 or AXP2101 PMIC regulator"
license = "AGPL-3.0-only"

[dependencies]
barracuda-driver-axp192.workspace = true
barracuda-driver-axp2101.workspace = true
barracuda-peripheral.workspace = true
embassy-time.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
