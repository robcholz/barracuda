[package]
name = "barracuda-platform"
version = "0.1.0"
edition = "2021"
description = "Zero-cost platform initialization contract for Barracuda"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-board = { path = "../../boards/api" }
barracuda-fs = { path = "../../shared/fs" }
embassy-executor.workspace = true
embedded-storage-async.workspace = true

[dev-dependencies]
barracuda-platform-test = { path = "../test" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
