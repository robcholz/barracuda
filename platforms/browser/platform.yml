name: browser
package: barracuda-platform-browser
crate: barracuda_platform_browser
type: BrowserPlatform
selection:
  board-chips:
    - browser
  targets:
    - triple: wasm32-unknown-unknown
system-image:
  layout:
    driver: file-regions
  flash:
    driver: file
    state-directory: .barracuda/browser
    flash-image: board.flash
application: {}
