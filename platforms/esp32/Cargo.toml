[package]
name = "barracuda-platform-esp32"
version = "0.1.0"
edition = "2021"
description = "ESP32-native Board storage integration for Barracuda"

[features]
default = []
esp32c6 = [
    "dep:embassy-embedded-hal",
    "dep:embassy-sync",
    "dep:embedded-storage-async",
    "dep:esp-hal",
    "dep:esp-storage",
    "esp-hal/critical-section",
    "esp-hal/esp32c6",
    "esp-storage/esp32c6",
]

[dependencies]

[target.'cfg(target_arch = "riscv32")'.dependencies]
embassy-embedded-hal = { version = "0.6.0", optional = true }
embassy-sync = { version = "0.8.0", default-features = false, optional = true }
embedded-storage-async = { workspace = true, optional = true }
esp-hal = { version = "1.1.0", default-features = false, optional = true }
esp-storage = { version = "0.9.0", default-features = false, optional = true }

[build-dependencies]
barracuda-board-config = { path = "../../boards/config" }
esp-idf-part = "0.6.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
