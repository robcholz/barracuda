[package]
name = "barracuda-platform-esp32"
version = "0.1.0"
edition = "2021"
description = "ESP32 Platform implementation for Barracuda"

[dependencies]
barracuda-board.workspace = true
barracuda-platform.workspace = true
log.workspace = true

[target.'cfg(target_arch = "xtensa")'.dependencies]
barracuda-tls = { workspace = true, features = ["mbedtls"] }
embassy-executor.workspace = true
embassy-embedded-hal = "0.6.0"
embassy-net.workspace = true
embassy-sync = { version = "0.8.0", default-features = false }
esp-hal = { version = "1.2.0-rc.0", default-features = false, features = ["critical-section", "esp32"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32", "uart", "log-04"] }
esp-storage = { version = "0.10.0", default-features = false, features = ["esp32", "embedded-storage"] }

[build-dependencies]
barracuda-board-config.workspace = true
esp-idf-part = "0.6.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
