name: esp32
info:
  family: esp
  environment: bare-metal
# Long-lived connections (receive loops) beside the shared request pool. An
# idle TLS client session holds about 35 KiB of the 112 KiB heap (39 KiB at
# the handshake; shared/tls/tests/session_memory.rs), so one fits beside the
# model connection. This Platform does not install external memory as bulk
# memory, so a Board's PSRAM does not change the figure.
network:
  long-lived-connections:
    internal-memory: 1
    external-memory: 1
package: barracuda-platform-esp32
crate: barracuda_platform_esp32
type: Esp32Platform
build:
  rustup-toolchain: esp
  build-std: [core, alloc]
  environment-file: ~/export-esp.sh
  missing-toolchain-prompt: |
    The Espressif Rust toolchain is required. Install it with:
      cargo install espup
      espup install --toolchain-version 1.98.1.0
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, spi-output, i2c-device]
  runtime-i2c-controllers: [I2C0, I2C1]
  runtime-spi-controllers: [SPI2, SPI3]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH4, pin: GPIO32 }
        - { channel: ADC1_CH5, pin: GPIO33 }
        - { channel: ADC1_CH6, pin: GPIO34 }
        - { channel: ADC1_CH7, pin: GPIO35 }
        - { channel: ADC1_CH0, pin: GPIO36 }
        - { channel: ADC1_CH1, pin: GPIO37 }
        - { channel: ADC1_CH2, pin: GPIO38 }
        - { channel: ADC1_CH3, pin: GPIO39 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
selection:
  board-chips:
    - esp32
  targets:
    - triple: xtensa-esp32-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
