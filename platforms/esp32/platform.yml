name: esp32
package: barracuda-platform-esp32
crate: barracuda_platform_esp32
type: Esp32Platform
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, spi-output, i2c-device]
  runtime-i2c-controllers: [I2C0, I2C1]
  runtime-spi-controllers: [SPI2, SPI3]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH4, pin: GPIO32 }
        - { channel: ADC1_CH5, pin: GPIO33 }
        - { channel: ADC1_CH6, pin: GPIO34 }
        - { channel: ADC1_CH7, pin: GPIO35 }
        - { channel: ADC1_CH0, pin: GPIO36 }
        - { channel: ADC1_CH1, pin: GPIO37 }
        - { channel: ADC1_CH2, pin: GPIO38 }
        - { channel: ADC1_CH3, pin: GPIO39 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
selection:
  board-chips:
    - esp32
  targets:
    - triple: xtensa-esp32-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
