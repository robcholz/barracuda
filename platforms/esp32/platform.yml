name: esp32
info:
  family: esp
  environment: bare-metal
package: barracuda-platform-esp32
crate: barracuda_platform_esp32
type: Esp32Platform
build:
  rustup-toolchain: esp
  # The same `esp` release as ESP32-S3, which no longer links its release build on 1.99.0.0.
  rustup-toolchain-version: 1.98.1.0
  build-std: [core, alloc]
  environment-file: ~/export-esp.sh
  missing-toolchain-prompt: |
    The Espressif Rust toolchain is required. Install it with:
      cargo install espup
      espup install --toolchain-version 1.98.1.0
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, spi-output, i2c-device, sdmmc-device, i2s-stream, pdm-i2s-stream, analog-input, pulse-counter, power-hold]
  runtime-i2c-controllers: [I2C0, I2C1]
  runtime-spi-controllers: [SPI2, SPI3]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH4, pin: GPIO32 }
        - { channel: ADC1_CH5, pin: GPIO33 }
        - { channel: ADC1_CH6, pin: GPIO34 }
        - { channel: ADC1_CH7, pin: GPIO35 }
        - { channel: ADC1_CH0, pin: GPIO36 }
        - { channel: ADC1_CH1, pin: GPIO37 }
        - { channel: ADC1_CH2, pin: GPIO38 }
        - { channel: ADC1_CH3, pin: GPIO39 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
  # A Board's microSD card takes slot 1 of the SD host, on its fixed IO_MUX
  # pins (CLK GPIO14, CMD GPIO15, D0 GPIO2); slot 0 is wired to the module's
  # flash. The slot runs from the Board's own 3.3 V.
  sdmmc-slots:
    - slot: 1
selection:
  board-chips:
    - esp32
  targets:
    - triple: xtensa-esp32-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
  # The bootloader, partition table and app merged from 0x0. Its padding
  # erases otadata, so a device that had switched to ota_1 boots ota_0 again,
  # and it ends before kv_database, which keeps the device's settings.
  release:
    driver: command
    program: espflash
    arguments: [save-image, --chip, "{chip}", --merge, --skip-padding, --flash-size, "{flash-size}", --partition-table, "{layout}", --target-app-partition, ota_0, "{application}", "{output}"]
    offset: 0
