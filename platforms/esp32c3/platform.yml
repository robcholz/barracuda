name: esp32c3
package: barracuda-platform-esp32c3
crate: barracuda_platform_esp32c3
type: Esp32C3Platform
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, i2c-device]
  runtime-i2c-controllers: [I2C0]
  runtime-spi-controllers: [SPI2]
  runtime-uart-controllers: [UART1]
selection:
  board-chips:
    - esp32c3
  targets:
    - triple: riscv32imc-unknown-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
