name: esp32c3
info:
  family: esp
  environment: bare-metal
package: barracuda-platform-esp32c3
crate: barracuda_platform_esp32c3
type: Esp32C3Platform
build:
  rustup-toolchain: "1.98.1"
  environment-file: ~/export-esp.sh
  missing-toolchain-prompt: |
    Rust 1.98.1 and Espressif's riscv32-esp-elf GCC are required.
    Install them with:
      rustup toolchain install 1.98.1
      cargo install espup
      espup install --stable-version 1.98.1 --targets esp32c3 --esp-riscv-gcc
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, spi-output, i2c-device]
  runtime-i2c-controllers: [I2C0]
  runtime-spi-controllers: [SPI2]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH0, pin: GPIO0 }
        - { channel: ADC1_CH1, pin: GPIO1 }
        - { channel: ADC1_CH2, pin: GPIO2 }
        - { channel: ADC1_CH3, pin: GPIO3 }
        - { channel: ADC1_CH4, pin: GPIO4 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
selection:
  board-chips:
    - esp32c3
  targets:
    - triple: riscv32imc-unknown-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
