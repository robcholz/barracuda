[package]
name = "barracuda-platform-esp32c5"
version = "0.1.0"
edition = "2021"
description = "ESP32-C5 Platform implementation for Barracuda"

[dependencies]
barracuda-board = { path = "../../boards/api" }
barracuda-platform = { path = "../api" }
log.workspace = true

[target.'cfg(target_arch = "riscv32")'.dependencies]
barracuda-tls = { path = "../../shared/tls", features = ["pem"] }
embassy-executor.workspace = true
embassy-embedded-hal = "0.6.0"
embassy-net.workspace = true
embassy-sync = { version = "0.8.0", default-features = false }
esp-hal = { version = "1.2.0-rc.0", default-features = false, features = ["critical-section", "esp32c5", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32c5", "uart", "log-04"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b06b604a419de88ae9105282f5d04b9e72b21985", default-features = false, features = ["esp-alloc", "esp32c5", "log-04", "unstable", "wifi"] }
esp-rtos = { version = "0.4.0", default-features = false, features = ["embassy", "esp-alloc", "esp-radio", "esp32c5", "log-04"] }
esp-storage = { version = "0.10.0", default-features = false, features = ["esp32c5", "embedded-storage"] }
rand_core = "0.10.1"
static_cell = "2.1.1"

[build-dependencies]
barracuda-board-config = { path = "../../boards/config" }
esp-idf-part = "0.6.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
