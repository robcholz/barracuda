[package]
name = "barracuda-platform-esp32c6"
version = "0.1.0"
edition = "2021"
description = "ESP32-C6 Platform implementation for Barracuda"

[dependencies]
barracuda-board = { path = "../../boards/api" }
barracuda-platform = { path = "../api" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
embassy-executor.workspace = true
embassy-embedded-hal = "0.6.0"
embassy-net.workspace = true
embassy-sync = { version = "0.8.0", default-features = false }
esp-hal = { version = "1.1.0", default-features = false, features = ["critical-section", "esp32c6"] }
esp-storage = { version = "0.9.0", default-features = false, features = ["esp32c6"] }

[build-dependencies]
barracuda-board-config = { path = "../../boards/config" }
esp-idf-part = "0.6.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
