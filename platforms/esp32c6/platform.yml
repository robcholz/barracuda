name: esp32c6
info:
  family: esp
  environment: bare-metal
# Long-lived connections (receive loops) beside the shared request pool. An
# idle TLS client session holds about 35 KiB of the 128 KiB heap (39 KiB at
# the handshake; shared/tls/tests/session_memory.rs), so one fits beside the
# model connection. The chip has no external memory.
network:
  long-lived-connections:
    internal-memory: 1
    external-memory: 1
package: barracuda-platform-esp32c6
crate: barracuda_platform_esp32c6
type: Esp32c6Platform
build:
  rustup-toolchain: "1.98.1"
  environment-file: ~/export-esp.sh
  missing-toolchain-prompt: |
    Rust 1.98.1 and Espressif's riscv32-esp-elf GCC are required.
    Install them with:
      rustup toolchain install 1.98.1
      cargo install espup
      espup install --stable-version 1.98.1 --targets esp32c6 --esp-riscv-gcc
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, spi-output, i2c-device]
  runtime-i2c-controllers: [I2C0]
  runtime-spi-controllers: [SPI2]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH0, pin: GPIO0 }
        - { channel: ADC1_CH1, pin: GPIO1 }
        - { channel: ADC1_CH2, pin: GPIO2 }
        - { channel: ADC1_CH3, pin: GPIO3 }
        - { channel: ADC1_CH4, pin: GPIO4 }
        - { channel: ADC1_CH5, pin: GPIO5 }
        - { channel: ADC1_CH6, pin: GPIO6 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
selection:
  board-chips:
    - esp32c6
  targets:
    - triple: riscv32imac-unknown-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
