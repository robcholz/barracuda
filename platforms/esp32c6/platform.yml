name: esp32c6
package: barracuda-platform-esp32c6
crate: barracuda_platform_esp32c6
type: Esp32c6Platform
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, i2c-device]
  runtime-i2c-controllers: [I2C0]
  runtime-spi-controllers: [SPI2]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH0, pin: GPIO0 }
        - { channel: ADC1_CH1, pin: GPIO1 }
        - { channel: ADC1_CH2, pin: GPIO2 }
        - { channel: ADC1_CH3, pin: GPIO3 }
        - { channel: ADC1_CH4, pin: GPIO4 }
        - { channel: ADC1_CH5, pin: GPIO5 }
        - { channel: ADC1_CH6, pin: GPIO6 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
selection:
  board-chips:
    - esp32c6
  targets:
    - triple: riscv32imac-unknown-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
