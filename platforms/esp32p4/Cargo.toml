[package]
name = "barracuda-platform-esp32p4"
version = "0.1.0"
edition = "2021"
description = "ESP32-P4 Platform implementation for Barracuda"

[features]
default = []
runtime-i2s = []
runtime-pwm = []

[dependencies]
barracuda-board.workspace = true
barracuda-bulk-memory.workspace = true
barracuda-platform.workspace = true
log.workspace = true

[target.'cfg(target_arch = "riscv32")'.dependencies]
barracuda-board-hal.workspace = true
barracuda-tls = { workspace = true, features = ["force-esp-riscv-gcc"] }
embassy-executor.workspace = true
embassy-embedded-hal = "0.6.0"
embassy-net = { workspace = true, features = ["dhcpv4"] }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time.workspace = true
embedded-hal.workspace = true
embedded-hal-bus.workspace = true
embedded-hal-async = "1.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
esp-alloc = { version = "0.11.0", features = ["esp32p4"] }
esp-backtrace = { version = "0.20.0", features = ["esp32p4", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32p4"] }
esp-hal = { version = "1.2.0", default-features = false, features = ["critical-section", "esp32p4", "exception-handler", "rt", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32p4", "jtag-serial", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp32p4"] }
esp-storage = { version = "0.10.0", default-features = false, features = ["esp32p4", "embedded-storage"] }
static_cell.workspace = true
nb = "1"

[build-dependencies]
barracuda-board-config.workspace = true
esp-idf-part = "0.6.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
