[package]
name = "barracuda-platform-esp32p4"
version = "0.1.0"
edition = "2021"
description = "ESP32-P4 Platform implementation for Barracuda"

[dependencies]
barracuda-board.workspace = true
barracuda-platform.workspace = true
log.workspace = true

[target.'cfg(target_arch = "riscv32")'.dependencies]
barracuda-board-hal.workspace = true
barracuda-tls.workspace = true
embassy-executor.workspace = true
embassy-embedded-hal = "0.6.0"
embassy-net.workspace = true
embassy-sync = { version = "0.8.0", default-features = false }
embedded-hal.workspace = true
embedded-hal-bus.workspace = true
esp-hal = { version = "1.2.0-rc.0", default-features = false, features = ["critical-section", "esp32p4"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32p4", "jtag-serial", "log-04"] }
esp-storage = { version = "0.10.0", default-features = false, features = ["esp32p4", "embedded-storage"] }

[build-dependencies]
barracuda-board-config.workspace = true
esp-idf-part = "0.6.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
