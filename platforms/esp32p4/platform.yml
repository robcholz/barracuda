name: esp32p4
info:
  family: esp
  environment: bare-metal
package: barracuda-platform-esp32p4
crate: barracuda_platform_esp32p4
type: Esp32P4Platform
build:
  rustup-toolchain: esp
  build-std: [core, alloc]
  environment-file: ~/export-esp.sh
  missing-toolchain-prompt: |
    Espressif's esp Rust toolchain and riscv32-esp-elf GCC are required.
    espup installs the esp toolchain beside an Xtensa target. Install them with:
      cargo install espup
      espup install --toolchain-version 1.98.1.0 --targets esp32s3,esp32p4 --esp-riscv-gcc
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, spi-bus, spi-output, i2c-device, i2s-stream, dsi-host, ethernet-rmii, wifi-coprocessor-sdio, power-hold]
  runtime-i2c-controllers: [I2C0, I2C1]
  runtime-spi-controllers: [SPI2, SPI3]
  runtime-uart-controllers: [UART1]
  # No runtime ADC: the entropy source keeps SAR ADC1 sampling its noise
  # channel under the digital controller, and esp-hal's ADC driver would
  # reset the shared SAR ADC block and take its clock away when dropped.
selection:
  board-chips:
    - esp32p4
  targets:
    - triple: riscv32imafc-unknown-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
  # The bootloader, partition table and app merged from 0x0. Its padding
  # erases otadata, so a device that had switched to ota_1 boots ota_0 again,
  # and it ends before kv_database, which keeps the device's settings.
  release:
    driver: command
    program: espflash
    arguments: [save-image, --chip, "{chip}", --merge, --skip-padding, --flash-size, "{flash-size}", --partition-table, "{layout}", --target-app-partition, ota_0, "{application}", "{output}"]
    offset: 0
