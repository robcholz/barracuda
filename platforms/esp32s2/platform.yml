name: esp32s2
package: barracuda-platform-esp32s2
crate: barracuda_platform_esp32s2
type: Esp32S2Platform
selection:
  board-chips:
    - esp32s2
  targets:
    - triple: xtensa-esp32s2-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
