[package]
name = "barracuda-platform-esp32s3"
version = "0.1.0"
edition = "2021"
description = "ESP32-S3 Platform implementation for Barracuda"

[features]
default = ["runtime-i2s", "runtime-pwm"]
runtime-i2s = []
runtime-pwm = []

[dependencies]
barracuda-board.workspace = true
barracuda-platform.workspace = true
log.workspace = true

[target.'cfg(target_arch = "xtensa")'.dependencies]
barracuda-board-hal.workspace = true
barracuda-bulk-memory.workspace = true
barracuda-peripheral.workspace = true
barracuda-tls.workspace = true
embassy-executor.workspace = true
embassy-embedded-hal = "0.6.0"
embassy-net.workspace = true
embassy-net-driver = "0.2.0"
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time.workspace = true
embedded-hal.workspace = true
embedded-hal-bus.workspace = true
embedded-hal-async = "1.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.0-rc.0", default-features = false, features = ["critical-section", "esp32s3", "exception-handler", "rt", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3"] }
esp-storage = { version = "0.10.0", default-features = false, features = ["esp32s3", "embedded-storage"] }
sdio = "0.5.1"
static_cell.workspace = true
nb = "1"

[build-dependencies]
barracuda-board-config.workspace = true
esp-idf-part = "0.6.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
