name: esp32s3
info:
  family: esp
  environment: bare-metal
# Long-lived connections (receive loops) beside the shared request pool. An
# idle TLS client session holds about 14 KiB of internal heap plus 21 KiB of
# record buffers (shared/tls/tests/session_memory.rs, a host upper bound).
# Without external memory both come from the 128 KiB heap, so one fits beside
# the model connection; with PSRAM the buffers move out and the station
# stack's free sockets (16, about 11 in use) bound it at three.
network:
  long-lived-connections:
    internal-memory: 1
    external-memory: 3
package: barracuda-platform-esp32s3
crate: barracuda_platform_esp32s3
type: Esp32S3Platform
build:
  rustup-toolchain: esp
  build-std: [core, alloc]
  environment-file: ~/export-esp.sh
  missing-toolchain-prompt: |
    The Espressif Rust toolchain is required. Install it with:
      cargo install espup
      espup install --toolchain-version 1.98.1.0
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, quad-spi-device, spi-bus, spi-output, i2c-device, sdmmc-device, camera-capture, i2s-stream, capacitive-touch]
  runtime-i2c-controllers: [I2C0, I2C1]
  runtime-spi-controllers: [SPI2, SPI3]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH0, pin: GPIO1 }
        - { channel: ADC1_CH1, pin: GPIO2 }
        - { channel: ADC1_CH2, pin: GPIO3 }
        - { channel: ADC1_CH3, pin: GPIO4 }
        - { channel: ADC1_CH4, pin: GPIO5 }
        - { channel: ADC1_CH5, pin: GPIO6 }
        - { channel: ADC1_CH6, pin: GPIO7 }
        - { channel: ADC1_CH7, pin: GPIO8 }
        - { channel: ADC1_CH8, pin: GPIO9 }
        - { channel: ADC1_CH9, pin: GPIO10 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
  runtime-i2s-controllers:
    - controller: I2S0
      dma-channels: [DMA_CH0]
      dma-buffer-bytes: 4096
selection:
  board-chips:
    - esp32s3
  targets:
    - triple: xtensa-esp32s3-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
