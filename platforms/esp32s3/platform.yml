name: esp32s3
info:
  family: esp
  environment: bare-metal
package: barracuda-platform-esp32s3
crate: barracuda_platform_esp32s3
type: Esp32S3Platform
build:
  rustup-toolchain: esp
  # esp 1.99.0.0 places esp-hal's ESP32-S3 `__pre_init` literal pool after its IRAM
  # code (it reorders esp-hal's split `global_asm!` blocks), so release builds no longer link.
  rustup-toolchain-version: 1.98.1.0
  build-std: [core, alloc]
  environment-file: ~/export-esp.sh
  missing-toolchain-prompt: |
    The Espressif Rust toolchain is required. Install it with:
      cargo install espup
      espup install --toolchain-version 1.98.1.0
hal:
  bindings: [digital-input, digital-output, gpio, spi-device, quad-spi-device, spi-bus, spi-output, i2c-device, sdmmc-device, camera-capture, parallel-output, i2s-stream, capacitive-touch, power-hold]
  runtime-i2c-controllers: [I2C0, I2C1]
  runtime-spi-controllers: [SPI2, SPI3]
  runtime-uart-controllers: [UART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH0, pin: GPIO1 }
        - { channel: ADC1_CH1, pin: GPIO2 }
        - { channel: ADC1_CH2, pin: GPIO3 }
        - { channel: ADC1_CH3, pin: GPIO4 }
        - { channel: ADC1_CH4, pin: GPIO5 }
        - { channel: ADC1_CH5, pin: GPIO6 }
        - { channel: ADC1_CH6, pin: GPIO7 }
        - { channel: ADC1_CH7, pin: GPIO8 }
        - { channel: ADC1_CH8, pin: GPIO9 }
        - { channel: ADC1_CH9, pin: GPIO10 }
  runtime-pwm-controllers:
    - controller: LEDC
      timers: [Timer0]
      channels: [Channel0]
  runtime-i2s-controllers:
    - controller: I2S0
      dma-channels: [DMA_CH0]
      dma-buffer-bytes: 4096
  # A Board's microSD card takes slot 0 of the SD host; both ESP32-S3 slots
  # reach any pin through the GPIO matrix and run from the Board's own 3.3 V.
  sdmmc-slots:
    - slot: 0
selection:
  board-chips:
    - esp32s3
  targets:
    - triple: xtensa-esp32s3-none-elf
system-image:
  layout:
    driver: esp-idf-partitions
  flash:
    driver: command
    program: espflash
    arguments: [write-bin, --chip, "{chip}", "{offset}", "{image}"]
application:
  launcher:
    program: espflash
    arguments: [flash, --monitor, "{application}"]
  # The bootloader, partition table and app merged from 0x0. Its padding
  # erases otadata, so a device that had switched to ota_1 boots ota_0 again,
  # and it ends before kv_database, which keeps the device's settings.
  release:
    driver: command
    program: espflash
    arguments: [save-image, --chip, "{chip}", --merge, --skip-padding, --flash-size, "{flash-size}", --partition-table, "{layout}", --target-app-partition, ota_0, "{application}", "{output}"]
    offset: 0
