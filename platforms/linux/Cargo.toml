[package]
name = "barracuda-platform-linux"
version = "0.1.0"
edition = "2021"
description = "Linux Platform implementation for Barracuda"

[features]
default = []
testing = ["embassy-executor/arch-std", "embassy-executor/executor-thread"]

[dependencies]
barracuda-board = { path = "../../boards/api" }
barracuda-platform = { path = "../api" }
embassy-embedded-hal = "0.5.0"
embassy-executor.workspace = true
embassy-net.workspace = true
embassy-net-driver-channel.workspace = true
embassy-sync.workspace = true
embedded-storage = "0.3"
heapless = "0.9"
rand = "0.9"
thiserror = "2"
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "rt-multi-thread"] }
tun = { version = "0.7.13", features = ["async"] }

[dev-dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }

[build-dependencies]
barracuda-board-config = { path = "../../boards/config" }
serde = { version = "1", features = ["derive"] }
yaml-peg = { version = "1.0.8", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
