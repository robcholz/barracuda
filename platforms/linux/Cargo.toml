[package]
name = "barracuda-platform-linux"
version = "0.1.0"
edition = "2021"
description = "Linux Platform implementation for Barracuda"

[dependencies]
barracuda-board.workspace = true
barracuda-bulk-memory.workspace = true
barracuda-platform.workspace = true
critical-section = { version = "1", features = ["std"] }
embassy-embedded-hal = "0.5.0"
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-net.workspace = true
embassy-net-driver-channel.workspace = true
embassy-sync.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embedded-storage = "0.3"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
heapless = "0.9"
log.workspace = true
rand = "0.9"
getrandom = "0.4"
thiserror = "2"
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "rt-multi-thread"] }
tun = { version = "0.7.13", features = ["async"] }
cap = { version = "0.1", features = ["stats"] }
allocator-api2 = { version = "0.3.1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }

[build-dependencies]
barracuda-board-config.workspace = true
serde = { version = "1", features = ["derive"] }
yaml-peg = { version = "1.0.8", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
