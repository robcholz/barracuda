name: linux
info:
  family: linux
  environment: hosted
package: barracuda-platform-linux
crate: barracuda_platform_linux
type: LinuxPlatform
build:
  rustup-toolchain: "1.98.1"
  missing-toolchain-prompt: |
    Rust 1.98.1 is required. Install it with:
      rustup toolchain install 1.98.1
hal:
  # Virtual hardware from platforms/virtual-io: pins GPIO0..GPIO23, the I2C
  # controllers below, and SPI controllers SPI0 and SPI1, controlled through
  # BARRACUDA_VIRTUAL_IO_ADDR.
  bindings: [digital-input, digital-output, gpio, spi-device, quad-spi-device, i2c-device]
  runtime-i2c-controllers: [I2C0, I2C1, I2C2]
  # Every Board-declared peripheral gets its chip's virtual device model.
  peripheral-models: true
selection:
  board-chips:
    - linux
  targets:
    - os: linux
system-image:
  layout:
    driver: file-regions
  flash:
    driver: file
    state-directory: .barracuda
    flash-image: board.flash
settings:
  state-directory: .barracuda
  flash-image: board.flash
  network-interface: barracuda0
