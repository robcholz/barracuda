name: macos
package: barracuda-platform-macos
crate: barracuda_platform_macos
type: MacosPlatform
selection:
  board-chips:
    - macos
  targets:
    - os: macos
system-image:
  layout:
    driver: file-regions
  flash:
    driver: file
    state-directory: .barracuda
    flash-image: board.flash
settings:
  state-directory: .barracuda
  flash-image: board.flash
  network-gateway: ws://127.0.0.1:8787/v1/connect
