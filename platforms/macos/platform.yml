name: macos
info:
  family: macos
  environment: hosted
package: barracuda-platform-macos
crate: barracuda_platform_macos
type: MacosPlatform
build:
  rustup-toolchain: stable
  missing-toolchain-prompt: |
    The stable Rust toolchain is required. Install it with:
      rustup toolchain install stable
selection:
  board-chips:
    - macos
  targets:
    - os: macos
system-image:
  layout:
    driver: file-regions
  flash:
    driver: file
    state-directory: .barracuda
    flash-image: board.flash
application:
  support-binaries:
    - barracuda-macos
  launcher:
    program: "{support:barracuda-macos}"
    arguments:
      - "{application}"
      - "{workspace}"
settings:
  state-directory: .barracuda
  flash-image: board.flash
  network-gateway: ws://127.0.0.1:8787/v1/connect
