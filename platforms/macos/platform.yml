name: macos
info:
  family: macos
  environment: hosted
package: barracuda-platform-macos
crate: barracuda_platform_macos
type: MacosPlatform
build:
  rustup-toolchain: "1.98.1"
  missing-toolchain-prompt: |
    Rust 1.98.1 is required. Install it with:
      rustup toolchain install 1.98.1
hal:
  # Virtual hardware from platforms/virtual-io: pins GPIO0..GPIO15 and the
  # I2C controllers below, controlled through BARRACUDA_VIRTUAL_IO_ADDR.
  bindings: [gpio, i2c-device]
  runtime-i2c-controllers: [I2C0, I2C1]
selection:
  board-chips:
    - macos
  targets:
    - os: macos
system-image:
  layout:
    driver: file-regions
  flash:
    driver: file
    state-directory: .barracuda
    flash-image: board.flash
application:
  support-binaries:
    - barracuda-macos
  launcher:
    program: "{support:barracuda-macos}"
    arguments:
      - "{application}"
      - "{workspace}"
settings:
  state-directory: .barracuda
  flash-image: board.flash
  network-gateway: ws://127.0.0.1:8787/v1/connect
