[package]
name = "barracuda-platform-net-gateway"
version = "0.1.0"
edition = "2021"
description = "WebSocket virtual router for Barracuda browser and macOS devices"

[lib]
path = "src/main.rs"

[[bin]]
name = "barracuda-platform-net-gateway"
path = "src/bin.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
barracuda-platform-net-gateway-protocol.workspace = true
clap = { version = "4", features = ["derive"] }
embassy-net = { workspace = true, features = ["std"] }
embassy-net-driver-channel.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-util = "0.3"
netstack-smoltcp = "0.2.4"
thiserror = "2"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
