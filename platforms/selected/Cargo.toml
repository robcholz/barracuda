[package]
name = "barracuda-platform-selected"
version = "0.1.0"
edition = "2021"
description = "Compile-time selected Barracuda Platform"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-platform.workspace = true
barracuda-platform-selection = { path = "../../.barracuda/selection/platform" }
embassy-executor.workspace = true

[build-dependencies]
barracuda-platform-config.workspace = true
barracuda-platform-tool.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
