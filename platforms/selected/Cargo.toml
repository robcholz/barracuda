[package]
name = "barracuda-platform-selected"
version = "0.1.0"
edition = "2021"
description = "Compile-time selected Barracuda Platform"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-platform.workspace = true
# BEGIN GENERATED SELECTED PLATFORM
barracuda-platform-macos.workspace = true
# END GENERATED SELECTED PLATFORM
embassy-executor.workspace = true

[build-dependencies]
barracuda-platform-config.workspace = true
barracuda-platform-tool = { path = "../tool" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
