[package]
name = "barracuda-target"
version = "0.1.0"
edition = "2021"
description = "Compile-time selected Barracuda Board and Platform resource factory"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-board = { path = "../../boards/api" }
barracuda-platform = { path = "../api" }
barracuda-platform-host = { path = "../host" }
embassy-executor.workspace = true

[build-dependencies]
barracuda-board-config = { path = "../../boards/config" }
serde = { version = "1", features = ["derive"] }
yaml-peg = { version = "1.0.8", features = ["serde"] }

[dev-dependencies]
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
