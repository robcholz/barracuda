[package]
name = "barracuda-platform-stm32"
version = "0.1.0"
edition = "2021"
description = "STM32-native Board storage integration for Barracuda"

[features]
default = []
stm32f429zi = [
    "dep:cortex-m-rt",
    "dep:embassy-embedded-hal",
    "dep:embassy-executor",
    "dep:embassy-net",
    "dep:embassy-stm32",
    "dep:embassy-sync",
    "dep:panic-halt",
    "dep:rtt-target",
    "embassy-stm32/stm32f429zi",
]

[dependencies]
barracuda-board = { path = "../../boards/api" }
barracuda-platform = { path = "../api" }
log.workspace = true

[target.'cfg(target_arch = "arm")'.dependencies]
barracuda-tls = { path = "../../shared/tls" }
cortex-m-rt = { version = "0.7.6", optional = true }
embassy-embedded-hal = { version = "0.6.0", optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, optional = true }
embassy-sync = { version = "0.8.0", default-features = false, optional = true }
panic-halt = { version = "1.0.0", optional = true }
rtt-target = { version = "0.6.2", features = ["log"], optional = true }

[build-dependencies]
barracuda-board-config = { path = "../../boards/config" }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
