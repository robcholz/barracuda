name: stm32
package: barracuda-platform-stm32
crate: barracuda_platform_stm32
type: Stm32Platform
hal:
  bindings: [digital-input, digital-output, gpio, i2c-device, spi-bus]
  runtime-i2c-controllers: [I2C1]
  runtime-spi-controllers: [SPI1]
  runtime-uart-controllers: [USART1]
  runtime-adc-controllers:
    - controller: ADC1
      channels:
        - { channel: ADC1_CH0, pin: PA0 }
        - { channel: ADC1_CH1, pin: PA1 }
        - { channel: ADC1_CH2, pin: PA2 }
        - { channel: ADC1_CH3, pin: PA3 }
        - { channel: ADC1_CH4, pin: PA4 }
        - { channel: ADC1_CH5, pin: PA5 }
        - { channel: ADC1_CH6, pin: PA6 }
        - { channel: ADC1_CH7, pin: PA7 }
        - { channel: ADC1_CH8, pin: PB0 }
        - { channel: ADC1_CH9, pin: PB1 }
        - { channel: ADC1_CH10, pin: PC0 }
        - { channel: ADC1_CH11, pin: PC1 }
        - { channel: ADC1_CH12, pin: PC2 }
        - { channel: ADC1_CH13, pin: PC3 }
        - { channel: ADC1_CH14, pin: PC4 }
        - { channel: ADC1_CH15, pin: PC5 }
  runtime-pwm-controllers:
    - controller: TIM1
      timers: [TIM1]
      channels: [Ch1]
selection:
  board-chips:
    - "stm32*"
  targets:
    - triple: "thumb*-none-eabi*"
  features-by-chip:
    stm32f429zi:
      - stm32f429zi
system-image:
  layout:
    driver: linker-memory
  flash:
    driver: command
    program: probe-rs
    arguments: [download, --chip, "{chip}", --binary-format, bin, --base-address, "{offset}", "{image}"]
application:
  launcher:
    program: probe-rs
    arguments: [run, --chip, STM32F429ZITx, "{application}"]
