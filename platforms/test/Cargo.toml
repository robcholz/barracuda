[package]
name = "barracuda-platform-test"
version = "0.1.0"
edition = "2021"
description = "Deterministic test Platform implementations for Barracuda"

[features]
default = []
std = []

[dependencies]
barracuda-vfs = { workspace = true, features = ["std"] }
barracuda-vfs-memfs.workspace = true
embassy-futures.workspace = true
embassy-net.workspace = true
embassy-net-driver-channel.workspace = true
embassy-sync.workspace = true
embassy-embedded-hal = "0.5.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
embedded-storage-async.workspace = true
thiserror = { version = "2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
