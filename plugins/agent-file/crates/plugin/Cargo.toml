[package]
name = "barracuda-agent-file-plugin"
version = "0.1.0"
edition = "2024"
description = "Scoped file-operation Tools for Barracuda Agents"
license = "Apache-2.0"

[dependencies]
barracuda-agent-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-vfs.workspace = true
json-validator.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-vfs-memfs.workspace = true
embassy-futures.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
