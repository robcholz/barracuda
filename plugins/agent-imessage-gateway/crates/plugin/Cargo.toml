[package]
name = "barracuda-agent-imessage-gateway-plugin"
version = "0.1.0"
edition = "2024"
description = "Agent Tool adapter for the Barracuda IMessage Gateway capability"
license = "Apache-2.0"

[dependencies]
barracuda-agent-plugin.workspace = true
barracuda-imessage-gateway-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-time-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
json-validator.workspace = true
log.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }
thiserror = { version = "2", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
barracuda-platform-test.workspace = true
barracuda-vfs.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
