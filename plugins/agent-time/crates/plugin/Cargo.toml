[package]
name = "barracuda-agent-time-plugin"
version = "0.1.0"
edition = "2024"
description = "Agent Tool adapter for the Barracuda Time capability"
license = "Apache-2.0"

[dependencies]
barracuda-agent-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-time-plugin.workspace = true
json-validator.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }
time = { version = "0.3.55", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
