[package]
name = "barracuda-agent-vm-plugin"
version = "0.1.0"
edition = "2024"
description = "Agent Tool adapter for the Barracuda VM capability"
license = "Apache-2.0"

[dependencies]
barracuda-agent-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-vm-plugin.workspace = true
json-validator.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-agent-tool = { path = "../../../agent/crates/tool" }
critical-section = { version = "1", features = ["std"] }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
