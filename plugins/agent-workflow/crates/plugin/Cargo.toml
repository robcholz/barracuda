[package]
name = "barracuda-agent-workflow-plugin"
version = "0.1.0"
edition = "2024"
description = "Agent Tool adapter for Barracuda Workflow"
license = "Apache-2.0"

[dependencies]
barracuda-agent-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
json-validator.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
