[package]
name = "barracuda-agent-profile"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Host profiling scenarios for the assembled Barracuda agent"
publish = false
default-run = "barracuda-agent-profile"

[[bin]]
name = "barracuda-agent-profile"
path = "src/main.rs"

[dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
barracuda-agent-runtime = { path = "../../../crates/runtime" }
barracuda-agent-skill = { path = "../../../crates/skill", features = ["std"] }
barracuda-model-api = { path = "../../../crates/model-api" }
barracuda-net = { path = "../../../../../shared/net", features = ["testing"] }
barracuda-fs = { path = "../../../../../shared/fs" }
barracuda-profile = { path = "../../../../../shared/profile", features = ["dhat-heap"] }
