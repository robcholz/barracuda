[package]
name = "barracuda-agent-component"
version = "0.1.0"
edition = "2021"
description = "Event Router Component adapter for the Agent runtime"

[lib]
crate-type = ["rlib"]

[dependencies]
barracuda-agent-runtime = { path = "../runtime", features = ["cache_profile"] }
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-vfs = { path = "../../../../shared/vfs" }
async-channel = { version = "2", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
http-client = { path = "../../../../shared/http-client" }
barracuda-model-api = { path = "../model-api" }
barracuda-platform-test = { path = "../../../../platforms/test" }
barracuda-rpc = { path = "../../../../core/event-router/crates/rpc" }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = { version = "2", features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
static_cell = "2.1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
