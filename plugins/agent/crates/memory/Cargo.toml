[package]
name = "barracuda-agent-memory"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Agent memory subsystem: conversation tape and compaction"

[lib]
crate-type = ["rlib"]

[dependencies]
# Core crate: depends only on the inbound trait crate. The concrete `FileSystem` and
# `Compactor` (e.g. `barracuda_agent_runtime::LlmCompactor`) are passed in by the caller, so
# this crate pulls in neither a concrete platform boundary nor the LLM
# client (`barracuda-model-api`).
barracuda-fs = { path = "../../../../shared/fs" }
# Shared id/allocator macros (`define_id_allocator!` for the `TurnId` counter).
barracuda-runtime-utils = { path = "../../../../shared/runtime-utils" }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# Host-target helpers for tests/examples/doctests: `diskfs-pretty` is a
# disk-backed inspection backend. None of these reach device builds.
barracuda-platform-host = { path = "../../../../platforms/host", features = ["filesystem-pretty-json"] }
barracuda-platform-test = { path = "../../../../platforms/test" }
# Ergonomic error handling for the host dev workflow `conversation` example.
anyhow = "1"
# `block_on` for the `Compactor` doctest (smol family; replaces the removed
# `barracuda_runtime_utils::block_on`).
futures-lite = "2"

[lints.rust]
unreachable_pub = "deny"
