[package]
name = "barracuda-agent-memory"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Agent memory subsystem: conversation tape and compaction"

[lib]
crate-type = ["rlib"]

[dependencies]
# Filesystem paths are always scoped by System/Plugin Manager before reaching
# Agent memory; backend selection remains outside this crate.
barracuda-vfs = { path = "../../../../shared/vfs" }
# Shared id/allocator macros (`define_id_allocator!` for the `TurnId` counter).
barracuda-runtime-utils = { path = "../../../../shared/runtime-utils" }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# Host-target helpers for tests/examples/doctests: `diskfs-pretty` is a
# disk-backed inspection backend. None of these reach device builds.
barracuda-platform-test = { path = "../../../../platforms/test", features = ["std"] }
# Ergonomic error handling for the host dev workflow `conversation` example.
anyhow = "1"
# `block_on` for the `Compactor` doctest (smol family; replaces the removed
# `barracuda_runtime_utils::block_on`).
futures-lite = "2"

[lints.rust]
unreachable_pub = "deny"
