[package]
name = "barracuda-model-api"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "OpenAI-/Anthropic-compatible LLM client chat + media"

[lib]
name = "barracuda_model_api"
crate-type = ["rlib"]

[features]
cache_profile = []

[dependencies]
barracuda-runtime-utils.workspace = true
http-client.workspace = true
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
embassy-time.workspace = true
embassy-futures.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
futures-core = { version = "0.3", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
getset = "0.1.7"
ouroboros = { version = "0.18.5", default-features = false }
reqwless = { git = "https://github.com/drogue-iot/reqwless.git", rev = "b761705cc654e6f31bc064183e219aa09b33968a", default-features = false }
eventsource-stream = { version = "0.2.3", default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
# Shape-only attempt/retry spans consumed by the firmware's barracuda-agent-trace subscriber.
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
barracuda-platform-test.workspace = true
embedded-io = "0.7"
serde_json = "1"
# Ergonomic error handling for host-target doc-tests and the chat example.
anyhow = "1"
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"
tempdir = "0.3"
# Capturing subscriber used by the attempt/retry trace contract tests.
barracuda-agent-trace.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unreachable_pub = "deny"
unsafe_code = "forbid"
