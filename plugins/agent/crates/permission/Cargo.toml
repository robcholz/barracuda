[package]
name = "barracuda-agent-permission"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
publish = false
description = "Permission policy layer: classifies tool actions into Allow/Ask/Deny decisions"

[lib]
name = "barracuda_agent_permission"
# Pure-Rust rlib bundled (with the other logic crates) into the single `barracuda_rt`
# staticlib that the firmware links.
crate-type = ["rlib"]

[dependencies]
getset = "0.1.7"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[lints.rust]
unreachable_pub = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
