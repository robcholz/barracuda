[package]
name = "barracuda-agent-persistence"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
publish = false
description = "Persistence interfaces for durable runtime state"

[lib]
crate-type = ["rlib"]

[dependencies]
portable-atomic-util.workspace = true
barracuda-vfs.workspace = true
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-platform-test.workspace = true
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unreachable_pub = "deny"
