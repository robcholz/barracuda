[package]
name = "barracuda-agent-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that owns the Agent Component"

[dependencies]
barracuda-agent-component.workspace = true
barracuda-agent-runtime = { workspace = true, features = ["cache_profile", "multiagent"] }
barracuda-model-api.workspace = true
barracuda-plugin-api.workspace = true
barracuda-plugin-manager.workspace = true
barracuda-webserver-plugin.workspace = true
http-client = { workspace = true, features = ["mbedtls"] }
log.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-event-router.workspace = true
barracuda-model-api.workspace = true
barracuda-platform-test.workspace = true
embassy-net.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embedded-io-async = "0.7"
futures-lite = "2"
picoserve = { version = "0.19.0", default-features = false, features = ["embassy"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
