[package]
name = "barracuda-agent-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that owns the Agent runtime and Workflow adapter"

[build-dependencies]
barracuda-plugin-build = { path = "../../../../core/plugin/crates/build" }

[dependencies]
barracuda-captive-portal-plugin.workspace = true
barracuda-agent-runtime = { path = "../runtime", features = ["cache_profile", "multiagent"] }
barracuda-model-api = { path = "../model-api" }
barracuda-plugin.workspace = true
barracuda-vfs.workspace = true
barracuda-webserver-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
http-client = { workspace = true, features = ["mbedtls"] }
barracuda-json-writer.workspace = true
log.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-model-api = { path = "../model-api" }
barracuda-platform-test.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
