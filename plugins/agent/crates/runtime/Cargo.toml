[package]
name = "barracuda-agent-runtime"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Top-level Agent runtime API over single-agent execution and Sessions"
autotests = false

[lib]
name = "barracuda_agent_runtime"
path = "src/lib.rs"

[[test]]
name = "embassy_runtime"

[features]
# Concepts:
# - target selection and concrete HAL adapters belong to the application, not
#   to this executor-neutral framework crate.
# - `cache_profile` forwards provider usage support.
#
multiagent = ["barracuda-agent-session/multiagent"]
intrusive-observability = ["barracuda-agent/intrusive-observability"]
# Provider token/cache usage diagnostics.
cache_profile = [
    "barracuda-model-api/cache_profile",
    "barracuda-agent/cache_profile",
    "barracuda-agent-session/cache_profile",
]

[dependencies]
http-client.workspace = true
json-validator.workspace = true
barracuda-agent = { workspace = true, default-features = false }
barracuda-agent-session = { workspace = true, default-features = false }
barracuda-agent-memory.workspace = true
barracuda-agent-skill.workspace = true
barracuda-model-api.workspace = true
barracuda-agent-persistence.workspace = true
barracuda-agent-tool.workspace = true
# Filesystem traits remain platform-neutral. HTTP is injected through the
# shared client facade; time is provided globally by `embassy-time`.
barracuda-vfs.workspace = true
barracuda-runtime-utils.workspace = true
async-channel = { version = "2", default-features = false }
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
futures-core = { version = "0.3", default-features = false }
log = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[dev-dependencies]
# Host-only dependencies used by tests and the `tool_submit_loop` API example.
anyhow = "1"
barracuda-agent-trace.workspace = true
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
# In-memory fs + scripted network doubles so the end-to-end tests run hermetically
# (no network, no API key) entirely through the public API.
barracuda-platform-test = { workspace = true, features = ["std"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `block_on` for tests (smol family; replaces the removed local spin executor).
futures-lite = "2"
tempdir = "0.3"
static_cell = "2"
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }

[lints.rust]
unreachable_pub = "deny"
