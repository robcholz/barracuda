[package]
name = "barracuda-agent-skill"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
publish = false
description = "no_std filesystem runtime for standard Agent Skills"

[dependencies]
portable-atomic-util.workspace = true
portable-atomic.workspace = true
barracuda-minimal-yaml.workspace = true
barracuda-vfs.workspace = true
getset = "0.1.7"
thiserror = { version = "2", default-features = false }

[dev-dependencies]
# Host tests copy data-driven fixtures into a mounted in-memory VFS.
barracuda-platform-test = { workspace = true, features = ["std"] }
# Ergonomic error handling for host dev workflow examples; never in firmware.
anyhow = "1"
futures-lite = "2"
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unreachable_pub = "deny"
