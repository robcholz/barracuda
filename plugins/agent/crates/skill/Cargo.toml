[package]
name = "barracuda-agent-skill"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "no_std filesystem runtime for standard Agent Skills"

[features]
default = []
# Host consumers that unify serde's std support must also enable yaml-peg's
# matching error implementation.
std = ["yaml-peg/std"]

[dependencies]
barracuda-vfs = { path = "../../../../shared/vfs" }
getset = "0.1.7"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }
yaml-peg = { version = "1.0.8", default-features = false, features = ["serde"] }

[dev-dependencies]
# Host tests copy data-driven fixtures into a mounted in-memory VFS.
barracuda-platform-test = { path = "../../../../platforms/test", features = ["std"] }
# Ergonomic error handling for host dev workflow examples; never in firmware.
anyhow = "1"
futures-lite = "2"
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unreachable_pub = "deny"
