id = "agent"
depends-on = ["webserver", "workflow", "captive-portal", "time"]
description = "Runs conversational agents and exposes model configuration over HTTP."

[tasks.build]
cwd = "."
command = ["bun", "../../tools/web/build.ts"]
inputs = ["resources/web/entry.ts", "resources/web/figure.js", "resources/web/icon.svg", "../../package.json", "../../bun.lock", "../captive-portal/resources/web/ui", "../../tools/web/build.ts"]
outputs = ["filesystem/resources/entry.js", "filesystem/resources/figure.js", "filesystem/resources/icon.svg"]
