# Vendored from PocketJS (https://github.com/pocket-nexus/pocketjs),
# engine/crates/microts, commit 96e5f4084c2da45d72997c443fd478bcffb92dc7.
# MIT licensed; see LICENSE. The MicroTS runtime that compiled views drive.

[package]
name = "microts"
version = "0.1.0"
edition = "2024"
description = "MicroTS AOT models and views over the PocketJS retained UI (vendored)"
license = "MIT"
publish = false

[dependencies]
pocketjs-core = { path = "../pocketjs-core", default-features = false }
ryu-js = { version = "1.0.3", default-features = false }
libm = "0.2"
heapless = "0.8"
portable-atomic = { version = "1.3", default-features = false }

[target.'cfg(not(target_has_atomic = "32"))'.dependencies]
heapless = { version = "0.8", features = ["portable-atomic"] }
portable-atomic = { version = "1.3", default-features = false, features = ["require-cas"] }

[features]
default = []
# Layout work counters and the full-tree layout oracle (`Ui::layout_mismatches`).
counters = ["pocketjs-core/counters"]
model-trace = []
critical-section = ["portable-atomic/critical-section"]

# Upstream code: keep Clippy's style lints out of this workspace's reports.
[lints.clippy]
all = { level = "allow", priority = -1 }
