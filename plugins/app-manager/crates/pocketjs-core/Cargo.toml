# Vendored from PocketJS (https://github.com/pocket-nexus/pocketjs), engine/core,
# commit e9e417308f094ead706754164acf91436e4d05a8. MIT licensed; see LICENSE.
# The retained UI core: node tree, styles, taffy layout, text, draw lists and
# the software rasteriser. Upstream test modules are not vendored.

[package]
name = "pocketjs-core"
version = "0.1.0"
edition = "2021"
description = "PocketJS retained UI core (vendored)"
license = "MIT"
publish = false

[dependencies]
taffy = { version = "0.11", default-features = false, features = [
    "alloc",
    "taffy_tree",
    "flexbox",
    "content_size",
] }

[features]
default = []
counters = []

# Upstream code: keep Clippy's style lints out of this workspace's reports.
[lints.clippy]
all = { level = "allow", priority = -1 }

# Some test-only helpers lost their callers with the dropped upstream tests.
[lints.rust]
dead_code = "allow"
