id = "app-portal"
depends-on = ["app-manager", "webserver", "captive-portal", "wifi"]
description = "Installs offered apps from the portal, approved on the setup hotspot."

[tasks.build]
cwd = "."
command = ["bun", "../../tools/web/build.ts"]
inputs = ["resources/web/entry.ts", "resources/web/icon.svg", "../../package.json", "../../bun.lock", "../captive-portal/resources/web/ui", "../../tools/web/build.ts"]
outputs = ["filesystem/resources/entry.js", "filesystem/resources/icon.svg"]
