[package]
name = "barracuda-builtin-app-sessions-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin that ships the Sessions system app"
license = "Apache-2.0"

[dependencies]
barracuda-app-manager-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-agent-plugin.workspace = true
barracuda-time-plugin.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
