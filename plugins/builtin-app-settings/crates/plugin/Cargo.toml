[package]
name = "barracuda-builtin-app-settings-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin that ships the Settings system app"
license = "AGPL-3.0-only"

[dependencies]
barracuda-app-manager-plugin.workspace = true
barracuda-platform.workspace = true
barracuda-plugin.workspace = true
barracuda-vfs.workspace = true
barracuda-wifi-plugin.workspace = true
log.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
