[package]
name = "barracuda-captive-portal-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin exposing Agent model API configuration over HTTP"

[dependencies]
barracuda-agent-plugin = { path = "../../../agent/crates/plugin" }
barracuda-plugin-manager = { path = "../../../../core/plugin-manager" }
barracuda-webserver-plugin = { path = "../../../webserver/crates/plugin" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-platform-host = { path = "../../../../platforms/host", features = ["testing"] }
barracuda-platform-test = { path = "../../../../platforms/test" }
futures-lite = "2"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
