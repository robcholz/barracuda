    <script>
      // Paint in the chosen theme from the first frame; the shell keeps it in sync afterwards.
      try {
        var mode = localStorage.getItem("barracuda.theme");
        var dark =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
        if (localStorage.getItem("barracuda.lang") === "en")
          document.documentElement.lang = "en";
      } catch (error) {}
    </script>
