[package]
name = "barracuda-file-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin-scoped filesystem capability and JSON RPCs"
license = "Apache-2.0"

[dependencies]
barracuda-event-router.workspace = true
barracuda-plugin-api.workspace = true
barracuda-plugin-manager.workspace = true
barracuda-vfs.workspace = true
embedded-io-async = "0.7"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }

[dev-dependencies]
barracuda-vfs-memfs.workspace = true
critical-section = { version = "1", features = ["std"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
