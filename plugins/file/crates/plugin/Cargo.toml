[package]
name = "barracuda-file-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda System filesystem capability and dynamic RPC harness"
license = "Apache-2.0"

[dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-plugin-api = { path = "../../../../core/plugin/crates/api" }
barracuda-plugin-manager = { path = "../../../../core/plugin/crates/manager" }
barracuda-vfs = { path = "../../../../shared/vfs" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde-big-array = "0.5"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
barracuda-platform-test = { path = "../../../../platforms/test" }
futures-lite = { version = "2", features = ["std"] }
serde_json = { version = "1" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
