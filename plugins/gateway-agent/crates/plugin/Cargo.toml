[package]
name = "barracuda-gateway-agent-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that owns the Gateway-Agent Bridge Component"

[dependencies]
barracuda-gateway-agent-component = { path = "../component" }
barracuda-imessage-gateway-plugin = { path = "../../../imessage-gateway/crates/plugin" }
barracuda-imessage-web-plugin = { path = "../../../imessage-web/crates/plugin" }
barracuda-plugin-manager = { path = "../../../../core/plugin-manager" }

[dev-dependencies]
barracuda-platform-test = { path = "../../../../platforms/test" }
barracuda-event-router = { path = "../../../../core/event-router" }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
