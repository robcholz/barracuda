[package]
name = "barracuda-http-plugin"
version = "0.1.0"
edition = "2024"
description = "Typed outbound HTTP capability and Workflow Action for Barracuda"
license = "Apache-2.0"

[dependencies]
barracuda-bulk-memory.workspace = true
barracuda-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embedded-io-async = "0.7"
embassy-time.workspace = true
http-client.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
