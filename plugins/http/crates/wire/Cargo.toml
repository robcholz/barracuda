[package]
name = "barracuda-http-wire"
version = "0.1.0"
edition = "2024"
description = "Fixed-layout wire DTOs for the Barracuda HTTP Plugin"
license = "Apache-2.0"

[features]
default = []
schema = ["dep:barracuda-rpc-schema", "dep:schemars"]

[dependencies]
barracuda-rpc = { path = "../../../../core/event-router/crates/rpc" }
barracuda-rpc-schema = { path = "../../../../core/event-router/crates/rpc-schema", optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1", default-features = false, features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
