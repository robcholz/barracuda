[package]
name = "barracuda-i2c-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin exposing Board I2C resources to Lua"
license = "Apache-2.0"

[dependencies]
barracuda-board-hal.workspace = true
barracuda-lua.workspace = true
barracuda-plugin-api.workspace = true
barracuda-plugin-manager.workspace = true
barracuda-vm-package-api.workspace = true
barracuda-vm-plugin.workspace = true
embassy-sync.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[dev-dependencies]
barracuda-lua = { workspace = true, features = ["vendored"] }
critical-section = { version = "1", features = ["std"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
