[package]
name = "barracuda-imessage-bluebubble-plugin"
version = "0.1.0"
edition = "2021"
description = "IMessage BlueBubbles provider Plugin"

[build-dependencies]
barracuda-plugin-build = { path = "../../../../core/plugin/crates/build" }

[dependencies]
barracuda-captive-portal-plugin.workspace = true
bluebubbles = { path = "../provider" }
barracuda-imessage-gateway-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-webserver-plugin.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
http-client.workspace = true
log = "0.4"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
