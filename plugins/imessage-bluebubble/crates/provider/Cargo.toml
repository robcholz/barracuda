[package]
name = "bluebubbles"
version = "0.1.0"
edition = "2021"
description = "BlueBubbles iMessage provider for the IMessage Gateway"
license = "Apache-2.0"

[dependencies]
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
gateway = { path = "../../../imessage-gateway/crates/gateway" }
gateway-http = { path = "../../../imessage-gateway/crates/http" }
http-client = { path = "../../../../shared/http-client" }
percent-encoding = { version = "2.3.2", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-platform-test = { path = "../../../../platforms/test" }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
