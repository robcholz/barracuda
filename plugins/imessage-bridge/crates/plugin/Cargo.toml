[package]
name = "barracuda-imessage-bridge-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin that owns the iMessage Agent bridge"
license = "Apache-2.0"

[dependencies]
barracuda-imessage-bridge-component = { path = "../component" }
barracuda-plugin-api = { path = "../../../../core/plugin/crates/api" }
barracuda-plugin-manager = { path = "../../../../core/plugin/crates/manager" }
embassy-futures.workspace = true

[dev-dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-platform-test = { path = "../../../../platforms/test" }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
