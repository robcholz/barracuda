[package]
name = "barracuda-imessage-gateway-channel"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared mode, owners, receive-loop, HTTP, and status plumbing for IMessage Gateway channel Plugins"

[dependencies]
barracuda-captive-portal-plugin.workspace = true
barracuda-imessage-gateway-owners = { path = "../owners" }
barracuda-plugin.workspace = true
barracuda-webserver-plugin.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
log.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-platform.workspace = true
barracuda-platform-test.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
