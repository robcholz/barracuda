[package]
name = "gateway-http"
version = "0.1.0"
edition = "2021"
description = "HTTP request helpers owned by the IMessage Gateway"
license = "Apache-2.0"

[dependencies]
embedded-io = "0.7"
embedded-io-async = "0.7"
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
gateway = { path = "../gateway" }
http-client = { path = "../../../../shared/http-client" }
reqwless = { git = "https://github.com/drogue-iot/reqwless.git", rev = "b761705cc654e6f31bc064183e219aa09b33968a", default-features = false }
thiserror = { version = "2", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
