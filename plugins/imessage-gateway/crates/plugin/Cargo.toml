[package]
name = "barracuda-imessage-gateway-plugin"
version = "0.1.0"
edition = "2021"
description = "Base IMessage Gateway Plugin and provider-registration capability"

[dependencies]
barracuda-imessage-gateway-component = { path = "../component" }
barracuda-plugin-api.workspace = true
barracuda-plugin-manager.workspace = true
gateway = { path = "../gateway" }
gateway-http = { path = "../http" }
[dev-dependencies]
barracuda-platform-test.workspace = true
barracuda-event-router.workspace = true
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
