[package]
name = "barracuda-imessage-gateway-plugin"
version = "0.1.0"
edition = "2021"
description = "Base IMessage Gateway Plugin and provider-registration capability"

[build-dependencies]
barracuda-plugin-build = { path = "../../../../core/plugin/crates/build" }

[dependencies]
barracuda-imessage-gateway-runtime = { path = "../runtime" }
barracuda-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
gateway = { path = "../gateway" }
gateway-http = { path = "../http" }
http-client.workspace = true
log.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-http-plugin.workspace = true
barracuda-platform-test.workspace = true
barracuda-vfs.workspace = true
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
