[package]
name = "barracuda-imessage-gateway-plugin"
version = "0.1.0"
edition = "2021"
description = "Base IMessage Gateway Plugin and provider-registration capability"

[dependencies]
barracuda-imessage-gateway-component = { path = "../component" }
barracuda-plugin-api = { path = "../../../../core/plugin-api" }
barracuda-plugin-manager = { path = "../../../../core/plugin-manager" }
gateway = { path = "../gateway" }

[dev-dependencies]
barracuda-platform-test = { path = "../../../../platforms/test" }
barracuda-event-router = { path = "../../../../core/event-router" }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
