[package]
name = "barracuda-imessage-gateway-plugin"
version = "0.1.0"
edition = "2021"
description = "Base IMessage Gateway Plugin and provider-registration capability"

[build-dependencies]
barracuda-plugin-build = { path = "../../../../core/plugin/crates/build" }

[dependencies]
barracuda-imessage-gateway-runtime = { path = "../runtime" }
barracuda-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
barracuda-bulk-memory.workspace = true
barracuda-platform.workspace = true
barracuda-vfs.workspace = true
barracuda-webserver-plugin.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embedded-io = "0.7"
embedded-io-async = "0.7"
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
gateway = { path = "../gateway" }
http-client.workspace = true
log.workspace = true
reqwless = { git = "https://github.com/drogue-iot/reqwless.git", rev = "b761705cc654e6f31bc064183e219aa09b33968a", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-http-plugin.workspace = true
barracuda-platform-test.workspace = true
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"
rusty-fork = "0.3"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
