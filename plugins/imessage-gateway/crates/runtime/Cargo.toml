[package]
name = "barracuda-imessage-gateway-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "Typed operation runtime for the IMessage Gateway"

[dependencies]
async-channel.workspace = true
barracuda-bulk-memory.workspace = true
barracuda-json-writer.workspace = true
barracuda-workflow-plugin.workspace = true
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
gateway = { path = "../gateway" }
log.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
