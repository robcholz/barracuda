id = "imessage-gateway"
depends-on = ["workflow", "http", "webserver"]
description = "Provides typed messaging capabilities and Workflow Actions."

[config.receive-slots]
type = "usize"
default = 1
description = """
Connections reserved for channel receive loops (long polls and push sockets),
beside the HTTP request pool. An open one holds a TLS session of about 35 KiB,
in external memory where the Platform installs it as bulk memory."""

[config.attachment-max-bytes]
type = "u32"
default = 8388608
description = "Largest single attachment the Gateway stores or sends."
