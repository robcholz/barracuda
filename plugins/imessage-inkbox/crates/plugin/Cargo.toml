[package]
name = "barracuda-imessage-inkbox-plugin"
version = "0.1.0"
edition = "2021"
description = "IMessage Inkbox provider Plugin"
license = "Apache-2.0"

[dependencies]
barracuda-imessage-gateway-plugin = { path = "../../../imessage-gateway/crates/plugin" }
barracuda-plugin-manager = { path = "../../../../core/plugin-manager" }
gateway = { path = "../../../imessage-gateway/crates/gateway" }
http-client = { path = "../../../../shared/http-client" }
inkbox = { path = "../provider" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
