[package]
name = "inkbox"
version = "0.1.0"
edition = "2021"
publish = false
description = "Inkbox iMessage API provider for the IMessage Gateway"
license = "AGPL-3.0-only"

[dependencies]
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
barracuda-imessage-gateway-plugin.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-http-plugin.workspace = true
barracuda-platform-test.workspace = true
barracuda-plugin.workspace = true
barracuda-vfs.workspace = true
barracuda-webserver-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-futures.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
