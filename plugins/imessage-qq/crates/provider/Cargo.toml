[package]
name = "qq"
version = "0.1.0"
edition = "2021"
publish = false
description = "QQ Bot API provider for the IMessage Gateway"
license = "Apache-2.0"

[dependencies]
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
barracuda-imessage-gateway-plugin.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
http-client.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-platform-test.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embedded-io = "0.7"
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
