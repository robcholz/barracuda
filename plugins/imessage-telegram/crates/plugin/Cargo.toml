[package]
name = "barracuda-imessage-telegram-plugin"
version = "0.1.0"
edition = "2021"
description = "IMessage Telegram provider Plugin"

[dependencies]
barracuda-imessage-gateway-plugin = { path = "../../../imessage-gateway/crates/plugin" }
barracuda-plugin-api = { path = "../../../../core/plugin/crates/api" }
barracuda-plugin-manager = { path = "../../../../core/plugin/crates/manager" }
barracuda-webserver-plugin = { path = "../../../webserver/crates/plugin" }
gateway = { path = "../../../imessage-gateway/crates/gateway" }
http-client = { path = "../../../../shared/http-client" }
log = "0.4"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
telegram = { path = "../provider" }

[dev-dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-imessage-bluebubble-plugin = { path = "../../../imessage-bluebubble/crates/plugin" }
barracuda-imessage-inkbox-plugin = { path = "../../../imessage-inkbox/crates/plugin" }
barracuda-imessage-qq-plugin = { path = "../../../imessage-qq/crates/plugin" }
barracuda-imessage-wechat-plugin = { path = "../../../imessage-wechat/crates/plugin" }
barracuda-platform-test = { path = "../../../../platforms/test" }
embassy-net.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embedded-io-async = "0.7"
picoserve = { version = "0.19.0", default-features = false, features = ["alloc", "embassy", "ws"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
