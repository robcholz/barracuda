id = "imessage-telegram"
depends-on = ["imessage-gateway", "captive-portal"]
description = "Adds Telegram Bot as an iMessage Gateway channel."

[tasks.build]
cwd = "."
command = ["bun", "../../tools/web/build.ts"]
