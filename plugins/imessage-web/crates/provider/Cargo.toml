[package]
name = "web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runtime-neutral REST and SSE web channel for the IMessage Gateway"
license = "Apache-2.0"

[features]
default = []
# Portable WebSocket endpoint registered with the global WebServer.
server = ["dep:barracuda-webserver-plugin"]

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
barracuda-webserver-plugin = { workspace = true, optional = true }
embassy-sync.workspace = true
futures-core = { version = "0.3", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
barracuda-imessage-gateway-plugin.workspace = true
log.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
