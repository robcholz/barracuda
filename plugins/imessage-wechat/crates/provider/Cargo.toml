[package]
name = "wechat"
version = "0.1.0"
edition = "2021"
description = "WeChat iLink provider for the IMessage Gateway"
license = "Apache-2.0"

[dependencies]
futures-lite = { version = "2.6.1", default-features = false, features = ["alloc"] }
gateway.workspace = true
gateway-http.workspace = true
http-client.workspace = true
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-platform-test.workspace = true
futures-lite = { version = "2.6.1", default-features = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
