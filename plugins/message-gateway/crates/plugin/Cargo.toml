[package]
name = "barracuda-message-gateway-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that owns the Message Gateway Component"

[dependencies]
barracuda-message-gateway-component = { path = "../component" }
barracuda-plugin-manager = { path = "../../../../core/plugin-manager" }
barracuda-webserver-plugin = { path = "../../../webserver/crates/plugin" }
gateway = { path = "../gateway" }
web = { path = "../web", features = ["server"] }

[dev-dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
ekv = { version = "1", features = ["std"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
