[package]
name = "barracuda-scheduler-component"
version = "0.1.0"
edition = "2024"
description = "RTC-authoritative scheduling component for Barracuda"
license = "Apache-2.0"

[dependencies]
barracuda-event-router.workspace = true
barracuda-plugin-manager.workspace = true
barracuda-time-component.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
getset = "0.1"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }
time = { version = "0.3.55", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
barracuda-platform-test.workspace = true
barracuda-rpc.workspace = true
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"
serde_json = "1"
static_cell = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
