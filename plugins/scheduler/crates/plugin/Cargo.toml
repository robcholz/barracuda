[package]
name = "barracuda-scheduler-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin that owns the RTC-authoritative Scheduler Component"
license = "Apache-2.0"

[dependencies]
barracuda-plugin-api.workspace = true
barracuda-plugin-manager.workspace = true
barracuda-scheduler-component = { path = "../component" }
barracuda-time-plugin.workspace = true
embassy-futures.workspace = true

[dev-dependencies]
barracuda-event-router.workspace = true
barracuda-platform-test.workspace = true
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
