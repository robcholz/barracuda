[package]
name = "barracuda-shell-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin that runs the device's system UI"
license = "Apache-2.0"

[dependencies]
barracuda-app-plugin.workspace = true
barracuda-platform.workspace = true
barracuda-plugin.workspace = true
barracuda-time-plugin.workspace = true
barracuda-ui-plugin.workspace = true
barracuda-vfs.workspace = true
barracuda-wifi-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
log.workspace = true
portable-atomic.workspace = true
portable-atomic-util.workspace = true
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-captive-portal-plugin.workspace = true
barracuda-platform-test.workspace = true
barracuda-webserver-plugin.workspace = true
barracuda-lua = { path = "../../../vm/crates/lua", features = ["vendored"] }
barracuda-vm-plugin.workspace = true
barracuda-vm-runtime = { path = "../../../vm/crates/runtime", features = ["test-fixture", "vendored"] }
barracuda-vfs-memfs.workspace = true
critical-section = { version = "1", features = ["std"] }
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
