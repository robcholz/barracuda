[package]
name = "barracuda-sound-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin owning the Board's audio codec and output level"
license = "Apache-2.0"

[build-dependencies]
barracuda-plugin-build = { path = "../../../../core/plugin/crates/build" }

[dependencies]
portable-atomic-util.workspace = true
portable-atomic.workspace = true
barracuda-board-hal.workspace = true
barracuda-plugin.workspace = true
critical-section = "1"
log.workspace = true

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
