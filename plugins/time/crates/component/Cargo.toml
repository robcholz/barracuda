[package]
name = "barracuda-time-component"
version = "0.1.0"
edition = "2024"
description = "Network-synchronized real-time clock component for Barracuda"
license = "Apache-2.0"

[dependencies]
barracuda-event-router.workspace = true
embassy-net.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
getset = "0.1"
sntpc = { version = "0.11.0", default-features = false }
thiserror = { version = "2", default-features = false }
time = { version = "0.3.55", default-features = false }

[dev-dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"
serde_json = "1"
static_cell = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
