[package]
name = "barracuda-ui-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin that runs compiled MicroTS views and binds them to Lua"
license = "Apache-2.0"

[dependencies]
barracuda-plugin.workspace = true
barracuda-ui-runtime = { path = "../runtime" }
barracuda-vm-plugin.workspace = true
critical-section = "1"
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
log.workspace = true

[dev-dependencies]
barracuda-lua = { path = "../../../vm/crates/lua", features = ["vendored"] }
critical-section = { version = "1", features = ["std"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
