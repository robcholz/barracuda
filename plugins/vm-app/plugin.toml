id = "app"
depends-on = ["vm", "ui", "workflow"]
description = "Lists, launches, and supervises Lua apps with optional MicroTS views."

[tasks.apps]
cwd = "."
command = ["bun", "resources/apps/build.ts"]
inputs = ["resources/apps", "resources/examples"]
outputs = ["filesystem/resources/apps", "crates/plugin/tests/fixtures"]
env = ["POCKETJS_ROOT", "CJK_FONT_DIR"]
