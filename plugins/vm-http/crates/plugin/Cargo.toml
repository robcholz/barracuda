[package]
name = "barracuda-vm-http-plugin"
version = "0.1.0"
edition = "2024"
description = "Bounded outbound HTTP adapter for Barracuda Lua VMs"
license = "AGPL-3.0-only"

[dependencies]
barracuda-runtime-utils.workspace = true
portable-atomic-util.workspace = true
portable-atomic.workspace = true
async-channel.workspace = true
barracuda-http-plugin.workspace = true
barracuda-plugin.workspace = true
barracuda-vm-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
futures-util = { workspace = true, features = ["alloc", "async-await"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-vm-builtin-packages = { path = "../../../vm/crates/builtin-packages", features = ["vendored"] }
barracuda-vm-runtime = { path = "../../../vm/crates/runtime", features = ["test-fixture", "vendored"] }
critical-section = { version = "1", features = ["std"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
