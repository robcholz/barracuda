[package]
name = "barracuda-message-queue-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin providing shared bounded queues to Lua"
license = "AGPL-3.0-only"

[dependencies]
portable-atomic-util.workspace = true
portable-atomic.workspace = true
barracuda-plugin.workspace = true
barracuda-runtime-utils.workspace = true
barracuda-vm-plugin.workspace = true
embassy-sync.workspace = true
futures-util = { workspace = true, features = ["alloc", "async-await"] }
spin = { version = "0.10", default-features = false, features = ["portable_atomic", "mutex", "spin_mutex"] }

[dev-dependencies]
barracuda-vm-runtime = { path = "../../../vm/crates/runtime", features = ["test-fixture", "vendored"] }
critical-section = { version = "1", features = ["std"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
