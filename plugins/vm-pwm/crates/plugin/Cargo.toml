[package]
name = "barracuda-pwm-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Plugin exposing Board PWM resources to Lua"
license = "Apache-2.0"

[dependencies]
barracuda-board-hal.workspace = true
barracuda-plugin.workspace = true
barracuda-vm-plugin.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
