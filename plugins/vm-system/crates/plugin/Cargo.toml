[package]
name = "barracuda-vm-system-plugin"
version = "0.1.0"
edition = "2024"
description = "Lua package that gives Barracuda's system apps the device's settings and state"
license = "Apache-2.0"

[dependencies]
async-channel.workspace = true
barracuda-agent-plugin.workspace = true
barracuda-app-plugin.workspace = true
barracuda-platform.workspace = true
barracuda-plugin.workspace = true
barracuda-runtime-utils.workspace = true
barracuda-shell-plugin.workspace = true
barracuda-time-plugin.workspace = true
barracuda-ui-plugin.workspace = true
barracuda-vfs.workspace = true
barracuda-vm-plugin.workspace = true
barracuda-wifi-plugin.workspace = true
barracuda-workflow-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
futures-util = { workspace = true, features = ["alloc", "async-await"] }
log.workspace = true
portable-atomic.workspace = true
portable-atomic-util.workspace = true
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
barracuda-vm-runtime = { path = "../../../vm/crates/runtime", features = ["test-fixture", "vendored"] }
critical-section = { version = "1", features = ["std"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
