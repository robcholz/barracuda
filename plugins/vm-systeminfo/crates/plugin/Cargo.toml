[package]
name = "barracuda-vm-systeminfo-plugin"
version = "0.1.0"
edition = "2024"
description = "Lua adapter for Barracuda's fixed Platform and Board identity"
license = "Apache-2.0"

[dependencies]
barracuda-plugin.workspace = true
barracuda-vm-plugin.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
