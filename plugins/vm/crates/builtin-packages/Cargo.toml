[package]
name = "barracuda-vm-builtin-packages"
version = "0.1.0"
edition = "2024"
publish = false
description = "Built-in Lua packages owned by the Barracuda VM Plugin"
license = "Apache-2.0"

[features]
default = []
vendored = ["barracuda-lua/vendored"]

[dependencies]
async-channel.workspace = true
barracuda-lua = { path = "../lua" }
[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
