[package]
name = "barracuda-vm-builtin-packages"
version = "0.1.0"
edition = "2024"
description = "Built-in Lua packages owned by the Barracuda VM Plugin"
license = "Apache-2.0"

[features]
default = []
vendored = ["barracuda-lua/vendored"]

[dependencies]
async-channel = { version = "2.5", default-features = false }
barracuda-lua = { path = "../lua" }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
