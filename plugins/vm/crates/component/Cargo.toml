[package]
name = "barracuda-vm-component"
version = "0.1.0"
edition = "2024"
description = "Lua-backed script VM component for the Barracuda agent framework"
license = "Apache-2.0"

[features]
default = []
vendored = [
    "barracuda-lua/vendored",
    "barracuda-vm-builtin-packages/vendored",
]

[dependencies]
barracuda-event-router.workspace = true
barracuda-lua.workspace = true
barracuda-rpc.workspace = true
barracuda-vm-builtin-packages.workspace = true
barracuda-vm-package-api.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embedded-alloc = { version = "0.7", default-features = false, features = ["tlsf"] }
getset = "0.1"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-platform-test.workspace = true
critical-section = { version = "1", features = ["std"] }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
