[package]
name = "barracuda-vm-component"
version = "0.1.0"
edition = "2024"
description = "Lua-backed script VM component for the Barracuda agent framework"
license = "Apache-2.0"

[features]
default = []
vendored = [
    "barracuda-lua/vendored",
    "barracuda-vm-builtin-packages/vendored",
]

[dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-lua = { path = "../../../../shared/lua" }
barracuda-vm-builtin-packages = { path = "../builtin-packages" }
barracuda-runtime-utils = { path = "../../../../shared/runtime-utils" }
getset = "0.1"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
barracuda-platform-test = { path = "../../../../platforms/test" }
futures-lite = "2"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
