[package]
name = "barracuda-lua"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal no_std Lua wrapper with native Rust async bindings"
license = "Apache-2.0"

[features]
default = []
vendored = ["dep:lunka-src"]

[dependencies]
barracuda-bulk-memory.workspace = true
getset = "0.1.7"
lunka = { git = "https://github.com/robcholz/lunka.git", rev = "820b3d89a6ccfcdae3286f9b4548831dc568cf54", default-features = false, features = ["alloc", "auxlib", "stdlibs"] }

[build-dependencies]
lunka-src = { version = "54.8.0", optional = true }

[dev-dependencies]
async-channel.workspace = true
futures-lite = "2"
