[package]
name = "barracuda-vm-package-api"
version = "0.1.0"
edition = "2024"
description = "Typed capability for registering external VM Lua packages"
license = "Apache-2.0"

[features]
default = []
vendored = ["barracuda-lua/vendored"]

[dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-lua = { path = "../../../../shared/lua" }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
