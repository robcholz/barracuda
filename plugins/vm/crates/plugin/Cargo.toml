[package]
name = "barracuda-vm-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that publishes the Lua VM capability"

[dependencies]
barracuda-plugin.workspace = true
barracuda-vm-builtin-packages = { path = "../builtin-packages" }
barracuda-vm-runtime = { path = "../runtime" }
barracuda-vm-package-api = { path = "../package-api" }
barracuda-workflow-plugin.workspace = true
embassy-executor.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
barracuda-lua = { path = "../lua", features = ["wasm-static"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
barracuda-lua = { path = "../lua", features = ["vendored"] }
barracuda-vm-runtime = { path = "../runtime", features = ["vendored"] }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
serde_json = { version = "1", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
