[package]
name = "barracuda-vm-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that owns the Lua VM Component"

[dependencies]
barracuda-plugin-api.workspace = true
barracuda-plugin-manager.workspace = true
barracuda-vm-builtin-packages.workspace = true
barracuda-vm-component = { workspace = true, features = ["vendored"] }
barracuda-vm-package-api.workspace = true
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-lua = { workspace = true, features = ["vendored"] }
barracuda-platform-test.workspace = true
barracuda-event-router.workspace = true
critical-section = { version = "1", features = ["std"] }
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
