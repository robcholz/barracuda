[package]
name = "barracuda-vm-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that owns the Lua VM Component"

[dependencies]
barracuda-plugin-api = { path = "../../../../core/plugin/crates/api" }
barracuda-plugin-manager = { path = "../../../../core/plugin/crates/manager" }
barracuda-vm-builtin-packages = { path = "../builtin-packages" }
barracuda-vm-component = { path = "../component", features = ["vendored"] }
barracuda-vm-package-api = { path = "../package-api" }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-lua = { path = "../lua", features = ["vendored"] }
barracuda-platform-test = { path = "../../../../platforms/test" }
barracuda-event-router = { path = "../../../../core/event-router" }
critical-section = { version = "1", features = ["std"] }
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
