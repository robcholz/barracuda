[package]
name = "barracuda-vm-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lua-backed script VM capability for Barracuda"
license = "Apache-2.0"

[features]
default = []
vendored = [
    "barracuda-lua/vendored",
    "barracuda-vm-builtin-packages/vendored",
]

[dependencies]
barracuda-lua = { path = "../lua" }
barracuda-vm-builtin-packages = { path = "../builtin-packages" }
barracuda-vm-package-api = { path = "../package-api" }
barracuda-workflow-plugin.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embedded-alloc = { version = "0.7", default-features = false, features = ["tlsf"] }
getset = "0.1"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-lua = { path = "../lua", features = ["vendored"] }
critical-section = { version = "1", features = ["std"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
