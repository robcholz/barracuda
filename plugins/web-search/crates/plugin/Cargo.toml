[package]
name = "barracuda-web-search-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Web Search Plugin backed by Tavily"
license = "Apache-2.0"

[dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-plugin-api = { path = "../../../../core/plugin/crates/api" }
barracuda-plugin-manager = { path = "../../../../core/plugin/crates/manager" }
barracuda-webserver-plugin = { path = "../../../webserver/crates/plugin" }
embassy-futures.workspace = true
embedded-io-async = "0.7"
http-client = { path = "../../../../shared/http-client" }
log.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
