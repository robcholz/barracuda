[package]
name = "barracuda-web-search-plugin"
version = "0.1.0"
edition = "2024"
description = "Barracuda Web Search Plugin backed by Tavily"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-plugin-api = { path = "../../../../core/plugin-api" }
barracuda-plugin-manager = { path = "../../../../core/plugin-manager" }
barracuda-web-search-wire = { path = "../wire" }
barracuda-webserver-plugin = { path = "../../../webserver/crates/plugin" }
embedded-io = "0.7"
embedded-io-async = "0.7"
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
http-client = { path = "../../../../shared/http-client" }
log.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[build-dependencies]
barracuda-event-router = { path = "../../../../core/event-router", features = ["schema"] }
barracuda-web-search-wire = { path = "../wire", features = ["schema"] }

[dev-dependencies]
barracuda-platform-test = { path = "../../../../platforms/test" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
