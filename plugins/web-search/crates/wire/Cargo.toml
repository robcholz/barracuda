[package]
name = "barracuda-web-search-wire"
version = "0.1.0"
edition = "2024"
description = "Fixed-layout RPC wire types for the Barracuda Web Search Plugin"
license = "Apache-2.0"

[features]
default = []
schema = ["dep:schemars", "barracuda-rpc-schema"]

[dependencies]
barracuda-rpc = { path = "../../../../core/event-router/crates/rpc" }
barracuda-rpc-schema = { path = "../../../../core/event-router/crates/rpc-schema", optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
