[package]
name = "barracuda-webserver-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that provides the portable WebServer capability"

[dependencies]
async-channel = { version = "2", default-features = false }
barracuda-bulk-memory.workspace = true
barracuda-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-net.workspace = true
embassy-sync.workspace = true
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
log.workspace = true
picoserve = { version = "0.19.0", default-features = false, features = ["alloc", "embassy", "ws"] }
thiserror = { version = "2", default-features = false }
smallbox = { version = "0.8.8", default-features = false }

[dev-dependencies]
barracuda-platform-test.workspace = true
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embedded-io-async = "0.7"
futures-lite = "2"
allocation-counter = "0.8"
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }

[lints.rust]
# smallbox!'s upstream implementation contains an explicit allow(unsafe_code).
# Keep handwritten unsafe denied while permitting that dependency macro.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
