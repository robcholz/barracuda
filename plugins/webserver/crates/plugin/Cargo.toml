[package]
name = "barracuda-webserver-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that provides the portable WebServer capability"

[features]
default = []
embassy = ["dep:embassy-net", "picoserve/embassy"]
tokio = [
    "dep:barracuda-net",
    "barracuda-net/tokio",
    "picoserve/std",
    "dep:tokio",
]

[dependencies]
async-channel = { version = "2", default-features = false }
barracuda-event-router = { path = "../../../../core/event-router" }
barracuda-net = { path = "../../../../shared/net", optional = true }
barracuda-plugin-manager = { path = "../../../../core/plugin-manager" }
embassy-net = { version = "0.9.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "tcp"], optional = true }
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
picoserve = { version = "0.19.0", default-features = false, features = ["alloc", "ws"] }
thiserror = { version = "2", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "net", "time"], optional = true }

[dev-dependencies]
ekv = { version = "1", features = ["std"] }
futures-lite = "2"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
