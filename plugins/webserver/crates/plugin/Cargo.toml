[package]
name = "barracuda-webserver-plugin"
version = "0.1.0"
edition = "2021"
description = "Barracuda Plugin that provides the portable WebServer capability"

[dependencies]
async-channel = { version = "2", default-features = false }
barracuda-plugin.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-net.workspace = true
embassy-time.workspace = true
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
log.workspace = true
picoserve = { version = "0.19.0", default-features = false, features = ["alloc", "embassy", "ws"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
barracuda-event-router.workspace = true
barracuda-platform-test.workspace = true
embassy-executor = { workspace = true, features = ["arch-std", "executor-thread"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-64"] }
embedded-io-async = "0.7"
futures-lite = "2"
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
