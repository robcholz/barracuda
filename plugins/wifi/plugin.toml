id = "wifi"
depends-on = ["webserver", "captive-portal"]
description = "Owns Wi-Fi AP and station lifecycle, persistence, and configuration."

# Takes `PluginContext::wifi`, so the firmware builds the Platform's radio.
[platform]
wifi = true

[tasks.build]
cwd = "."
command = ["bun", "../../tools/web/build.ts"]
inputs = ["resources/web/entry.ts", "resources/web/figure.js", "resources/web/icon.svg", "../../package.json", "../../bun.lock", "../captive-portal/resources/web/ui", "../../ui", "../../tools/web/build.ts"]
outputs = ["filesystem/resources/entry.js", "filesystem/resources/figure.js", "filesystem/resources/icon.svg"]
