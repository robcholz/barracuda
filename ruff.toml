# Shared Ruff config for all Python in the root uv workspace. This is the single
# source of truth: workspace members inherit it because Ruff walks up the
# filesystem for config, and member pyproject.toml files intentionally have no
# [tool.ruff] section. Keep it that way so formatting stays identical.

target-version = "py311"
line-length = 88

[format]
# Match the repo-wide `double-quote-string-fixer` pre-commit hook (single quotes
# for code; docstrings stay triple-double per PEP 257).
quote-style = "single"
