[package]
name = "barracuda-bulk-memory"
version = "0.1.0"
edition = "2024"
description = "POD-only containers backed by Platform-selected bulk memory"
license = "Apache-2.0"

[dependencies]
allocator-api2 = { version = "0.3.1", default-features = false, features = ["alloc"] }
bytemuck = { version = "1.25.2", default-features = false }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
