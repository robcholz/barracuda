[package]
name = "http-client"
version = "0.1.0"
edition = "2021"
description = "Shared no_std async HTTP client for Barracuda subsystems"
license = "Apache-2.0"

[lib]
name = "http_client"

[features]
default = []
embedded-tls = ["reqwless/embedded-tls"]
mbedtls = ["reqwless/mbedtls-rs"]

[dependencies]
embassy-net.workspace = true
embedded-nal-async = "0.9"
reqwless = { git = "https://github.com/drogue-iot/reqwless.git", rev = "b761705cc654e6f31bc064183e219aa09b33968a", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
