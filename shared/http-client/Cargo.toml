[package]
name = "http-client"
version = "0.1.0"
edition = "2021"
description = "Shared no_std async HTTP client for Barracuda subsystems"
license = "Apache-2.0"

[lib]
name = "http_client"

[features]
default = []
mbedtls = ["dep:barracuda-tls", "reqwless/mbedtls-rs"]

[dependencies]
barracuda-tls = { workspace = true, optional = true }
embassy-net.workspace = true
embassy-time.workspace = true
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
static_cell.workspace = true
reqwless = { git = "https://github.com/drogue-iot/reqwless.git", rev = "b761705cc654e6f31bc064183e219aa09b33968a", default-features = false }

[dev-dependencies]
embedded-io-async = "0.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
