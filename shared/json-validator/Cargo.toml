[package]
name = "json-validator"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Static no_std JSON Schema subset validator"

[lib]
crate-type = ["rlib"]

[dependencies]
json-validator-macros.workspace = true
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
arithmetic_side_effects = "deny"
