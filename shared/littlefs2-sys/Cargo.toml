[package]
name = "littlefs2-sys"
version = "0.4.0"
edition = "2018"
description = "Low-level bindings to littlefs with a reproducible WASI artifact"
license = "BSD-3-Clause"
repository = "https://github.com/nickray/littlefs2-sys"
build = "build.rs"

[build-dependencies]
bindgen = { version = "0.70.1", default-features = false, features = ["runtime"] }
cc = "1"

[features]
assertions = []
malloc = []
multiversion = []
software-intrinsics = []
tinyrlibc = []
trace = []
unstable-littlefs-patched = []
