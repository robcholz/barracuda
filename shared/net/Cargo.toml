[package]
name = "barracuda-net"
version = "0.1.0"
edition = "2021"
description = "embedded-nal-async platform and test adapters for barracuda"

[features]
default = []
testing = []
tokio = ["dep:tokio", "embedded-io/std"]

[dependencies]
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
tokio = { version = "1.52.3", default-features = false, features = ["net", "io-util"], optional = true }

[lints.rust]
unsafe_code = "forbid"
