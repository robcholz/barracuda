[package]
name = "barracuda-profile"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Shared profiling utilities and heap metrics for Barracuda workloads"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3.3", optional = true }
