[package]
name = "barracuda-runtime-utils"
authors = ["Finn(Ziheng) Sheng"]
version = "0.1.0"
edition = "2021"
description = "Shared utilities: cancellation, yield streams, and prefixed ids"

[lib]
name = "barracuda_runtime_utils"
crate-type = ["rlib"]

[dependencies]
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
futures-lite = "2"
