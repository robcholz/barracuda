[package]
name = "barracuda-tls"
version = "0.1.0"
edition = "2021"
description = "TLS client engine and trust roots shared by every Barracuda Platform"

[features]
# ESP32-P4 compiles mbedTLS's C sources with Espressif's RISC-V GCC.
force-esp-riscv-gcc = ["mbedtls-rs/force-esp-riscv-gcc"]

[dependencies]
barracuda-platform.workspace = true
log.workspace = true
mbedtls-rs = { version = "0.1.0", default-features = false }
rand_core = "0.10.0-rc-2"
thiserror = { version = "2", default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
mbedtls-rs = { version = "0.1.0", default-features = false, features = ["pem-parse", "std"] }

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
