[package]
name = "barracuda-tls"
version = "0.1.0"
edition = "2021"
description = "TLS client engine and compact trust-root bundle shared by every Barracuda Platform"

[features]
# The 4 KiB outgoing record buffer below is not the prebuilt device libraries'
# configuration, so every device Platform compiles mbedTLS's C sources and
# selects the compiler for its chip with one of these.
# ESP32-P4, ESP32-C3 and ESP32-C6: Espressif's RISC-V GCC.
force-esp-riscv-gcc = ["mbedtls-rs/force-esp-riscv-gcc"]
# ESP32 and ESP32-S3: the chip's Xtensa GCC instead of a Clang without Xtensa.
use-gcc = ["mbedtls-rs/use-gcc"]

[dependencies]
barracuda-bulk-memory.workspace = true
barracuda-platform.workspace = true
log.workspace = true
# `tls` is the feature set of the prebuilt device libraries (RSA, ECDSA, TLS 1.2
# and 1.3). Outgoing records are capped at 4 KiB, which saves 12 KiB per idle
# session and 28 KiB at the handshake peak; incoming records stay 16 KiB because
# servers send full-size records (`tests/session_memory.rs`).
mbedtls-rs = { version = "0.1.0", default-features = false, features = [
    "tls",
    "ssl-out-content-len-4096",
] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
allocator-api2 = { version = "0.3.1", default-features = false, features = ["alloc"] }
critical-section = { version = "1", features = ["std"] }
embedded-io-async = "0.7"

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
