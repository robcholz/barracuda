[package]
name = "barracuda-vfs-littlefs"
version = "0.1.0"
edition = "2021"
description = "LittleFS backend for the Barracuda VFS"

[lib]
crate-type = ["rlib"]

[dependencies]
portable-atomic-util.workspace = true
barracuda-vfs.workspace = true
embedded-io-async = "0.7"
embedded-storage = "0.3"
generic-array = "0.14"
littlefs2 = { version = "0.8", default-features = false, features = ["alloc", "c-stubs"] }
# Enables littlefs2's logger atomics on targets without native atomic CAS.
delog = { version = "0.1", features = ["portable-atomic"] }
spin = { version = "0.10", default-features = false, features = ["portable_atomic", "mutex", "spin_mutex"] }

# Bare-metal targets link no C library; littlefs2-sys supplies the string
# functions `lfs.c` calls.
[target.'cfg(target_os = "none")'.dependencies]
littlefs2-sys = { version = "0.4", features = ["tinyrlibc"] }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
embassy-futures.workspace = true
typenum = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
