[package]
name = "barracuda-build"
version = "0.1.0"
edition = "2021"
description = "Board-selected Barracuda build driver"

[dependencies]
barracuda-board-config.workspace = true
barracuda-platform-config.workspace = true
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
