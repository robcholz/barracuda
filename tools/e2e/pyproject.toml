[project]
name = "barracuda-e2e"
version = "0.1.0"
description = "Record/replay end-to-end harness for the host Barracuda System."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llm-tape",
]

[project.scripts]
barracuda-e2e = "barracuda_e2e.cli:main"

[tool.uv.sources]
llm-tape = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barracuda_e2e"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
