name = "Built-in Agent tools"
description = "Memory, profile, todo, skill, and tool-discovery Tools owned by the Agent runtime."

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "tool_search", arguments = {} }]

[[model.responses]]
tool_calls = [{ name = "memory_store", arguments = { content = "The user prefers green tea.", tags = ["preferences"] } }]

[[model.responses]]
tool_calls = [{ name = "memory_list", arguments = { limit = 5 } }]

[[model.responses]]
tool_calls = [{ name = "profile_replace", arguments = { document = "user_profile", content = "# User\n\nLikes green tea.\n" } }]

[[model.responses]]
tool_calls = [{ name = "profile_read", arguments = { document = "user_profile" } }]

[[model.responses]]
tool_calls = [{ name = "todo_update", arguments = { todos = [{ content = "Brew tea", status = "in_progress" }] } }]

[[model.responses]]
tool_calls = [{ name = "skill_list", arguments = {} }]

[[model.responses]]
request_contains = ["Likes green tea."]
text = "Noted your preference."

[[steps]]
send = "Remember that I like green tea."
reply_contains = ["Noted your preference."]
tool_contains = ["green tea", '{"id":"file"', "Stored memory"]

[memory]
# Host ordinary-heap peak was 235 KiB locally when this budget was set
# (CI runs about 1 KiB higher); the budget keeps at least 6 KiB of headroom.
# About 3 KiB of it is the five external channel Plugins' idle receive
# support: each channel's mode, owner-book and cursor handles, receive
# control, parked receive runtime, and receive task.
heap_high_water_max = 249856
