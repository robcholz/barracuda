name = "Conversation end called twice in one batch"
description = "Two conversation_end calls in one model response both end the turn: the engine delivers their messages together as one reply, logs a warning, and the Session accepts the next message."

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [
  { name = "conversation_end", arguments = { final_message = "First goodbye." } },
  { name = "conversation_end", arguments = { final_message = "Second goodbye." } },
]

[[model.responses]]
text = "Recovered."

[[steps]]
send = "Something out of bounds."
reply_matches = ['^First goodbye\.\n\nSecond goodbye\.$']
tool_contains = [
  'conversation_end{"final_message": "First goodbye."}Conversation ended.',
  'conversation_end{"final_message": "Second goodbye."}Conversation ended.',
]

[[steps]]
send = "Hello again."
reply_matches = ['^Recovered\.$']

[logs]
expect = ["Agent merged 2 turn-ending effects from one tool round"]
forbid = ['\bERROR\b', 'panicked at', "created session `session-2`"]
