name = "Conversation end argument errors"
description = "conversation_end with a blank, missing, or non-string final_message fails schema validation before the handler runs, so no Finish effect is emitted and the turn continues to an ordinary reply."

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "conversation_end", arguments = { final_message = "   " } }]

[[model.responses]]
request_contains = ['"content":"invalid arguments: JSON schema validation failed at $.final_message: TrimmedEmpty","is_error":true']
tool_calls = [{ name = "conversation_end", arguments = {} }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.final_message: Required']
tool_calls = [{ name = "conversation_end", arguments = { final_message = 42 } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.final_message: Type { expected: String }']
text = "I will keep helping."

[[steps]]
send = "Something out of bounds."
reply_matches = ['^I will keep helping\.$']
tool_contains = [
  'conversation_end{"final_message": "   "}invalid arguments: JSON schema validation failed at $.final_message: TrimmedEmpty',
  'conversation_end{}invalid arguments: JSON schema validation failed at $.final_message: Required',
  'conversation_end{"final_message": 42}invalid arguments: JSON schema validation failed at $.final_message: Type { expected: String }',
]
tool_errors_allowed = true
