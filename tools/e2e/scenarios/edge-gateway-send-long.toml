name = "Gateway send long and Unicode text"
description = "gateway_send delivers a 4018-byte message and a multi-byte UTF-8 message to the Web conversation intact; complete-text sends have no frame-size limit."

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "gateway" } }]

[[model.responses]]
tool_calls = [{ name = "gateway_send", arguments = { channel = "web", conversation_id = "conversation", text = "BEGIN--LONG" } }]

[[model.responses]]
tool_calls = [{ name = "gateway_send", arguments = { channel = "web", conversation_id = "conversation", text = "你好，世界 🐟 ünïcödé" } }]

[[model.responses]]
text = "Long note sent."

[[steps]]
send = "Send me a long note."
# The whole body arrives as one reply record, byte for byte.
reply_matches = ['BEGIN-LONG(?:0123456789){400}END-LONG']
reply_contains = ["你好，世界 🐟 ünïcödé", "Long note sent."]
tool_contains = ['END-LONG"}{"message_id":"web-', 'ünïcödé"}{"message_id":"web-']
