# Kept separate because the 16 KiB argument also travels through the model stream,
# transcript, WebSocket, and next model request, which may hit unrelated size limits.
name = "HTTP tool header budget"
description = "A single header value of 16 KiB passes the schema (no value limit) but exceeds the 16 KiB total header budget."

[model]
mode = "scripted"

# Case 1: 16385 header bytes exceed the 16 KiB header budget (http.rs:82-92); schema has no value limit
[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "http" } }]

[[model.responses]]
tool_calls = [{ name = "http_request", arguments = { method = "GET", url = "http://10.42.0.1:18787/_llm_tape/health", headers = [{ name = "x", value = "" }] } }]

[[model.responses]]
request_contains = ['{\"error\":\"request_too_large\"}']
text = "Case 1 checked."

[[steps]]
send = "HTTP plugin case."
reply_contains = ["Case 1 checked."]
tool_contains = ['{"error":"request_too_large"}']
tool_errors_allowed = true
