name = "Edge: memory tiers"
description = "Tag-based global/agent routing, cross-tier dedup, case-insensitive label recall, global-first listing, and updates that keep an item in its original tier."

[model]
mode = "scripted"

# `Preference` routes to the global store case-insensitively
# (plugins/agent/crates/agent/src/context_providers/long_term_memory/tier.rs:144-154).
[[model.responses]]
tool_calls = [{ name = "memory_store", arguments = { content = "Prefers metric units.", tags = ["Preference"] } }]

[[model.responses]]
tool_calls = [{ name = "memory_store", arguments = { content = "Deploy step needs sudo.", tags = ["task"] } }]

# Dedup spans both stores, so the same fact tagged for the agent tier is a
# duplicate of the global item.
[[model.responses]]
tool_calls = [{ name = "memory_store", arguments = { content = "PREFERS metric UNITS.", tags = ["task"] } }]

# Global items are listed before agent items regardless of age.
[[model.responses]]
tool_calls = [{ name = "memory_list", arguments = { limit = 1 } }]

# Label matching ignores ASCII case, as tier routing does.
[[model.responses]]
tool_calls = [{ name = "memory_recall", arguments = { labels = ["preference"] } }]

[[model.responses]]
tool_calls = [{ name = "memory_recall", arguments = { labels = ["Preference"] } }]

[[model.responses]]
tool_calls = [{ name = "memory_recall", arguments = { query = "metric", limit = 1 } }]

# Retagging an agent item with a global tag keeps its `a-` id and store.
[[model.responses]]
tool_calls = [{ name = "memory_update", arguments = { id = "a-0", tags = ["user"] } }]

# Empty labels match every item: global first, then agent newest first.
[[model.responses]]
tool_calls = [{ name = "memory_recall", arguments = { labels = [] } }]

[[model.responses]]
request_contains = [
  'Shared long-term memory topics: Preference',
  'Your long-term memory topics: user',
]
text = "Tiers checked."

[[steps]]
send = "Store a few facts in different tiers."
reply_contains = ["Tiers checked."]
tool_contains = [
  'memory_store{"content": "Prefers metric units.", "tags": ["Preference"]}Stored memory g-0.',
  'memory_store{"content": "Deploy step needs sudo.", "tags": ["task"]}Stored memory a-0.',
  'memory_store{"content": "PREFERS metric UNITS.", "tags": ["task"]}Already remembered (as g-0); nothing changed.',
  "memory_list{\"limit\": 1}All memories:\n- [g-0] (Preference) Prefers metric units.\n",
  "memory_recall{\"labels\": [\"preference\"]}Recalled memories:\n- [g-0] (Preference) Prefers metric units.\n",
  "memory_recall{\"labels\": [\"Preference\"]}Recalled memories:\n- [g-0] (Preference) Prefers metric units.\n",
  "memory_recall{\"query\": \"metric\", \"limit\": 1}Recalled memories:\n- [g-0] (Preference) Prefers metric units.\n",
  'memory_update{"id": "a-0", "tags": ["user"]}Updated memory a-0.',
  "memory_recall{\"labels\": []}Recalled memories:\n- [g-0] (Preference) Prefers metric units.\n- [a-0] (user) Deploy step needs sudo.\n",
]
