name = "Edge: memory argument validation"
description = "Schema-invalid memory Tool calls are rejected before the handler runs, store nothing, and reach the model as is_error tool results."

[model]
mode = "scripted"

# One tool round of calls that all fail argument validation in
# `Tool::classify` (plugins/agent/crates/tool/src/definition.rs:548), plus an
# unknown Tool name (plugins/agent/crates/tool/src/set.rs:711).
[[model.responses]]
request_contains = ['</mode_policy>\n\nAvailable skills:']
tool_calls = [
  { name = "memory_store", arguments = { content = "   " } },
  { name = "memory_store", arguments = { tags = ["preference"] } },
  { name = "memory_store", arguments = { content = "Valid text.", tags = ["ok", " "] } },
  { name = "memory_store", arguments = { content = 42 } },
  { name = "memory_list", arguments = { limit = 0 } },
  { name = "memory_recall", arguments = { query = "  " } },
  { name = "memory_recall", arguments = { limit = 1.5 } },
  { name = "memory_update", arguments = { content = "No id given." } },
  { name = "memory_update", arguments = { id = "a-0", content = "" } },
  { name = "memory_forget", arguments = { id = "" } },
  { name = "memory_delete", arguments = { id = "a-0" } },
]

# Nothing was stored by the rejected calls, including the call whose content
# was valid but whose second tag was blank.
[[model.responses]]
request_contains = [
  '"content":"invalid arguments: JSON schema validation failed at $.content: TrimmedEmpty","is_error":true',
  '"content":"tool not found: memory_delete","is_error":true',
]
tool_calls = [{ name = "memory_list", arguments = {} }]

[[model.responses]]
request_contains = ['"content":"No matching memories.","is_error":false']
text = "Validation checked."

[[steps]]
send = "Try some malformed memory calls."
reply_contains = ["Validation checked."]
tool_errors_allowed = true
tool_contains = [
  'memory_store{"content": "   "}invalid arguments: JSON schema validation failed at $.content: TrimmedEmpty',
  'memory_store{"tags": ["preference"]}invalid arguments: JSON schema validation failed at $.content: Required',
  'invalid arguments: JSON schema validation failed at $.tags[1]: TrimmedEmpty',
  'memory_store{"content": 42}invalid arguments: JSON schema validation failed at $.content: Type { expected: String }',
  'memory_list{"limit": 0}invalid arguments: JSON schema validation failed at $.limit: Minimum',
  'memory_recall{"query": "  "}invalid arguments: JSON schema validation failed at $.query: TrimmedEmpty',
  'memory_recall{"limit": 1.5}invalid arguments: JSON schema validation failed at $.limit: Type { expected: Integer }',
  'memory_update{"content": "No id given."}invalid arguments: JSON schema validation failed at $.id: Required',
  'memory_update{"id": "a-0", "content": ""}invalid arguments: JSON schema validation failed at $.content: TrimmedEmpty',
  'memory_forget{"id": ""}invalid arguments: JSON schema validation failed at $.id: TrimmedEmpty',
  'memory_delete{"id": "a-0"}tool not found: memory_delete',
  'memory_list{}No matching memories.',
]
