name = "Edge: profile documents"
description = "Profile reads on a fresh System, clear of an absent document, whitespace-only content, strict document ids, unicode content, and cross-turn projection."

[model]
mode = "recorded"

[[steps]]
send = 'Inspect the profile documents. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. profile_read {"document": "soul"} 2. profile_read {"document": "assistant_identity"} 3. profile_clear {"document": "user_profile"} 4. profile_read {"document": "user_profile"} 5. profile_replace {"document": "soul", "content": "  \n\t "} 6. profile_read {"document": "soul"} 7. in one single response, these 6 parallel calls together: profile_replace {"document": "USER_PROFILE", "content": "x"}; profile_read {"document": "user"}; profile_clear {"document": "identity"}; profile_replace {"document": "user_profile"}; profile_read {"document": 5}; profile_read {}. Then reply with only: Profile edge cases done.'
reply_contains = ['Profile edge cases done.']
tool_contains = ['profile_read{"document": "soul"}Profile document soul does not exist.', 'profile_read{"document": "assistant_identity"}Profile document assistant_identity does not exist.', 'profile_clear{"document": "user_profile"}Cleared profile document user_profile.', 'profile_read{"document": "user_profile"}Profile document user_profile is empty.', 'Replaced profile document soul.', 'profile_read{"document": "soul"}Profile document soul is empty.', '"document": "USER_PROFILE"}invalid arguments: JSON schema validation failed at $.document: Enum', 'profile_read{"document": "user"}invalid arguments: JSON schema validation failed at $.document: Enum', 'profile_clear{"document": "identity"}invalid arguments: JSON schema validation failed at $.document: Enum', 'profile_replace{"document": "user_profile"}invalid arguments: JSON schema validation failed at $.content: Required', 'profile_read{}invalid arguments: JSON schema validation failed at $.document: Required']
request_contains = ['</mode_policy>\n\nAvailable skills:', '</mode_policy>\n\nAvailable skills:', '"content":"invalid arguments: JSON schema validation failed at $.document: Enum","is_error":true']
tool_errors_allowed = true

[[steps]]
send = 'My name is Zoë. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. profile_replace {"document": "user_profile", "content": "Name: Zoë 🦀\nTimezone: UTC+1"} 2. profile_read {"document": "user_profile"}. Then reply with only: Profile saved.'
reply_contains = ['Profile saved.']
tool_contains = ['Replaced profile document user_profile.', "profile_read{\"document\": \"user_profile\"}Profile document user_profile:\nName: Zoë 🦀\nTimezone: UTC+1"]
request_contains = ['</mode_policy>\n\nName: Zoë 🦀\nTimezone: UTC+1']

[[steps]]
send = 'Forget my profile. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. profile_clear {"document": "user_profile"}. Then reply with only: Profile cleared.'
reply_contains = ['Profile cleared.']
tool_contains = ['profile_clear{"document": "user_profile"}Cleared profile document user_profile.']
request_contains = ['</mode_policy>\n\nName: Zoë 🦀\nTimezone: UTC+1', '</mode_policy>\n\nAvailable skills:']
