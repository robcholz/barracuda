name = "Edge: skill catalog reload"
description = "Malformed SKILL.md packages are left out of the catalog and reported by skill_reload without hiding the other skills; directories without SKILL.md are skipped; a deleted skill stays stale until reload and then disappears."

[model]
mode = "recorded"

[[steps]]
send = 'Install alpha. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. tool_load {"group_id": "file"} 2. file_write {"path": "/workspace/media/skills/alpha/SKILL.md", "content": "---\nname: alpha\ndescription: Use alpha for edge tests.\n---\n\n# Alpha\n\nAlpha body.\n"} 3. file_write {"path": "/workspace/media/skills/alpha/notes.txt", "content": "alpha notes"} 4. file_write {"path": "/workspace/media/skills/no-manifest/readme.txt", "content": "not a skill"} 5. file_write {"path": "/workspace/media/skills/loose.md", "content": "---\nname: loose\ndescription: Loose file.\n---\n"} 6. skill_reload {} 7. skill_list {}. Then reply with only: Catalog ready.'
reply_contains = ['Catalog ready.']
tool_contains = ['Skills refreshed. Use skill_list to inspect the catalog.', 'skill_list{}[{"name":"alpha","description":"Use alpha for edge tests."}]']

[[steps]]
send = 'Try installing a broken beta skill. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. file_write {"path": "/workspace/media/skills/beta/SKILL.md", "overwrite": true, "content": "name: beta\ndescription: Beta.\n"} 2. skill_reload {} 3. file_write {"path": "/workspace/media/skills/beta/SKILL.md", "overwrite": true, "content": "---\nname: beta\ndescription: Beta.\n"} 4. skill_reload {} 5. file_write {"path": "/workspace/media/skills/beta/SKILL.md", "overwrite": true, "content": "---\nname: gamma\ndescription: Beta.\n---\nbody\n"} 6. skill_reload {} 7. file_write {"path": "/workspace/media/skills/beta/SKILL.md", "overwrite": true, "content": "---\nname: beta\n---\nbody\n"} 8. skill_reload {} 9. file_write {"path": "/workspace/media/skills/beta/SKILL.md", "overwrite": true, "content": "---\nname: beta\nname: beta\ndescription: Beta.\n---\nbody\n"} 10. skill_reload {} 11. file_write {"path": "/workspace/media/skills/beta/SKILL.md", "overwrite": true, "content": "---\n{\"name\": \"beta\", \"description\": \"Beta.\"}\n---\nbody\n"} 12. skill_reload {} 13. skill_list {} 14. file_delete {"path": "/workspace/media/skills/beta/SKILL.md"}. Then reply with only: Rejected the broken beta skill.'
reply_contains = ['Rejected the broken beta skill.']
tool_contains = ["skill_reload{}Skills refreshed. Use skill_list to inspect the catalog.\nThese skill packages were left out:", 'skill_list{}[{"name":"alpha","description":"Use alpha for edge tests."}]']
request_contains = ['- alpha: Use alpha for edge tests.']

[[steps]]
send = 'Try a badly named skill, then clean up. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. file_write {"path": "/workspace/media/skills/bad--name/SKILL.md", "content": "---\nname: bad--name\ndescription: Bad name.\n---\nbody\n"} 2. skill_reload {} 3. file_delete {"path": "/workspace/media/skills/bad--name/SKILL.md"} 4. skill_reload {} 5. skill_list {}. Then reply with only: Catalog recovered.'
reply_contains = ['Catalog recovered.']
tool_contains = ["skill_reload{}Skills refreshed. Use skill_list to inspect the catalog.\nThese skill packages were left out:", 'skill_reload{}Skills refreshed. Use skill_list to inspect the catalog.', 'skill_list{}[{"name":"alpha","description":"Use alpha for edge tests."}]']

[[steps]]
send = 'Delete alpha. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. file_delete {"path": "/workspace/media/skills/alpha/SKILL.md"} 2. skill_read {"name": "alpha"} 3. skill_resource_read {"name": "alpha", "path": "notes.txt"} 4. skill_reload {} 5. skill_list {} 6. in one single response, these 2 parallel calls together: skill_read {"name": "alpha"}; skill_resource_read {"name": "alpha", "path": "notes.txt"}. Then reply with only: Alpha is gone.'
reply_contains = ['Alpha is gone.']
tool_contains = ["Could not read skill \"alpha\": failed to read skill 'alpha': path not found", '{"name":"alpha","path":"notes.txt","content":"alpha notes","offset":0,"bytes":11,"next_offset":null}', 'skill_reload{}Skills refreshed. Use skill_list to inspect the catalog.', 'skill_list{}[]', 'tool invocation rejected: unknown skill "alpha"; call skill_list to see what is available.']

[logs]
expect = ["skill package left out of the catalog: skill 'beta' is missing the opening '---' frontmatter fence", "skill package left out of the catalog: skill 'beta' has invalid frontmatter: frontmatter name 'gamma' must match the skill directory name", "skill package left out of the catalog: skill 'beta' has invalid frontmatter: missing description", "skill package left out of the catalog: skill 'beta' has invalid YAML frontmatter: duplicate field 'name'", "skill package left out of the catalog: skill 'beta' has invalid YAML frontmatter: JSON object frontmatter is not accepted", "skill package left out of the catalog: skill 'bad--name' has invalid frontmatter: name must be 1-64 lowercase ASCII letters"]
