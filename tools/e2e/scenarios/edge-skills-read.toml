name = "Edge: skill read and resource errors"
description = "Unknown skills, schema bounds, resource path containment, UTF-8 paging, missing and non-file resources, and range bounds for skill_read and skill_resource_read."

[model]
mode = "recorded"

[[steps]]
send = 'Probe the empty skill catalog. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. skill_read {"name": "ghost"} 2. in one single response, these 2 parallel calls together: skill_resource_read {"name": "ghost", "path": "notes.txt"}; skill_resource_read {"name": "ghost", "path": "../escape.txt"} 3. in one single response, these 4 parallel calls together: skill_resource_read {"name": "ghost", "path": "notes.txt", "limit": 3}; skill_resource_read {"name": "ghost", "path": "notes.txt", "limit": 16385}; skill_resource_read {"name": "ghost", "path": "notes.txt", "mode": "raw"}; skill_read {"name": "   "}. Then reply with only: Nothing is installed yet.'
reply_contains = ['Nothing is installed yet.']
tool_contains = ['tool invocation rejected: unknown skill "ghost"; call skill_list to see what is available.', "Could not read resource for skill \"ghost\": invalid resource path '../escape.txt' for skill 'ghost'", 'invalid arguments: JSON schema validation failed at $.limit: Minimum', 'invalid arguments: JSON schema validation failed at $.limit: Maximum', 'invalid arguments: JSON schema validation failed at $.mode: AdditionalProperty', 'invalid arguments: JSON schema validation failed at $.name: TrimmedEmpty']
tool_errors_allowed = true

[[steps]]
send = 'Install the alpha skill. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. tool_load {"group_id": "file"} 2. file_write {"path": "/workspace/media/skills/alpha/SKILL.md", "content": "---\nname: alpha\ndescription: Use alpha for edge tests.\n---\n\n# Alpha\n\nRead notes.txt.\n"} 3. file_write {"path": "/workspace/media/skills/alpha/notes.txt", "content": "abcé"} 4. file_write {"path": "/workspace/media/skills/alpha/refs/guide.md", "content": "guide"} 5. skill_reload {} 6. skill_list {} 7. skill_read {"name": " alpha "}. Then reply with only: Alpha is installed.'
reply_contains = ['Alpha is installed.']
tool_contains = ['Skills refreshed. Use skill_list to inspect the catalog.', '[{"name":"alpha","description":"Use alpha for edge tests."}]', '# Alpha', 'Read notes.txt.']
request_contains = ['- alpha: Use alpha for edge tests.']

[[steps]]
send = 'Page through the alpha notes. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. skill_resource_read {"name": "alpha", "path": "notes.txt"} 2. skill_resource_read {"name": "alpha", "path": "notes.txt", "offset": 0, "limit": 4} 3. skill_resource_read {"name": "alpha", "path": "notes.txt", "offset": 3, "limit": 4} 4. skill_resource_read {"name": "alpha", "path": "notes.txt", "offset": 4, "limit": 4} 5. skill_resource_read {"name": "alpha", "path": "notes.txt", "offset": 5} 6. skill_resource_read {"name": "alpha", "path": "notes.txt", "offset": 6}. Then reply with only: Paged the notes.'
reply_contains = ['Paged the notes.']
tool_contains = ['{"name":"alpha","path":"notes.txt","content":"abcé","offset":0,"bytes":5,"next_offset":null}', '"content":"abc","offset":0,"bytes":3,"next_offset":3}', '"content":"é","offset":3,"bytes":2,"next_offset":null}', "Could not read resource for skill \"alpha\": skill 'alpha' resource 'notes.txt' is not valid UTF-8 in the requested range", '"content":"","offset":5,"bytes":0,"next_offset":null}', "Could not read resource for skill \"alpha\": resource offset 6 exceeds length 5 for skill 'alpha' path 'notes.txt'"]
request_contains = ['- alpha: Use alpha for edge tests.']

[[steps]]
send = 'Try odd resource paths. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. in one single response, these 5 parallel calls together: skill_resource_read {"name": "alpha", "path": "../alpha/notes.txt"}; skill_resource_read {"name": "alpha", "path": "/workspace/media/skills/alpha/notes.txt"}; skill_resource_read {"name": "alpha", "path": "refs/../notes.txt"}; skill_resource_read {"name": "alpha", "path": "./notes.txt"}; skill_resource_read {"name": "alpha", "path": "refs//guide.md"} 2. skill_resource_read {"name": "alpha", "path": "refs/guide.md"} 3. skill_resource_read {"name": "alpha", "path": "missing.txt"} 4. skill_resource_read {"name": "alpha", "path": "refs"} 5. skill_resource_read {"name": "alpha", "path": "SKILL.md", "limit": 16}. Then reply with only: Checked resource paths.'
reply_contains = ['Checked resource paths.']
tool_contains = ["invalid resource path '../alpha/notes.txt' for skill 'alpha'", "invalid resource path '/workspace/media/skills/alpha/notes.txt' for skill 'alpha'", "invalid resource path 'refs/../notes.txt' for skill 'alpha'", "invalid resource path './notes.txt' for skill 'alpha'", "invalid resource path 'refs//guide.md' for skill 'alpha'", '{"name":"alpha","path":"refs/guide.md","content":"guide","offset":0,"bytes":5,"next_offset":null}', "Could not read resource for skill \"alpha\": failed to read skill 'alpha' resource 'missing.txt': ", 'path not found', "Could not read resource for skill \"alpha\": skill 'alpha' resource 'refs' is not a regular file", '"path":"SKILL.md","content":"---\nname: alpha\n","offset":0,"bytes":16,"next_offset":16}']
