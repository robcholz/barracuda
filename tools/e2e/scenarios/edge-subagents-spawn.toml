name = "Edge: background subagent delivery"
description = "subagent_spawn returns its acceptance at once; the background result is delivered back to the root, after which the child is gone from list, watch, interrupt, and delete (twice)."

[model]
mode = "scripted"

# The replay tape is served strictly in arrival order. After subagent_spawn the
# root's continuation and the child's first call run concurrently, so calls 1
# and 2 carry IDENTICAL text: whichever agent arrives first, both end with the
# same reply. The text is long (~1799 chars, one SSE frame per 16 chars,
# 2 ms apart) so the child cannot finish and deliver before the root has begun
# its continuation iteration. The completion then forces exactly one more root
# model call, either as a continuation (driver.rs:205-207) or as a background
# turn (instance.rs:452-463): call 3.

# call 0 (root)
[[model.responses]]
tool_calls = [{ name = "subagent_spawn", arguments = { kind = "worker", name = "bg", goal = "Reply with the done text.", timeout_ms = 60000 } }]

# calls 1 and 2 (root continuation / child, in either order)
[[model.responses]]
text = "done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done"

[[model.responses]]
text = "done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done done"

# call 3 (root): instance.rs render_notifications + model.rs:77-83 result.
[[model.responses]]
request_contains = [
  '[background:completed]\nid: 1\ntool: subagent_spawn',
  "[subagent] id: agent-2, result: true, message: done done done",
]
text = "Background job delivered."

[[steps]]
send = "Start a background job."
reply_contains = ["done done done"]
tool_contains = ["Subagent agent-2 named 'bg' started with a 60000 ms timeout; its result will be delivered automatically."]

# ---- Step 1: the delivered child has left the subtree -----------------------
# multiagent.rs:862-869 removes the child once the parent acknowledges delivery.

[[model.responses]]
tool_calls = [{ name = "subagent_list", arguments = {} }]

[[model.responses]]
tool_calls = [
  { name = "subagent_watch", arguments = { agent = "agent-2" } },
  { name = "subagent_interrupt", arguments = { agent = "agent-2", message = "again" } },
  { name = "subagent_delete", arguments = { agent = "agent-2" } },
]

# Deleting the same id a second time takes the same pre-check (delete.rs:34-41).
[[model.responses]]
tool_calls = [{ name = "subagent_delete", arguments = { agent = "agent-2" } }]

[[model.responses]]
text = "The background child is gone."

[[steps]]
send = "Inspect the finished background job."
reply_contains = ["The background child is gone."]
tool_contains = [
  'subagent_list{}{"subagents":[]}',
  "No subagent agent-2 in your subtree (unknown id, or not one of yours).",
  "Cannot interrupt agent-2: it is not a subagent in your subtree.",
  "Cannot delete agent-2: it is not a subagent in your subtree.",
]
