name = "Tool load timing"
description = "A Tool called in the same model response as the tool_load that reveals it is not found; it becomes callable on the next model call of the same turn, a repeated load reports already_loaded, and the group stays loaded for the next user turn."

[model]
mode = "scripted"

# Calls in one response are classified against the ToolSet projection taken
# before tool_load ran, so gateway_send is still hidden.
[[model.responses]]
tool_calls = [
  { name = "tool_load", arguments = { group_id = "gateway" } },
  { name = "gateway_send", arguments = { channel = "web", conversation_id = "conversation", text = "Too early." } },
]

# The next iteration's ToolSet::begin applies the pending load and the group's
# usage is added to the system prompt.
[[model.responses]]
request_contains = [
  '"content":"tool not found: gateway_send","is_error":true',
  'Use `gateway_send` for one complete text message.',
]
tool_calls = [{ name = "gateway_send", arguments = { channel = "web", conversation_id = "conversation", text = "Now loaded." } }]

# The loaded group has left the loadable catalog.
[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "gateway" } }]

[[model.responses]]
request_contains = ['"content":"{\"already_loaded\":true,\"group_id\":\"gateway\",\"loaded\":true}","is_error":false']
text = "Loaded once."

# Next user turn: no tool_load needed.
[[model.responses]]
tool_calls = [{ name = "gateway_send", arguments = { channel = "web", conversation_id = "conversation", text = "Still loaded." } }]

[[model.responses]]
text = "Done again."

[[steps]]
send = "Load the gateway and send a note."
reply_contains = ["Now loaded.", "Loaded once."]
reply_matches = ['(?s)^(?!.*Too early)']
tool_contains = [
  'tool_load{"group_id": "gateway"}{"available_next_turn":true,"group_id":"gateway","loaded":true}',
  'gateway_send{"channel": "web", "conversation_id": "conversation", "text": "Too early."}tool not found: gateway_send',
  '"text": "Now loaded."}{"message_id":"web-',
  'tool_load{"group_id": "gateway"}{"already_loaded":true,"group_id":"gateway","loaded":true}',
]
tool_errors_allowed = true

[[steps]]
send = "Send another note."
reply_contains = ["Still loaded.", "Done again."]
tool_contains = ['"text": "Still loaded."}{"message_id":"web-']
