name = "VM output limits (3)"
description = "A run may emit exactly 1024 lines; a 1025th line, an unterminated line after 1024, or more than 64 KiB of output fails the run with lua_runtime and keeps only the output accepted so far."

# Each script first spends about 500 ms in an empty loop (instruction-hook
# yields of 100 ms each) so its completion always arrives after the reply that
# ends the turn, costing exactly one background-turn model call.

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "vm" } }]

# Step 0: exactly MAX_OUTPUT_LINES_PER_RUN lines succeed.
[[model.responses]]
tool_calls = [{ name = "vm_run", arguments = { source = "for _ = 1, 50000 do end for i = 1, 1024 do print('t' .. i) end io.write('tail')" } }]

[[model.responses]]
text = "The tail script is running."

[[model.responses]]
request_contains = ['{\"run_id\":1,\"outcome\":\"error\",\"output\":[\"t1\",', '\"t1024\"],\"error\":\"lua_runtime\",\"diagnostic\":\"Lua output limit exceeded\"}']
text = "The trailing partial line was rejected."

# Step 3: more than MAX_OUTPUT_BYTES_PER_RUN (64 KiB) fails; the oversized
# chunk is dropped and earlier complete lines are kept.
[[steps]]
send = "Print 1024 lines and a partial line."
reply_contains = ["The trailing partial line was rejected."]
tool_contains = ['{"run_id":1}']

[logs]
expect = [
    "VM run 1 failed: Some\\(LuaRuntime\\) Lua output limit exceeded",
]
