name = "Web search argument schema (1)"
description = "web_search rejects malformed arguments at the schema; a schema-valid call without a provider key reports not_configured."

[model]
mode = "recorded"

[[steps]]
send = 'Search schema case. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. tool_load {"group_id": "websearch"} 2. web_search {"query": "", "max_results": 3}. Then reply with only: Case 1 checked.'
reply_contains = ['Case 1 checked.']
tool_contains = ['invalid arguments: JSON schema validation failed at $.query: MinLength']
request_contains = ['invalid arguments: JSON schema validation failed at $.query: MinLength']
tool_errors_allowed = true

