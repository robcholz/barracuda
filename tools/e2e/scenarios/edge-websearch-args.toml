# Schema: plugins/agent-websearch/crates/plugin/resources/tools/web_search/schema.json.
# Error text: shared/json-validator/src/lib.rs:820 via plugins/agent/crates/tool/src/definition.rs:321.
name = "Web search argument schema (1)"
description = "web_search rejects malformed arguments at the schema; a schema-valid call without a provider key reports not_configured."

[model]
mode = "scripted"

# Case 1: empty query fails minLength before trimmedNonEmpty
[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "websearch" } }]

[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "", max_results = 3 } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.query: MinLength']
text = "Case 1 checked."

# Case 2: whitespace query fails trimmedNonEmpty
[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "   ", max_results = 3 } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.query: TrimmedEmpty']
text = "Case 2 checked."

# Case 3: 256-character query exceeds maxLength 255
[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq", max_results = 3 } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.query: MaxLength']
text = "Case 3 checked."

# Case 4: max_results 0 is below minimum
[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "barracuda", max_results = 0 } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.max_results: Minimum']
text = "Case 4 checked."

# Case 5: max_results 11 is above maximum
[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "barracuda", max_results = 11 } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.max_results: Maximum']
text = "Case 5 checked."

# Case 6: fractional max_results is not an integer
[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "barracuda", max_results = 2.5 } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.max_results: Type { expected: Integer }']
text = "Case 6 checked."

# Case 7: string max_results is not an integer
[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "barracuda", max_results = "3" } }]

[[model.responses]]
request_contains = ['invalid arguments: JSON schema validation failed at $.max_results: Type { expected: Integer }']
text = "Case 7 checked."

# Case 8: max_results is required
