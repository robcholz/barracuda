# api_base points at a closed host port, so the search request is built and
# sent but no provider answers it.
name = "Web search configuration limits"
description = "API keys longer than 256 bytes are refused as invalid configuration, and the longest key with the longest query still fits the provider request buffer."

[model]
mode = "scripted"

# The 256-byte key plus 255 four-byte query characters fit the 2 KiB request
# buffer, so the request reaches the network and fails there.
[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "websearch" } }]

[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀", max_results = 10 } }]

[[model.responses]]
request_contains = ['{\"error\":\"transport\"}']
text = "Case 1 checked."

[[steps]]
send = "Search with a long query."
reply_contains = ["Case 1 checked."]
tool_contains = ['{"error":"transport"}']
tool_errors_allowed = true

# A key larger than one KV value is invalid input, not a storage failure.
[[http]]
method = "POST"
path = "/api/tavily"
body = "{\"api_key\": \"\"}"
status = 422
body_contains = ['{"error":"invalid_configuration"}']

