name = "Workflow load validation (2)"
description = "workflow_actions renders the static Action catalog; workflow_load rejects unknown Actions, malformed addresses, rules, topics, references, links, and control flow with stable codes; duplicate IDs, unknown or repeated unloads, and bundled Workflows are rejected; workflow_list tracks load order."

# Every rejected definition uses the never-emitted Event `e2e.never`, and the
# accepted ones never fire, so no Workflow runs during this scenario.

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "workflow" } }]

# Step 0: the Action catalog.
[[model.responses]]
tool_calls = [{ name = "workflow_load", arguments = { id = "e2e-branchy", match = { event = "e2e.never" }, steps = [{ call = "vm.run", arguments = { script = "print(1)" } }, { if = { source = "$previous.output.outcome", equals = "success" }, then = [], else = [] }] } }]

[[model.responses]]
tool_calls = [{ name = "workflow_load", arguments = { id = "e2e-typed", match = { event = "e2e.never" }, steps = [{ call = "vm.run", arguments = { source = 42 } }] } }]

[[model.responses]]
tool_calls = [{ name = "workflow_list", arguments = {} }]

[[model.responses]]
text = "Both loose definitions loaded."

[[steps]]
send = "Load a branching Workflow and a Workflow with a numeric source."
reply_contains = ["Both loose definitions loaded."]
tool_contains = [
    '"if": {"source": "$previous.output.outcome", "equals": "success"}, "then": [], "else": []}]}{}',
    '"id": "e2e-typed", "match": {"event": "e2e.never"}, "steps": [{"call": "vm.run", "arguments": {"source": 42}}]}{}',
    'workflow_list{}{"workflows":["imessage-to-agent","agent-to-imessage","e2e-branchy","e2e-typed"]}',
]
