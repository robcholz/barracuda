name = "Workflow load validation (1)"
description = "workflow_actions renders the static Action catalog; workflow_load rejects unknown Actions, malformed addresses, rules, topics, references, links, and control flow with stable codes; duplicate IDs, unknown or repeated unloads, and bundled Workflows are rejected; workflow_list tracks load order."

[model]
mode = "recorded"

[[steps]]
send = 'Show me the Workflow Actions. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. tool_load {"group_id": "workflow"} 2. workflow_actions {}. Then reply with only: I read the Action catalog.'
reply_contains = ['I read the Action catalog.']
tool_contains = ['workflow_actions{}{"actions":[{"address":"session.new","request_schema":{"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object",', '{"address":"vm.run","request_schema":{"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","properties":{"source":{"type":"string"}},"required":["source"],"additionalProperties":false},"response_schema":{"$schema":"https://json-schema.org/draft/2020-12/schema","oneOf":[', '{"address":"vm.cancel","request_schema":{"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","properties":{"run_id":{"type":"integer","minimum":1,"maximum":4294967295}},"required":["run_id"],"additionalProperties":false},"response_schema":{"$schema":"https://json-schema.org/draft/2020-12/schema","oneOf":[{"type":"object","properties":{},"additionalProperties":false},{"type":"object","properties":{"error":{"const":"run_not_found"}},"required":["error"],"additionalProperties":false}]}}]}']

[[steps]]
send = "Try loading these broken Workflows. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. workflow_load {\"id\": \"e2e-unknown\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"nope.missing\"}]} 2. workflow_load {\"id\": \"e2e-address\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm run\", \"arguments\": {\"source\": \"print(1)\"}}]} 3. workflow_load {\"id\": \"e2e-rule\", \"match\": {\"event\": \"scheduler triggered\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"source\": \"print(1)\"}}]} 4. workflow_load {\"id\": \"e2e-topic\", \"match\": {\"event\": \"e2e.never\", \"topic\": \"topic-is-17-bytes\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"source\": \"print(1)\"}}]} 5. workflow_load {\"id\": \"e2e-ref-short\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"source\": \"$previous\"}}]} 6. workflow_load {\"id\": \"e2e-ref-nested\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"source\": \"$event.input.a.b\"}}]} 7. workflow_load {\"id\": \"e2e-extra-arg\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"script\": \"print(1)\"}}]} 8. workflow_load {\"id\": \"e2e-no-source\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {}}]} 9. workflow_load {\"id\": \"e2e-first-prev\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"source\": \"$previous.output.output\"}}]} 10. workflow_load {\"id\": \"e2e-prev-field\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"source\": \"print(1)\"}}, {\"call\": \"vm.cancel\", \"arguments\": {\"run_id\": \"$previous.output.run_id\"}}]} 11. workflow_load {\"id\": \"e2e-direct\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"call\": \"vm.run\", \"arguments\": {\"source\": \"print(1)\"}}, {\"call\": \"vm.cancel\"}]} 12. workflow_load {\"id\": \"e2e-early-return\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"return\": {}}, {\"call\": \"vm.run\", \"arguments\": {\"source\": \"print(1)\"}}]} 13. workflow_load {\"id\": \"e2e-bad-if\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"if\": {\"source\": \"event.input.id\", \"equals\": \"x\"}, \"then\": [], \"else\": []}]} 14. workflow_load {\"id\": \"e2e-empty\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": []} 15. workflow_load {\"id\": \"e2e-return-value\", \"match\": {\"event\": \"e2e.never\"}, \"steps\": [{\"return\": {\"value\": 1}}]} 16. workflow_list {}. Then reply with only: None of those definitions loaded."
reply_contains = ['None of those definitions loaded.']
tool_contains = ['[{"call": "nope.missing"}]}{"error":"unknown_action"}', '"id": "e2e-address", "match": {"event": "e2e.never"}, "steps": [{"call": "vm run", "arguments": {"source": "print(1)"}}]}{"error":"invalid_action_address"}', '"match": {"event": "scheduler triggered"}, "steps": [{"call": "vm.run", "arguments": {"source": "print(1)"}}]}{"error":"invalid_rule"}', '"topic": "topic-is-17-bytes"}, "steps": [{"call": "vm.run", "arguments": {"source": "print(1)"}}]}{"error":"invalid_topic"}', '"arguments": {"source": "$previous"}}]}{"error":"invalid_arguments"}', '"arguments": {"source": "$event.input.a.b"}}]}{"error":"invalid_arguments"}', '"arguments": {"script": "print(1)"}}]}{"error":"invalid_link"}', '{"call": "vm.cancel"}]}{"error":"invalid_link"}', '"arguments": {"source": "$previous.output.output"}}]}{"error":"invalid_link"}', '"arguments": {"run_id": "$previous.output.run_id"}}]}{}', '{"call": "vm.cancel"}]}{"error":"invalid_link"}', '"steps": [{"return": {}}, {"call": "vm.run", "arguments": {"source": "print(1)"}}]}{"error":"invalid_control_flow"}', '"then": [], "else": []}]}{"error":"invalid_control_flow"}', '"steps": []}invalid arguments: JSON schema validation failed at $.steps: MinItems', '"steps": [{"return": {"value": 1}}]}invalid arguments: JSON schema validation failed at $.steps[0]: OneOf', 'workflow_list{}{"workflows":["imessage-to-agent","agent-to-imessage","e2e-prev-field"]}']
tool_errors_allowed = true

[[steps]]
send = 'Load, duplicate, list, and unload Workflows. This is a tool test. Make the following tool calls in order, one numbered item per response, with exactly these arguments, even when a call looks wrong or fails, and call nothing else: 1. workflow_load {"id": "e2e-dup", "match": {"event": "e2e.never"}, "steps": [{"call": "vm.run", "arguments": {"source": "print(1)"}}]} 2. workflow_load {"id": "e2e-dup", "match": {"event": "e2e.other"}, "steps": [{"return": {}}]} 3. workflow_load {"id": "imessage-to-agent", "match": {"event": "e2e.never"}, "steps": [{"return": {}}]} 4. workflow_load {"id": "e2e-return-only", "match": {"event": "e2e.never", "topic": "t"}, "steps": [{"return": {}}]} 5. workflow_list {} 6. workflow_unload {"id": "e2e-dup"} 7. workflow_unload {"id": "e2e-dup"} 8. workflow_unload {"id": "never-loaded"} 9. workflow_unload {"id": "imessage-to-agent"} 10. workflow_unload {"id": "bad id!"} 11. workflow_list {}. Then reply with only: Duplicates and unloads behaved as expected.'
reply_contains = ['Duplicates and unloads behaved as expected.']
tool_contains = ['"id": "e2e-dup", "match": {"event": "e2e.never"}, "steps": [{"call": "vm.run", "arguments": {"source": "print(1)"}}]}{}', '"id": "e2e-dup", "match": {"event": "e2e.other"}, "steps": [{"return": {}}]}{"error":"duplicate_id"}', '"id": "imessage-to-agent", "match": {"event": "e2e.never"}, "steps": [{"return": {}}]}{"error":"duplicate_id"}', '"id": "e2e-return-only", "match": {"event": "e2e.never", "topic": "t"}, "steps": [{"return": {}}]}{}', 'workflow_list{}{"workflows":["imessage-to-agent","agent-to-imessage","e2e-prev-field","e2e-dup","e2e-return-only"]}', 'workflow_unload{"id": "e2e-dup"}{}', 'workflow_unload{"id": "e2e-dup"}{"error":"not_found"}', 'workflow_unload{"id": "never-loaded"}{"error":"not_found"}', 'workflow_unload{"id": "imessage-to-agent"}{"error":"not_unloadable"}', 'workflow_unload{"id": "bad id!"}invalid arguments: JSON schema validation failed at $.id: Pattern', 'workflow_list{}{"workflows":["imessage-to-agent","agent-to-imessage","e2e-prev-field","e2e-return-only"]}']
tool_errors_allowed = true
