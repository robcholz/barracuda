name = "Agent sends a proactive Gateway message"
description = "gateway_send delivers an extra message to the Web conversation alongside the turn reply."

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "gateway" } }]

[[model.responses]]
tool_calls = [{ name = "gateway_send", arguments = { channel = "web", conversation_id = "conversation", text = "Proactive hello." } }]

[[model.responses]]
text = "I sent you a note."

[[steps]]
send = "Ping me."
reply_contains = ["Proactive hello.", "I sent you a note."]

[memory]
# Host ordinary-heap peak was 214 KiB locally when this budget was set
# (CI runs about 1 KiB higher); the budget keeps at least 6 KiB of headroom.
# About 3 KiB of it is the five external channel Plugins' idle receive
# support: each channel's mode, owner-book and cursor handles, receive
# control, parked receive runtime, and receive task.
heap_high_water_max = 225280
