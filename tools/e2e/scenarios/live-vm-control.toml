name = "Live VM control"
description = "A real model starts a Lua run that waits for input, lists it, feeds it input, and cancels a second run."

[model]
mode = "recorded"

[[steps]]
send = "Use vm_run to run this Lua: local line = io.read('l'); print('got ' .. line). Then call vm_list and tell me the run's state."
tool_contains = ['input_required']

[[steps]]
send = "Use vm_input to send the input hello to that run, and tell me what it printed."
reply_contains = ['got hello']

[[steps]]
send = "Use vm_run to run this Lua: local line = io.read('l'). Then cancel that run with vm_cancel and confirm it is cancelled."
tool_contains = ['"run_id"']

[logs]
await = ["VM run 1 finished", "VM run 2 finished"]
