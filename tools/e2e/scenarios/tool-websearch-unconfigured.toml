name = "Web search without a provider key"
description = "web_search reports a structured configuration error instead of failing the turn when no Tavily key is configured."

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "websearch" } }]

[[model.responses]]
tool_calls = [{ name = "web_search", arguments = { query = "barracuda", max_results = 3 } }]

[[model.responses]]
text = "Search is not configured."

[[steps]]
send = "Search the web."
reply_contains = ["Search is not configured."]
tool_contains = ['{"error":']
tool_errors_allowed = true

[memory]
# Host ordinary-heap peak was 215 KiB locally when this budget was set
# (CI runs about 1 KiB higher); the budget keeps at least 6 KiB of headroom.
# About 3 KiB of it is the five external channel Plugins' idle receive
# support: each channel's mode, owner-book and cursor handles, receive
# control, parked receive runtime, and receive task.
heap_high_water_max = 229376
