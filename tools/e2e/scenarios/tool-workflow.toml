name = "Workflow tools"
description = "The Agent inspects Workflow Actions, loads a user Workflow, lists it, and unloads it."

[model]
mode = "scripted"

[[model.responses]]
tool_calls = [{ name = "tool_load", arguments = { group_id = "workflow" } }]

[[model.responses]]
tool_calls = [{ name = "workflow_actions", arguments = {} }]

[[model.responses]]
tool_calls = [{ name = "workflow_load", arguments = { id = "e2e-flow", match = { event = "scheduler.triggered" }, steps = [{ call = "vm.run", arguments = { source = "print('scheduled')" } }] } }]

[[model.responses]]
tool_calls = [{ name = "workflow_list", arguments = {} }]

[[model.responses]]
tool_calls = [{ name = "workflow_unload", arguments = { id = "e2e-flow" } }]

[[model.responses]]
text = "The Workflow round-trip finished."

[[steps]]
send = "Manage a workflow."
reply_contains = ["The Workflow round-trip finished."]
tool_contains = ["vm.run", "e2e-flow"]

[memory]
# Host ordinary-heap peak was 240 KiB when this budget was set.
heap_high_water_max = 258048
