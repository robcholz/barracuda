name = "Lua file API"
description = "A real model runs a Lua script that checks every vm-filesystem io and os file function: open modes, read formats, seek, lines, default input and output, temporary files, rename and remove, and the path, mount, size, and open-handle limits."

[model]
mode = "recorded"

[[steps]]
send = '''Load the vm tools and call vm_run exactly once with the Lua source below, copied character for character without any change. Then reply with only the word started. Lua source: local function fails(fn, ...) local ok, r = pcall(fn, ...) return not ok or r == nil end local f = assert(io.open('/data/a.txt', 'w')) f:write('one\n', 'two\n', 42, ' 3.5 x\n') f:setvbuf('no') f:setvbuf('full', 64) assert(fails(f.setvbuf, f, 'bad')) assert(fails(f.setvbuf, f, 'no', -1)) assert(f:flush()) assert(f:close()) assert(io.type(f) == 'closed file') assert(tostring(f) == 'file (closed)') assert(fails(f.read, f)) assert(fails(f.write, {}, 'x')) f = assert(io.open('/data/a.txt', 'ab')) assert(f:write('tail')) assert(fails(f.read, f, 'l')) f:close() f = assert(io.open('/data/a.txt', 'r')) assert(io.type(f) == 'file') assert(tostring(f) == 'file') assert(f:read('l') == 'one') assert(f:read('*L') == 'two\n') assert(f:read('n') == 42) assert(f:read('*n') == 3.5) assert(f:read('n') == nil) assert(f:read(0) == '') assert(f:read(1) == '\n') local a, b = f:read('a', 'l') assert(a == 'tail' and b == nil) assert(f:read(0) == nil) assert(f:read('*a') == '') assert(fails(f.read, f, 'z')) assert(fails(f.read, f, {})) assert(fails(f.read, f, 40000)) assert(fails(f.read, f, -1)) assert(f:seek('set', 4) == 4) assert(f:read(3) == 'two') assert(f:seek() == 7) assert(f:seek('cur', -3) == 4) assert(f:seek('end') == 21) assert(fails(f.seek, f, 'bad')) assert(fails(f.seek, f, 'set', -1)) assert(fails(f.write, f, 'x')) f:close() local n = 0 for line in io.lines('/data/a.txt') do n = n + 1 end assert(n == 4) n = 0 for x, y in io.lines('/data/a.txt', 1, 'l') do n = n + 1 end assert(n == 4) f = assert(io.open('/data/a.txt')) n = 0 for line in f:lines('L') do n = n + #line end assert(n == 21) f:close() f = assert(io.open('/data/b.txt', 'w+')) f:write('abc') f:seek('set', 0) assert(f:read('a') == 'abc') f:close() f = assert(io.open('/data/b.txt', 'r+')) f:write('X') f:seek('set') assert(f:read('l') == 'Xbc') f:close() f = assert(io.open('/data/b.txt', 'a+')) f:write('d') f:seek('set', 0) assert(f:read('a') == 'Xbcd') f:close() assert(fails(io.open, '/data/b.txt', 'q')) assert(io.input('/data/b.txt')) assert(io.read('l') == 'Xbcd') for l in io.lines() do end io.input():close() assert(io.output('/data/c.txt')) io.write('out', 1) io.flush() io.close() assert(fails(io.input, '/data/missing.txt')) assert(fails(io.input, 5)) assert(fails(io.output, 5)) assert(fails(io.lines, '/data/missing.txt')) assert(fails(io.output, '/resources/x')) local t = assert(io.tmpfile()) t:write('temp') t:seek('set', 0) assert(t:read('a') == 'temp') t:close() local name = os.tmpname() assert(name:find('^/cache/')) assert(os.remove(name)) assert(os.rename('/data/c.txt', '/data/d.txt')) f = io.open('/data/d.txt') assert(f:read('a') == 'out1') f:close() assert(fails(os.rename, '/data/d.txt', '/cache/d.txt')) assert(os.remove('/data/d.txt')) assert(fails(os.remove, '/data/d.txt')) assert(fails(io.open, '/resources/new.txt', 'w')) assert(fails(io.open, '/nowhere/x', 'r')) assert(fails(io.open, string.rep('a', 1100))) assert(fails(os.rename, string.rep('a', 1100), '/data/x')) assert(fails(os.remove, string.rep('a', 1100))) local open = {} for i = 1, 20 do local ok, h = pcall(io.open, '/data/b.txt') open[i] = ok and h or false end assert(not open[17]) for i = 1, 16 do open[i]:close() end do local closing <close> = assert(io.open('/data/b.txt')) end f = assert(io.open('/data/b.txt', 'w')) assert(fails(f.write, f, string.rep('x', 40000))) f:close() print('files ok')'''
tool_contains = ['"run_id":1']

[logs]
# Every check in the script is an assert, so success means all of them held.
await = ["VM run 1 finished: Success, 1 output line"]
