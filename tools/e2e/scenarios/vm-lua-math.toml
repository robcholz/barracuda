name = "Lua math library"
description = "A real model runs a Lua script that checks every function of the Rust math library, including integer and float results, optional arguments, seeded random sequences, and argument errors."

[model]
mode = "recorded"

[[steps]]
send = '''Load the vm tools and call vm_run exactly once with the Lua source below, copied character for character without any change. Then reply with only the word started. Lua source: local function fails(fn, ...) local ok, r = pcall(fn, ...) return not ok or r == nil end assert(math.pi > 3.14 and math.huge > 1e308 and math.maxinteger + 1 == math.mininteger) assert(math.abs(-3) == 3 and math.abs(-2.5) == 2.5 and math.abs(math.mininteger) == math.mininteger) assert(math.ceil(2.1) == 3 and math.ceil(4) == 4 and math.floor(-2.1) == -3 and math.floor(7) == 7 and math.type(math.floor(2.5)) == 'integer' and math.floor(1e300) == 1e300) assert(math.fmod(7, 3) == 1 and math.fmod(-7, 3) == -1 and math.fmod(7.5, 2) == 1.5 and math.fmod(math.mininteger, -1) == 0) assert(fails(math.fmod, 1, 0)) local i, f = math.modf(3.7) assert(i == 3 and math.abs(f - 0.7) < 1e-9) i, f = math.modf(-3.5) assert(i == -3 and f == -0.5) i, f = math.modf(5) assert(i == 5 and f == 0) i, f = math.modf(math.huge) assert(i == math.huge and f == 0) assert(math.sqrt(16) == 4 and math.exp(0) == 1 and math.log(1) == 0 and math.log(8, 2) == 3 and math.log(100, 10) == 2 and math.abs(math.log(27, 3) - 3) < 1e-9) assert(math.sin(0) == 0 and math.cos(0) == 1 and math.tan(0) == 0 and math.asin(0) == 0 and math.acos(1) == 0 and math.atan(0) == 0 and math.abs(math.atan(1, 1) - math.pi / 4) < 1e-9) assert(math.ult(1, 2) and not math.ult(-1, 2)) assert(fails(math.ult, 1.5, 2)) assert(fails(math.ult, 1, 2.5)) assert(select('#', math.max(1, 5)) == 1 and math.max(1, 5, 3) == 5 and math.min(4, 2.5, 9) == 2.5 and math.max(2) == 2) assert(fails(math.max)) assert(fails(math.min)) assert(math.type(1) == 'integer' and math.type(1.0) == 'float' and math.type('1') == nil) assert(math.tointeger(3.0) == 3 and math.tointeger(3.5) == nil and math.tointeger('8') == 8 and math.tointeger({}) == nil and math.tointeger(2^63) == nil) local r = math.random() assert(r >= 0 and r < 1) r = math.random(6) assert(r >= 1 and r <= 6) r = math.random(-3, 3) assert(r >= -3 and r <= 3) assert(math.type(math.random(0)) == 'integer') r = math.random(1, 1000) assert(r >= 1 and r <= 1000) r = math.random(math.mininteger, math.maxinteger) assert(fails(math.random, 3, 1)) assert(fails(math.random, 1, 2, 3)) assert(fails(math.random, 1.5)) assert(fails(math.random, 1, 2.5)) local a, b = math.randomseed(42) assert(a == 42 and b == 0) local x = math.random(1, 100) math.randomseed(42, 0) assert(math.random(1, 100) == x) math.randomseed(7, 9) assert(fails(math.randomseed, 1.5)) assert(fails(math.randomseed, 1, 2.5)) a, b = math.randomseed() assert(math.type(a) == 'integer') print('math ok')'''
tool_contains = ['"run_id":1']

[logs]
# Every check in the script is an assert, so success means all of them held.
await = ["VM run 1 finished: Success, 1 output line"]
