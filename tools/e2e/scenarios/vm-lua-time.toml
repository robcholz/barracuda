name = "Lua UTC time API"
description = "A real model runs a Lua script that checks the vm-time os.time, os.date, and os.difftime functions: every conversion specifier, weekday and month names, calendar-table normalization, and the format and range errors."

[model]
mode = "recorded"

[[steps]]
send = '''Load the vm tools and call vm_run exactly once with the Lua source below, copied character for character as one single line without any change. Then reply with only the word started. Lua source: local function fails(fn, ...) local ok, r = pcall(fn, ...) return not ok or r == nil end local now = os.time() assert(now > 1700000000) assert(#os.date() > 10) assert(os.date('!*t').isdst == false) local t = 1700000000 assert(os.date('%%|%a|%A|%b|%h|%B|%C|%d|%D|%e|%F|%g|%G|%H|%I|%j|%m|%M|%p|%r|%R|%S|%T|%u|%U|%V|%w|%W|%y|%Y|%z|%Z', t) == '%|Tue|Tuesday|Nov|Nov|November|20|14|11/14/23|14|2023-11-14|23|2023|22|10|318|11|13|PM|10:13:20 PM|22:13|20|22:13:20|2|46|46|2|46|23|2023|+0000|UTC') assert(os.date('!%c', t) == 'Tue Nov 14 22:13:20 2023') assert(os.date('%Ec|%Oy|%n|%t', t) == 'Tue Nov 14 22:13:20 2023|23|' .. string.char(10) .. '|' .. string.char(9)) assert(os.date('%I %p', 1704067200 + 18000) == '05 AM') assert(os.date('%I', 1704067200) == '12') local days, months = {}, {} for i = 0, 6 do days[#days + 1] = os.date('%a %A', i * 86400) end for m = 1, 12 do months[#months + 1] = os.date('%b %B', os.time({year = 2024, month = m, day = 1})) end assert(table.concat(days, ',') == 'Thu Thursday,Fri Friday,Sat Saturday,Sun Sunday,Mon Monday,Tue Tuesday,Wed Wednesday') assert(table.concat(months, ',') == 'Jan January,Feb February,Mar March,Apr April,May May,Jun June,Jul July,Aug August,Sep September,Oct October,Nov November,Dec December') local d = os.date('*t', 0) assert(d.year == 1970 and d.month == 1 and d.day == 1 and d.wday == 5 and d.yday == 1) assert(os.time({year = 1970, month = 1, day = 1}) == 43200) assert(os.time({year = 2024, month = 14, day = 1}) == os.time({year = 2025, month = 2, day = 1, hour = 12})) local n = {year = 2024, month = 1, day = 32, hour = 25, min = 61, sec = 61} os.time(n) assert(n.month == 2 and n.day == 2 and n.hour == 2 and n.min == 2 and n.sec == 1) assert(os.time({year = 2024, month = 0, day = 0, hour = -1}) < os.time({year = 2024, month = 1, day = 1})) assert(os.difftime(10, 4) == 6) assert(fails(os.date, string.rep('x', 300), t)) assert(fails(os.date, '%Q', t)) assert(fails(os.date, '%', t)) assert(fails(os.date, '%E', t)) assert(fails(os.date, 5, t)) assert(fails(os.date, '%Y', 1e15)) assert(fails(os.time, {})) assert(fails(os.time, {year = 2024})) assert(fails(os.time, {year = 2024, month = 1})) assert(fails(os.time, {year = 1e15, month = 1, day = 1})) assert(fails(os.time, {year = 2024, month = 1, day = 1e15})) print('time ok')'''
tool_contains = ['"run_id":1']

[logs]
# Every check in the script is an assert, so success means all of them held.
await = ["VM run 1 finished: Success, 1 output line"]
