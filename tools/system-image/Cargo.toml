[package]
name = "barracuda-system-image"
version = "0.1.0"
edition = "2021"
description = "Host tool for building the selected Barracuda System image"

[[bin]]
name = "barracuda-system-image"
path = "src/main.rs"

[dependencies]
anstream = "1"
barracuda-board-config.workspace = true
barracuda-cli-style.workspace = true
barracuda-platform-config.workspace = true
barracuda-plugin = { workspace = true, features = ["manifest"] }
barracuda-vfs.workspace = true
barracuda-vfs-fat.workspace = true
clap = { version = "4", features = ["derive"] }
critical-section = { version = "1", features = ["std"] }
embedded-io = "0.7"
embedded-io-async = "0.7"
esp-idf-part = "0.6.0"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
futures-lite = "2"
generic-array = "0.14"
littlefs2 = { version = "0.8", default-features = false, features = ["alloc", "c-stubs"] }
serde = { version = "1", features = ["derive"] }
yaml-peg = { version = "1.0.8", features = ["serde"] }

[dev-dependencies]
barracuda-vfs-littlefs.workspace = true
embedded-storage = "0.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
